[47,4,1,"Define evaluation metrics (accuracy, latency, cost, safety, security)","発注書抽出はフィールド単位で99.1%正確です。通貨または仕入先口座の誤りは高額誤送金につながる一方、任意メモの影響は低いです。最適なリリース基準はどれですか。","A purchase-order extractor is 99.1% accurate per field. A wrong currency or supplier account can cause a large payment, while optional notes are low impact. Which release criterion is best?",
  ["A","全フィールドが分母へ同等に寄与するため、総合精度が99%を超えたらリリースする。","Release when aggregate field accuracy exceeds 99%, because all fields contribute equally to the denominator.","誤り。多数の低リスク項目が重大項目の失敗を隠し、業務損失を反映しません。"],
  ["B","重大項目と任意項目を含む全テスト文書で完全一致するまで、監視付きの限定配備も認めない。","Require exact match on every critical and optional field in every test document before allowing even a limited monitored deployment.","誤り。最大限安全な基準ですが、低影響の任意項目までゼロ欠陥を求め、リスクに応じた人手確認や段階導入を不必要に排除します。"],
  ["C","レビュー担当者が注文全体を確認するため、満足度と平均修正時間をリリース判定に使う。","Use reviewer satisfaction plus average correction time as the release gate because reviewers inspect each complete purchase order.","誤り。運用負荷の指標にはなりますが、低頻度で重大な通貨・口座誤りの個別閾値や停止条件になりません。"],
  ["D","重大フィールドには個別の高い閾値と人手レビュー条件を置き、総合品質・遅延・コストのガードレールも設ける。","Set separate high thresholds and human-review triggers for critical fields, plus aggregate quality, latency, and cost guardrails.","正しい。リスクを重要項目へ対応付けつつ、運用品質を多次元で判定できる受入基準です。"],
  ["D"]],
[48,4,2,"Design evaluation datasets and test frameworks using mixed methodologies","多言語の出張規程支援は、検索元と同じハンドブックから生成した合成・単一ターン質問だけで評価されています。本番にはスキャンされた改訂、曖昧な追質問、地域例外があります。リリース信頼度を最も高めるデータセット変更を2つ選択してください。","A multilingual travel-policy assistant is evaluated only with synthetic, single-turn questions generated from the same handbook used for retrieval. Production includes scanned amendments, ambiguous follow-ups, and regional exceptions. Which TWO dataset changes most improve release confidence? Select TWO.",
  ["A","同じハンドブックから多言語の言い換えを追加し、規程段落と言語ごとの質問数を均等にする。","Generate additional multilingual paraphrases from the same handbook and balance question counts across policy paragraphs and languages.","誤り。資料内の被覆と多言語バランスは改善しますが、同一資料由来の合成偏りやスキャン・追質問の本番分布を解消しません。"],
  ["B","言語・地域・スキャン品質・会話パターンで層化した、匿名化済みの本番類似事例を加える。","Add carefully de-identified production-like cases stratified by language, region, scan quality, and multi-turn conversation pattern.","正しい。本番分布と重要な部分集団を明示的に覆い、平均値で隠れる失敗を測定できます。"],
  ["C","競合する改訂、根拠のない回答、確認質問が必要な場合について、専門家ラベル付き難例を作る。","Create expert-labeled multilingual adversarial cases for conflicting amendments, unsupported answers, and cases requiring clarification.","正しい。高リスク境界と望ましい棄権・確認動作を評価でき、単純な正答一致を超えた安全性を検証します。"],
  ["D","全言語で校正した単一LLM判定を使い、一部だけ人手監査を残して、それ以外の専門家ラベルを置き換える。","Use one calibrated LLM judge for every language, retain a small human audit sample, and replace the remaining expert labels.","誤り。採点拡張には有用でも、地域例外や競合改訂の基準を十分な専門家ラベルなしで置換すると判定偏りを固定化します。"],
  ["B","C"]],
[49,4,1,"Conduct A/B testing and iterative improvements","低コストモデルのA/Bテストでは、タスク成功率が事前登録した非劣性マージン内で、コストは28%減りましたが、p95遅延が合意済みガードレールを420ms超過しました。差は統計的に信頼できます。チームはどうすべきですか。","An A/B test of a cheaper model keeps task success within the pre-registered non-inferiority margin and cuts cost 28%, but its p95 latency exceeds the agreed guardrail by 420 ms. The result is statistically reliable. What should the team do?",
  ["A","まだ昇格せず、遅延を改善するか、関係者とガードレールを見直してから新たな判断テストを行う。","Do not promote it yet; investigate latency or revise the guardrail with stakeholders before running a new decision test.","正しい。事前合意した制約を結果確認後に無視せず、改善または明示的な再合意を次の実験へ反映します。"],
  ["B","非劣性のタスク成功率と実測コスト削減が、この完了済みテストでは遅延ガードレールを上回るため昇格する。","Promote the cheaper model because non-inferior task success and measured savings outweigh the latency guardrail for this completed test.","誤り。問題文にない優先順位を結果確認後に導入し、事前合意した遅延ガードレールを事後的に無効化しています。"],
  ["C","p95差が統計的有意性を下回るまで同じ案へトラフィックを追加し、その後に昇格を判断する。","Continue the same variants with additional traffic until the p95 difference crosses below statistical significance, then make the promotion decision.","誤り。信頼できる違反をサンプル追加で消そうとするのは停止規則を歪め、実際のレイテンシを改善しません。"],
  ["D","正規化したコストと遅延の変化を重み付き単一スコアにまとめ、全体改善率が大きい案を昇格する。","Combine normalized cost and latency changes into one weighted score, then promote the variant with the larger overall percentage improvement.","誤り。事前合意のない重みで異なる業務影響を相殺し、独立したガードレール違反を隠します。"],
  ["A"]],
[50,4,1,"Diagnose system issues (prompt failure, hallucinations, model mismatch)","短いインシデント要約を小型モデルへルーティングした後、検索recallとJSON妥当性は安定していますが、2つの異なる根本原因を統合する失敗が増えました。最適な次の診断手順はどれですか。","After routing short incident summaries to a smaller model, retrieval recall and JSON validity remain stable, but the model often merges two distinct root causes. What is the best next diagnostic step?",
  ["A","複数原因インシデントの検索top-kを増やし、より広い補足コンテキストで小型モデルが原因を分離できるか比較する。","Increase retrieval top-k for multi-cause incidents and compare whether the smaller model separates causes when given broader supporting context.","誤り。検索recallは安定しているため、追加候補は原因分離を診断せず注意を薄める新しい変数になり得ます。"],
  ["B","同一プロンプト・同一検索コンテキストで、複数原因の例を両モデルに通す統制比較を行う。","Run a controlled slice on multi-cause examples across both models with identical prompts and retrieved context.","正しい。検索と形式を固定し、失敗がモデル能力・ルーティング境界に由来するかを直接検証できます。"],
  ["C","原因別の識別子と長いプロパティ説明を持つJSONスキーマへ書き換え、小型モデルだけを再実行する。","Rewrite the JSON schema with separate cause identifiers and longer property descriptions, then rerun only the smaller model.","誤り。スキーマ改善としては妥当でも、両モデルを同条件で比較する前に形式層を変えるため、モデル能力への原因帰属ができません。"],
  ["D","構造化出力を無効化し、成功例と失敗例の文章長を比較する。","Disable structured output and compare prose length between successful and failed cases.","誤り。JSON妥当性は問題でなく、出力契約を外すと新しい変数を増やして診断を曖昧にします。"],
  ["B"]],
[51,4,1,"Monitor system performance using logging and observability tools","新しいプロンプトは、2回のツール呼出を要する返金案件だけへ影響します。該当案件が少ないため全体成功率は横ばいです。最も早く回帰を検知する本番監視はどれですか。","A new prompt affects only refund cases that require two tool calls. Overall success remains flat because those cases are rare. Which production monitor best detects regression early?",
  ["A","全サポート会話の週次平均回答長と最終満足度にアラートを設定する。","Alert on weekly average answer length and final satisfaction across all support conversations.","誤り。対象フローの成功と弱くしか関係せず、希少案件が平均に埋もれます。"],
  ["B","配備コホート別に総ツール呼出量、集計エラー、全体遅延を比較するが、操作種別と段階ラベルは付けない。","Compare deployment cohorts by total tool-call volume, aggregate errors, and overall latency, but omit operation and stage labels.","誤り。版ごとの全体傾向は見えますが、希少な返金フローと2回の各呼出結果を分離できません。"],
  ["C","トレースを版管理し、最小件数処理を含めて2段階返金スライスの各段階成功率・遅延・エラー理由を追跡する。","Version traces and track stage-level success, latency, and error reason for the two-call refund slice with minimum-volume handling.","正しい。変更版と対象コホートを結び、少数標本の扱いも明示して局所回帰を直接監視できます。"],
  ["D","全サポート会話を層化して月次抽出し、単一の総合rubricで確認して配備全体の合格率を公開する。","Review a stratified monthly sample of all support conversations with one aggregate rubric and publish a single deployment pass rate.","誤り。層化人手評価は有用でも、月次かつ単一集計では対象フローの段階別回帰を早期検出できません。"],
  ["C"]],
[52,5,1,"Implement guardrails and safety controls","購買支援は購入申請を下書きできます。方針は閾値超過時の予算責任者承認、制限業者の拒否、購買サービスだけによる実行を要求します。最適な統制設計はどれですか。","A procurement assistant may draft purchase requests. Policy requires budget-owner approval above a threshold, blocks restricted suppliers, and permits execution only by the procurement service. Which control design is best?",
  ["A","業者と承認の方針をシステムプロンプトへ置き、各例外を最終回答でClaudeに説明させる。","Put the supplier and approval policy in the system prompt and require Claude to explain each exception in its final answer.","誤り。行動誘導にはなりますが、モデル出力だけでは業者・承認・実行主体を強制できません。"],
  ["B","閾値未満はClaude自身のツールで実行し、プロンプトで業者一覧を強制して、決済後に全件監査する。","Let Claude execute requests below the threshold through its own tool, enforce the supplier list in the prompt, and audit every settlement afterward.","誤り。全件監査をしても購買サービスだけが実行するという明示制約に反し、禁止業者の処理を事前に強制できません。"],
  ["C","制限のない業者や閾値未満も含め、下書きの表示または下流送信前に購買担当者の全件承認を求める。","Require procurement staff to approve every draft, including unrestricted suppliers below the threshold, before display or downstream submission.","誤り。必要以上の人手確認で安全にはなりますが、閾値ベースの承認要件を超え、下書き段階の生産性を損ないます。"],
  ["D","業者と閾値を決定的コードで検証し、必要な承認を取得後、最小権限サービスが監査記録付きで実行する。","Validate supplier and threshold in deterministic code, capture required approval, then let a least-privileged service execute with an audit record.","正しい。モデルを提案に限定し、業務規則・承認・実行権限を信頼できる境界で強制します。"],
  ["D"]],
[53,5,2,"Identify risks, limitations, and failure modes of LLM systems","公共給付支援は6時間ごとに更新される規程ページから回答します。受給資格はチャットで収集しない事実に依存する場合があり、利用者は流暢な見積りを公式決定と受け取る可能性があります。公開前に最も重要な対策を2つ選択してください。","A public benefits assistant answers from policy pages updated every six hours. Eligibility can depend on facts not collected in chat, and users may treat a fluent estimate as an official decision. Which TWO mitigations are most important before launch? Select TWO.",
  ["A","一部事実が不足していても明確な受給見積りを示すため、大型モデルを使い自信のある表現を要求する。","Use a larger model and require confident wording so users receive clear eligibility estimates even when some facts are unavailable.","誤り。モデル規模や断定表現は情報の鮮度と未収集事実を解消せず、流暢な回答への過信を強めます。"],
  ["B","根拠の時刻と引用を表示し、証拠が古い・不足・競合する場合は回答を控えるか窓口へ誘導する。","Show source timestamps and citations, and abstain or route users when evidence is stale, missing, or conflicting.","正しい。鮮度と根拠の限界を可視化し、検索で支えられない生成を抑制します。"],
  ["C","引用付き回答を1週間キャッシュし、利用者が規程不一致や矛盾を報告した場合だけ更新する。","Cache cited answers for one week and refresh them only when a user reports a policy mismatch or contradictory result.","誤り。引用を保持しても6時間更新の情報を古いまま再利用し、利用者報告まで鮮度問題を検知できません。"],
  ["D","回答を参考情報と明示し、権限ある正式判定プロセスへの明確な経路を示す。","Label responses as informational and provide a clear path to the authorized determination process.","正しい。支援回答と公式決定の責任境界を明確にし、過信による不利益を減らします。"],
  ["B","D"]],
[54,5,1,"Apply human-in-the-loop validation strategies","臨床コード支援は候補コードを順位付けします。希少な重症状態の見逃しは高コストですが、低リスク候補を全件レビューすると生産性効果が失われます。最適な人手レビュー戦略はどれですか。","A clinical coding assistant ranks suggested codes. Missing a rare high-severity condition is costly, but reviewing every low-risk suggestion would erase the productivity benefit. Which human-review strategy is best?",
  ["A","重症・低信頼・証拠競合の案件と、抽出した低リスク案件をレビューし、裁定結果を監視へ戻す。","Require review for high-severity, low-confidence, conflicting-evidence, and sampled low-risk cases; feed adjudications into monitoring.","正しい。影響と不確実性でレビューを集中しつつ、低リスク標本で盲点やドリフトも測定できます。"],
  ["B","モデルが明示的に不確実と述べた案件だけをレビューする。","Review only cases where the model explicitly says it is uncertain.","誤り。モデルの自己申告は完全な校正指標ではなく、自信のある誤りや重症条件を見逃します。"],
  ["C","初年度は全候補をレビューし、総合精度を毎月測定して、スコア安定後に必須レビューを外す。","Review every suggestion during the first year, measure aggregate accuracy monthly, and remove mandatory review after the score stabilizes.","誤り。初期安全策としては強いものの生産性制約に反し、総合値だけでは希少な重症リスクやドリフトを管理できません。"],
  ["D","全候補から無作為に1%をレビューし、総合エラー率が上昇した場合だけ抽出率を増やす。","Review a random 1% sample across all suggestions and increase the sample only when aggregate error rates rise.","誤り。全体傾向の推定には使えますが、希少な重症・低信頼案件を影響に応じて優先停止できません。"],
  ["A"]],
[55,5,1,"Ensure compliance with regulations (e.g., GDPR, HIPAA, FedRAMP)","サポート部門は、EU顧客データを含む全チャットを、用途未定の将来モデル改善のため無期限保存したいと考えています。顧客は削除を要求できます。アーキテクトは何を推奨すべきですか。","A support team wants to retain all chats containing EU customer data indefinitely for unspecified future model improvement. Customers can request deletion. What should the architect recommend?",
  ["A","暗号化した生チャットを制限付き保管庫へ無期限保存し、鍵を定期更新して、要求時はサポートシステム側だけ削除する。","Keep encrypted raw chats indefinitely in a restricted archive, rotate keys regularly, and delete only the support-system copy on request.","誤り。暗号化とアクセス制限は保護策ですが、目的限定・保存期間を満たさず、派生保管庫まで削除要求を履行できません。"],
  ["B","承認済み目的と保存期間を定め、データを最小化または匿名化し、派生保存先まで削除を実施して責任者を文書化する。","Define approved purposes and retention periods, minimize or de-identify data, enforce deletion across derived stores, and document ownership.","正しい。用途・最小化・期限・削除可能性をライフサイクル全体へ落とし込み、運用責任も明確にします。"],
  ["C","チャットを別管理の分析アカウントへ出力して直接識別子を除き、削除要求は元のサポートシステムだけで履行する。","Export chats to a separately governed analytics account, remove direct identifiers there, and honor deletion only in the originating support system.","誤り。分離と識別子除去はリスクを下げますが、再識別可能な派生データを削除対象外にすると要求を完全に履行できません。"],
  ["D","将来の評価案件ごとに、分析担当者へ有用性の根拠を文書化させ、保存チャットの選択前に管理者承認を求める。","Require analysts to document expected usefulness and obtain manager approval before selecting retained chats for each future evaluation project.","誤り。案件単位の承認は用途審査に役立ちますが、収集時の目的、保存期限、横断的な削除統制を確立しません。"],
  ["B"]],
[56,5,1,"Address ethical AI considerations (bias, fairness, transparency)","採用支援は過去の面接メモで候補者を順位付けします。ある地域の応募者は別プロセスだったためメモが少なく、順位が低くなっています。最適な対応はどれですか。","A hiring assistant ranks candidates using historical interview notes. Applicants from one region have fewer notes because that office used a different process, and they receive lower rankings. What is the best response?",
  ["A","地域と拠点プロセスをプロンプトへ加え、少ないメモを補正するようClaudeへ指示し、地域別の異常な低得点を確認する。","Add region and office process to the prompt, instruct Claude to compensate for sparse notes, and review unusually low regional scores.","誤り。事後確認はできますが、検証済みの補正規則がなく、地域を代理変数として不透明に順位へ反映する危険があります。"],
  ["B","表示出力とモデル指示から地域を除き、既存のメモ特徴量を維持して、全地域へ同じ順位閾値を適用する。","Remove region from displayed output and model instructions, keep the existing note features, and apply the same ranking threshold everywhere.","誤り。明示的な地域名を隠しても、地域別プロセスによる欠損が代理変数として残り、結果差を修正できません。"],
  ["C","重要判断への利用を止め、コホート別の性能と選抜率を分析し、欠損処理を再設計して適格なレビュー担当者が検証する。","Pause consequential use, analyze performance and selection rates by cohort, redesign missing-data handling, and validate with qualified reviewers.","正しい。観測された不均衡を測定し、原因となるデータ工程を修正してから人間の責任下で再受入します。"],
  ["D","全応募者の順位閾値を下げ、地域別の選抜人数を監視し、格差が残る場合だけ再検討する。","Lower the ranking threshold for every applicant, monitor the number of selected candidates by region, and revisit only if disparities remain.","誤り。全体通過数の調整と事後監視では、欠損に起因する順位差や予測妥当性を公開前に解消できません。"],
  ["C"]],
[57,6,1,"Conduct structured discovery and requirement gathering","小売企業が、価格・在庫・仕入先連絡を横断する全社的な「マーチャンダイジング支援」を求めています。最初に自動化する判断で部門が対立し、リスクを引き受ける責任者もいません。ディスカバリーで最初に作るべきものはどれですか。","A retailer asks for an enterprise 'merchandising copilot' spanning pricing, inventory, and supplier communication. Teams disagree on the first decision to automate and no owner accepts the risk. What should discovery produce first?",
  ["A","全データソース、自動化する判断経路、統合依存関係、全社展開段階を網羅した完全な目標アーキテクチャ。","A complete target architecture mapping every data source, automated decision path, integration dependency, and enterprise rollout phase.","誤り。将来像の整理には使えますが、価値ある最初の判断、リスク責任者、受入条件が未確定のため過剰設計になります。"],
  ["B","業務フローの責任者を決める前に、価格・在庫・仕入先連絡の全領域で最高得点のClaudeモデルを選ぶベンチマーク。","A benchmark choosing one highest-scoring Claude model across pricing, inventory, and supplier communication before workflow ownership is assigned.","誤り。技術候補の比較にはなりますが、対象業務、成果指標、リスク所有の不一致を先に解決できません。"],
  ["C","全機能の全社展開日、機能一覧、人員前提、納入マイルストーンを固定するベンダー作業範囲記述書。","A vendor statement of work fixing an enterprise rollout date, feature list, staffing assumptions, and delivery milestones for all functions.","誤り。調達計画には使えても、要件と責任分界を発見する前に全社範囲と日程を固定する順序が誤っています。"],
  ["D","利用者・責任者・現行フロー・リスク・測定可能な成果・限定パイロット候補を示す優先順位付き判断マップ。","A prioritized decision map naming users, owner, current workflow, risks, measurable outcome, and a bounded pilot candidate.","正しい。誰のどの判断を改善するかと受入責任を先に合意し、検証可能な小範囲へ落とします。"],
  ["D"]],
[58,6,2,"Communicate architectural decisions and trade-offs","経営層は、安定した700ページのマニュアルを各要求へ入れる案と、検索基盤を構築する案から選びます。製品部門は引用網羅性、財務は予測可能な費用、運用は更新容易性を重視します。意思決定を最も支える成果物を2つ選択してください。","Leaders must choose between putting a 700-page stable manual in each request and building retrieval over it. Product values citation completeness, finance values predictable cost, and operations values update simplicity. Which TWO artifacts best support the decision? Select TWO.",
  ["A","測定した品質、コンテキスト費用・遅延、更新経路、障害モード、採用閾値を比較する意思決定記録。","A decision record comparing measured quality, context cost/latency, update path, failure modes, and the chosen threshold.","正しい。各関係者の関心を同じ測定軸へ結び、選択と前提を後から追跡できます。"],
  ["B","この規模のマニュアルでは検索が標準だと宣言し、一般的アーキテクチャとベンダー費用見積りを添えた資料。","A presentation declaring retrieval the standard for manuals of this size, supported by a generic architecture and vendor cost estimate.","誤り。候補説明にはなりますが、この文書での引用品質、実測費用、更新負荷を両案で比較する証拠になりません。"],
  ["C","引用被覆とタスク成功に加え、トークン・遅延・索引・ランブック費用を示す代表評価。","A representative evaluation showing citation coverage and task success alongside token, latency, indexing, and runbook costs.","正しい。両案を同じ本番類似ケースで比較し、品質と総運用コストを測定可能にします。"],
  ["D","関係者が選択基準を承認する前に完成させる、検索案の本番用コンポーネント・配備・運用設計。","A production-ready component, deployment, and operations design for retrieval, completed before stakeholders approve the architecture selection criteria.","誤り。採用後の実装には有用ですが、一案だけを先に詳細化しても比較根拠にならず、意思決定前の過剰設計です。"],
  ["A","C"]],
[59,6,1,"Manage stakeholder feedback loops and expectation alignment","パイロット中、営業は流暢な回答を成功と呼びますが、コンプライアンスは引用付き回答が1営業日以内のレビューを通過した場合だけ成功と数えます。アーキテクトは期待値をどう整合させるべきですか。","During a pilot, sales calls any fluent answer a success, while compliance counts success only when a cited answer passes review within one business day. How should the architect align expectations?",
  ["A","各部門の成功率を固有ラベル、レビュー周期、注意点とともに報告し、共通定義の合意は公開時まで延期する。","Report each team's success rate with its own labels, review cadence, and caveats, then postpone a shared definition until launch.","誤り。差異の透明化には役立ちますが、次の判定でも同じパイロットを異なる成功概念で評価する状態が残ります。"],
  ["B","次のパイロット判定前に、運用上の成功定義、レビューSLA、除外条件、責任者、ダッシュボード計算式を合意する。","Agree on an operational success definition, review SLA, exclusions, owner, and dashboard calculation before the next pilot gate.","正しい。観測可能な定義と責任分界をリリース判断前に固定し、部門間で同じ結果を再現できます。"],
  ["C","パイロットでは営業の流暢回答定義を使い、コンプライアンス結果は別記録にして、本番開始後に審査済み定義へ切り替える。","Use sales' fluent-answer definition during the pilot, record compliance outcomes separately, and switch to the reviewed definition after production begins.","誤り。二つの指標は収集できても、公開前の判定に引用審査と1営業日の受入条件を反映しない順序が誤っています。"],
  ["D","両定義を平均利用者満足度と回答流暢性に置き換え、部門責任から独立した単一ダッシュボードで管理する。","Replace both definitions with average user satisfaction and response fluency, using one dashboard that is independent of departmental ownership.","誤り。横断指標にはなりますが、引用審査の合否と1営業日の期限という明示的な業務成果を測れません。"],
  ["B"]],
[60,6,1,"Document architectures and provide implementation guidance","2チームが同じ書込みツールを異なって実装しています。一方は全タイムアウト後に再試行し、もう一方は結果不明時に停止します。安全な引継ぎに最も有用な文書変更はどれですか。","Two teams implement the same write tool differently: one retries after any timeout, while the other stops when the outcome is unknown. What documentation change is most useful for safe handoff?",
  ["A","成功時ユーザージャーニーのスクリーンショットをアーキテクチャ概要へ追加する。","Add more screenshots of the successful user journey to the architecture overview.","誤り。利用像は明確になりますが、結果不明・重複書込み時の実装契約を定義しません。"],
  ["B","冪等性キー、タイムアウト状態、再試行上限、照合、責任者、受入テストのシーケンス図と契約を定める。","Specify sequence diagrams and contracts for idempotency keys, timeout states, retry limits, reconciliation, ownership, and acceptance tests.","正しい。曖昧な障害意味論を実装可能な規則と検証条件へ変換し、チーム間の安全動作を揃えます。"],
  ["C","各チームに再試行ライブラリを選ばせつつ、版、共通タイムアウト既定値、重複書込みの共有ダッシュボードを必須にする。","Allow each team to choose a retry library, but require documented versions, common timeout defaults, and a shared dashboard of duplicate writes.","誤り。部品追跡と重複監視には役立ちますが、結果不明時の再試行可否、冪等性、照合手順を実装契約として統一しません。"],
  ["D","再試行判断を中央で版管理するプロンプトへ移し、全ツール試行を記録して、アプリコード再配備なしで動作を更新する。","Move retry decisions into a centrally versioned prompt, log every tool attempt, and update behavior without redeploying application code.","誤り。運用変更は容易でも、決定的な書込み安全性をモデル判断へ移し、強制可能な障害時契約を弱めます。"],
  ["B"]],
[61,6,1,"Support lifecycle phases","モデル更新と規程インデックス再構築を同時に予定しています。プロンプト、モデル、インデックス、評価器の版が記録されず、現行ベースラインを再現できません。最初に確立すべきライフサイクル実践はどれですか。","A model upgrade and a policy-index rebuild are planned together. The team cannot reproduce the current baseline because prompt, model, index, and evaluator versions were not recorded. What lifecycle practice should be established first?",
  ["A","両変更を同時に少量トラフィックへ配備し、タグ付き利用者コメントから回帰原因を推定する。","Deploy both changes together to a small traffic percentage and infer the source of any regression from tagged user comments.","誤り。限定配備は有用ですが、基準構成が不明で変更も同時のため原因帰属できません。"],
  ["B","代替アーキテクチャ、完全な移行計画、新しい運用プロセスが承認されるまで、モデル・プロンプト・規程変更をすべて凍結する。","Freeze model, prompt, and policy changes until a replacement architecture, complete migration plan, and new operating process receive approval.","誤り。一時的な変更停止はリスクを下げますが、再現可能な基準と段階的変更管理を作るより過大で、必要な規程更新も妨げます。"],
  ["C","版管理されたリリースmanifestと再現可能な評価基準を作り、ロールバック条件付きで限定要素を一つずつ変更する。","Create a versioned release manifest and reproducible eval baseline, then change one bounded component at a time with rollback criteria.","正しい。構成と証拠を結び付け、変更影響を隔離して安全に反復・引継ぎできます。"],
  ["D","最新モデルを固定し、複数チャンクサイズで索引を再構築して総合スコアを比較し、最良実行の成果物だけを保持する。","Fix the newest model, rebuild indexes with several chunk sizes, compare aggregate scores, and retain artifacts only for the best run.","誤り。探索としては可能でも、不採用版を含む構成と評価器を記録しないため再現性がなく、総合値で局所回帰も隠れます。"],
  ["C"]],
[62,7,1,"Improve developer workflows using AI-assisted tooling","基盤チームは複数リポジトリのSDK保守を週次運用へ標準化します。Claude Codeには変更案の作成と検証を任せますが、本番コードのマージは許可しません。受入条件は、再現可能な依存解決、影響範囲に応じたテスト、脆弱性確認、レビュアーが追跡できる証拠です。適切な実行方式はどれですか。","A platform group is standardizing weekly SDK maintenance across several repositories. Claude Code may prepare and verify each change, but it must not merge production code. Acceptance requires reproducible dependency resolution, impact-scoped tests, a vulnerability check, and evidence a reviewer can trace. Which execution model fits?",
  ["A","分離ブランチまたはworktreeとリポジトリ指示を使い、Claudeに限定更新と必須検査を行わせ、証拠付きのレビュー可能な変更を作る。","Use an isolated branch or worktree with repository instructions, let Claude make the bounded update and run required checks, then open a reviewable change with evidence.","正しい。反復作業を自動化しつつ、保護ブランチ、検査証拠、人間レビューという責任境界を維持します。"],
  ["B","コンパイル後のパッチ更新ではClaudeへ保護ブランチ直接書込を許可し、生成差分とテストログを保存して週次要約をレビューする。","Grant Claude direct protected-branch access for patch upgrades after compilation, archive generated diffs and test logs, and review a weekly digest.","誤り。証拠は残せますが、明示された変更単位の事前レビューを迂回し、問題のある更新を保護ブランチへ入れてから発見します。"],
  ["C","Claudeを版推奨とリリースノート要約だけに限定し、開発者がファイル更新、必須検査、レビュー証拠作成をすべて手作業する。","Limit Claude to version recommendations and release-note summaries; developers manually update files, run every required check, and assemble review evidence.","誤り。責任境界は安全ですが、分離環境で限定変更と検査を準備できる範囲まで排除し、求める生産性改善を満たしません。"],
  ["D","全依存関係を一括更新してロックファイルを再生成し、コンパイル成功時に一括マージする無人ジョブを動かす。","Run one unattended job that upgrades all dependencies, regenerates the lockfile, and merges the batch when compilation succeeds.","誤り。対象テスト、セキュリティ検査、人間レビューを満たさず、変更範囲も過大です。"],
  ["A"]],
[63,7,2,"Configure Claude tools and environments for teams","共有Claude Code PreToolUseフックはシークレットを含むコミットをブロックし、変更ファイルを整形します。Linuxでは動きますがWindowsで改行を壊し、誤検知後に開発者がフック全体を迂回しています。統制を弱めず信頼性を高める対応を2つ選択してください。","A shared Claude Code PreToolUse hook blocks commits containing secrets and formats changed files. It works on Linux but corrupts line endings on Windows, and developers bypass the whole hook after false positives. Which TWO actions improve reliability without weakening the control? Select TWO.",
  ["A","シークレット検知と整形を全OSで助言扱いにし、警告ログを残して、マージ前のレビュー担当者へ判断を委ねる。","Make both secret detection and formatting advisory on every platform, preserve warning logs, and rely on reviewers before merge.","誤り。ログとレビューは残りますが、シークレットの事前ブロックを助言へ変えるため、統制を明確に弱めます。"],
  ["B","全開発者に管理されたリモートLinux環境でフックを実行させ、ツールを標準化してログを集中保管する。","Require all developers to run the Linux hook through a managed remote environment, with standardized tools and centrally retained logs.","誤り。環境差は回避できますが、開発体験と運用負荷が大きく、OS別検査を移植可能にするより必要以上の設計です。"],
  ["C","ブロック型シークレット検知と整形を分離し、OS対応コマンドと正規化テストfixtureを使い、両OS経路をCIで検査する。","Separate blocking secret detection from formatting, use platform-aware commands and normalized test fixtures, and test both OS paths in CI.","正しい。安全統制を独立維持しながら、改行差と誤検知を再現可能に検証できます。"],
  ["D","フック無効化ではなく、限定抑制、責任者承認、有効期限、監査ログを持つ文書化済み例外手順を定める。","Define a documented exception flow with narrow suppressions, owner approval, expiry, and audit logs instead of disabling the hook.","正しい。正当な誤検知を処理しつつ、恒久的・無記録な迂回を防ぎ、統制責任を明確にします。"],
  ["C","D"]],
[64,7,1,"Configure subagents and context isolation","支援チームは、コードベース調査と実装を混在させた長いClaude Codeセッションが、コンテキスト上限付近で急激に劣化することを確認しました。序盤の調査結果が考慮されなくなり、新しい編集がそれと矛盾します。調査は数十ファイルに及びますが、実装が触るのは数ファイルだけです。チーム標準とすべき実践はどれですか。","An enablement team finds that long Claude Code sessions mixing codebase investigation with implementation degrade sharply near the context limit: earlier findings disappear from consideration and new edits contradict them. Investigations span dozens of files, while implementation touches only a few. Which practice should the team standardize?",
  ["A","品質が落ちたらコンテキストの全消去を実行し、記憶を頼りにタスクを再説明するよう開発者へ指示する。","Instruct developers to run a full context clear whenever quality drops and re-explain the task from memory.","誤り。全消去は調査結果ごと捨てる操作で、必要なのは分離であって喪失ではありません。"],
  ["B","利用可能な最大コンテキストウィンドウを採用し、調査と実装を混在させたセッション構成は変えない。","Adopt the largest available context window and keep the combined investigation and implementation sessions unchanged.","誤り。窓を広げても生の調査データが本線へ流れ込む構造は残り、注意の希釈と費用だけが増えます。"],
  ["C","読み取り専用の調査用サブエージェントをリポジトリへコミットして定義し、独立コンテキストで調査させ、本線には構造化された要約だけを返す。","Define a read-only exploration subagent, checked into the repository, that investigates in its own context and returns structured summaries for the main session to consume.","正しい。調査を別コンテキストへ隔離し、本線には要約だけを渡すことで実装用の文脈を温存できます。リポジトリ配布によりチーム全体の標準にもなります。"],
  ["D","関連ファイルを最初から会話へ貼り付けさせ、調査自体を不要にする。","Ask developers to paste the relevant files into the conversation up front so investigation becomes unnecessary.","誤り。どのファイルが関連するかは調査しなければ分からず、先回りの貼り付けはコンテキストを圧迫する原因行為の積極化です。"],
  ["C"]],
[65,2,1,"Select model capabilities against cost and latency budgets","保険引受アシスタントは、定型の補償確認と、複数契約にまたがる複雑なリスク評価という2階層を処理します。全リクエストで拡張思考（extended thinking）を有効にしたところ、複雑階層の精度は上がりましたが、全体コストが倍増し、定型階層のレイテンシがサービス目標を超えました。最適な構成はどれですか。","An underwriting assistant serves two tiers: routine coverage checks and complex multi-policy risk assessments. Enabling extended thinking for every request raised complex-tier accuracy, but doubled overall cost and pushed routine-tier latency past its service objective. What is the best configuration?",
  ["A","複雑階層にだけ上限付きの思考予算で拡張思考を有効にし、精度向上を評価で検証して、定型リクエストは通常生成のままにする。","Enable extended thinking with a bounded thinking budget only for the complex tier, verify the accuracy gain with evals, and keep routine requests on standard generation.","正しい。便益が実証されている階層にだけ、予算上限付きで適用するのが基本です。定型階層のSLOとコストを守りつつ、効果は評価で確認し続けます。"],
  ["B","全リクエストで拡張思考を有効のままにし、定型案件では短く考えるようモデルへ指示する。","Keep extended thinking on for every request, but instruct the model to think briefly for routine ones.","誤り。プロンプトの「短く考えて」は予算の制御ではなく、定型階層の遅延とコストの問題を確実には解消しません。"],
  ["C","拡張思考を全面的に無効化し、定型プロンプトへ段階的に考える旨のフレーズを足して両階層を同じ挙動にする。","Disable extended thinking everywhere and add a think step by step phrase to the routine prompt so both tiers behave the same.","誤り。フレーズは拡張思考の代替にならず、実証済みの複雑階層の精度向上を捨てることになります。"],
  ["D","入力の長さでルーティングし、長いリクエストを複雑案件とみなす。","Route requests by input length, assuming longer requests are the complex ones.","誤り。長さは複雑さの未検証の代理指標で、短いが高難度の案件を確実に取りこぼします。"],
  ["A"]],
[66,3,1,"Design integration patterns balancing user experience and validation controls","契約書ドラフト機能は約700語の条項を返します。完成まで9秒の待ち時間で利用者がページを離脱していますが、コンプライアンス上、顧客が送信する前にドラフト全文へのサーバー側検証を通過させる必要があります。この緊張関係を解消する設計はどれですか。","A contract-drafting feature returns clauses of about 700 words. Users abandon the page during the nine-second wait for the full completion, but compliance requires that a server-side validation pass over the complete draft succeeds before the customer can send it. Which design resolves the tension?",
  ["A","最大出力長を減らしてドラフトを速く返し、条項が短くなることを受け入れる。","Reduce the maximum output length so drafts return faster, accepting shorter clauses.","誤り。成果物の質を削る回避策で、無反応な待ち時間という体験の根本原因も解決していません。"],
  ["B","一定の長さ未満のドラフトではサーバー側検証を省略して時間を稼ぐ。","Skip server-side validation for drafts under a certain length to save time.","誤り。コンプライアンス要件そのものの切り崩しで、統制の穴を意図的に作ることになります。"],
  ["C","条項品質を評価せずに、すべてのドラフト生成を最小モデルへ切り替える。","Switch all drafting to the smallest available model without evaluating clause quality.","誤り。品質評価なしのモデル変更は別の失敗を持ち込みます。この遅延は生成の見せ方で解決できる問題です。"],
  ["D","トークンを画面へストリーミングして即時のフィードバックを与えつつ、サーバー側で全文をバッファし、完成文書の検証通過後にのみ送信操作を有効化する。","Stream tokens to the interface for immediate feedback while buffering the full draft server-side, and enable the send action only after validation of the completed text passes.","正しい。体感遅延はストリーミングで解消し、確定操作は完全な文書の検証後に解放する。利用体験と統制要件を両立させる定石です。"],
  ["D"]],
[67,4,1,"Design evaluation frameworks for non-deterministic agentic systems","エージェント型の保険金請求ワークフローは、リリース前に評価スイートを1回の実行で通過しました。本番では同じリクエストが成功することも、誤ったツールを選ぶこともあります。評価スイートは失敗しているシナリオをすでにカバーしています。評価プロセスに何を追加すべきですか。","An agentic claims workflow passed its evaluation suite in a single run before release. In production, the same request sometimes succeeds and sometimes selects the wrong tool. The evaluation suite already covers the failing scenarios. What should the evaluation process add?",
  ["A","本番のtemperatureを0にして、エージェントの挙動を完全に決定論的にする。","Set temperature to zero in production so agent behavior becomes fully deterministic.","誤り。温度を下げてもツール経路や環境要因による変動は残り、1回実行という評価手法の欠陥そのものは直りません。"],
  ["B","各評価ケースを複数回実行してケース別の合格率と分散を追跡し、不安定なケースに印を付け、1回の合格ではなく一貫性の閾値でリリースを判定する。","Run each evaluation case multiple times, track per-case pass rates and variance, flag flaky cases, and gate releases on consistency thresholds rather than a single pass.","正しい。エージェントの非決定性は複数試行で測るしかありません。ケース別の合格率を基準化すれば、断続的な失敗をリリース前に検出できます。"],
  ["C","ケースあたりの実行は1回のまま、評価ケースの数を倍にする。","Double the number of evaluation cases while keeping one run per case.","誤り。件数を増やしても1回実行では、同一ケース内の変動という今回の失敗様式を観測できません。"],
  ["D","一度失敗したケースだけを再実行し、再実行で通れば合格として扱う。","Rerun only the cases that fail once, and accept them when the rerun passes.","誤り。再実行で通れば合格という運用は、断続的な失敗をまさに見逃すための選抜バイアスになります。"],
  ["B"]],
[68,5,1,"Ensure compliance with data retention and residency requirements","欧州の保険会社は、保険金請求アシスタントのプロンプトと出力をAI基盤側が処理後に保持しないこと、およびデータが承認された地域内に留まることを要求しています。アーキテクトはこの要件をどう満たすべきですか。","A European insurer requires that prompts and outputs from its claims assistant not be retained by the AI platform beyond processing, and that the data stay within an approved region. How should the architect satisfy this requirement?",
  ["A","基盤側が文書化しているデータ保持と地域所在のオプションを確認し、両要件を契約上満たす提供形態を構成した上で、その確約をデータ処理契約に記録する。","Review the platform's documented data-retention and residency options, configure the deployment that contractually meets both requirements, and record the commitments in the data-processing agreement.","正しい。保持と所在はモデルの挙動ではなく基盤側の処理と契約の問題です。文書化された提供形態の選択と契約への明記が、監査に耐える唯一の根拠になります。"],
  ["B","会話を保存してはならない旨をシステムプロンプトに1行追加する。","Add a system prompt line stating that the conversation must not be stored.","誤り。保存は基盤側インフラの処理であり、プロンプトでは制御も証明もできません。"],
  ["C","クライアント側で明白な個人識別子を除去し、要件を満たしたものとして扱う。","Strip obvious personal identifiers on the client side and treat the requirement as satisfied.","誤り。データ最小化は有効な補助策ですが、保持期間と地域所在という明示要件そのものには答えていません。"],
  ["D","すべてのログを暗号化し、障害調査のため現在の地域で無期限に保持する。","Encrypt all logs and keep them indefinitely in the current region for troubleshooting.","誤り。暗号化しても「処理後に保持しない」という要件と正面から矛盾します。"],
  ["A"]],
[69,1,1,"Design end-to-end architectures with fallback and graceful degradation","決済サポートアシスタントは事業クリティカルです。モデルAPIの障害中、現在の実装は同じエンドポイントへタイムアウトまで再試行を続け、その後は汎用エラーを表示します。経営層は、プロバイダー障害中も顧客対応を継続できる設計を求めています。アーキテクトは何を提案すべきですか。","A payments-support assistant is business critical. During a model-API disruption, the current implementation retries the same endpoint until timeout and then shows a generic error. Leadership asks for a design that keeps customers served during provider incidents. What should the architect propose?",
  ["A","プロバイダーの可用性コミットメントに依拠し、現在の再試行ループを維持する。","Rely on the provider's availability commitments and keep the current retry loop.","誤り。SLAは障害が起きないことを保証しません。無限再試行から汎用エラーへ落ちる現在の挙動を放置しています。"],
  ["B","より短い間隔で無期限に再試行し、APIの復旧と同時にアシスタントが回復するようにする。","Retry indefinitely with shorter intervals so the assistant recovers the moment the API returns.","誤り。復旧検知は速くなり得ますが、障害中の顧客対応がゼロのままで、復旧直後の負荷増幅も招きます。"],
  ["C","ヘルスチェックと段階的な縮退経路を追加する。バックオフ付きの上限ある再試行、次に重要インテント向けのフォールバックモデル（能力低下を開示）、最後にセルフサービス案内と人間の待ち行列へつなぐ。","Add health checks and a tiered degradation path: bounded retries with backoff, then a fallback model for critical intents with capability disclosure, then self-service content plus a human queue.","正しい。障害を検知し、品質を段階的に落としながら提供を継続する設計です。能力低下の開示と人間への経路まで含めるのが縮退運転の要件です。"],
  ["D","過去の回答をすべてキャッシュし、障害中はラベルを付けずに最も近い回答を返す。","Cache every previous answer and serve the closest match during outages without labeling it.","誤り。無表示の類似回答は誤案内リスクが高く、鮮度と文脈の違いを利用者から隠すことになります。"],
  ["C"]],
[70,2,1,"Manage model versioning and controlled upgrades across the lifecycle","文書処理パイプラインは最新版を指すモデルエイリアスを呼び出しています。プロバイダー側のモデル更新後、微妙に異なる出力フォーマットで下流のパーサーが失敗し始め、チームは以前の挙動を再現できませんでした。再発を防ぐのはどれですか。","A document-processing pipeline calls the latest model alias. After a provider-side model update, downstream parsers began failing on subtly different output formatting, and the team could not reproduce the previous behavior. What prevents a recurrence?",
  ["A","改善を自動で受け取れるよう、エイリアス参照を維持する。","Keep the alias so the pipeline always benefits from improvements automatically.","誤り。無検証の自動更新こそ今回の原因で、再現不能な挙動変化を繰り返すことになります。"],
  ["B","構成で正確なモデルバージョンを固定し、新バージョンはステージングで回帰スイートにより評価してから、文書化されたロールバック付きのカナリアで昇格させる。","Pin an exact model version in configuration, evaluate each new version against a regression suite in staging, and promote it through a canary with a documented rollback.","正しい。バージョン固定と回帰評価付きの段階昇格が、モデルの挙動変化を統制されたイベントに変えます。"],
  ["C","現在のモデルを恒久的に凍結し、安定性を保証するため今後の更新を拒否する。","Freeze the current model permanently and reject future upgrades to guarantee stability.","誤り。恒久凍結は改善の取り込みと提供終了への対応力を失います。必要なのは更新の禁止ではなく、統制された更新経路です。"],
  ["D","実行時にモデル自身へバージョンを申告させ、回答が変わったらアラートを出す。","Ask the model to report its own version at runtime and alert when the answer changes.","誤り。自己申告は構成管理の代替になりません。使用バージョンは呼び出し側の設定で決めるものです。"],
  ["B"]],
[71,3,1,"Select appropriate MCP primitives (tools, resources, prompts)","サポート部門向けの社内MCPサーバーは3つの機能を提供する必要があります。アプリケーションがコンテキストとして添付すべき読み取り専用のナレッジコーパス、担当者が手動で起動する再利用可能なチケット要約テンプレート、会話中にモデルが呼び出すエスカレーション作成アクションです。これらをMCPのプリミティブへどう対応させるべきですか。","An internal MCP server for the support organization must offer three capabilities: a read-only knowledge corpus that the application should attach as context, a reusable summarize-this-ticket template that staff trigger manually, and a create-escalation action the model invokes during conversations. How should these map to MCP primitives?",
  ["A","3つすべてをtoolsとして公開し、すべての機能をモデルの判断で使わせる。","Expose all three as tools so the model controls every capability.","誤り。参照データや手動テンプレートまでモデル起動にすると、読み込みが確率的になり、利用者主導という要件も失われます。"],
  ["B","副作用が起きないよう、3つすべてをresourcesとして公開する。","Expose all three as resources so nothing can cause side effects.","誤り。エスカレーション作成という副作用を持つ操作が要件に含まれており、resourcesでは実行できません。"],
  ["C","コーパスとテンプレートをエスカレーション作成ツールのdescriptionへ埋め込む。","Embed the corpus and the template inside the create-escalation tool description.","誤り。descriptionはツール選択のための説明の場であり、データ置き場ではありません。全ツールのコンテキストを汚染します。"],
  ["D","コーパスはresource、要約テンプレートはprompt、エスカレーション操作はtoolとして公開する。","Expose the corpus as a resource, the summarize template as a prompt, and the escalation action as a tool.","正しい。アプリケーション管理の文脈はresource、利用者起動の定型はprompt、モデル起動のアクションはtool。MCPの3プリミティブの役割分担そのものです。"],
  ["D"]],
[72,6,1,"Manage stakeholder expectations with evaluation evidence and staged rollout","完璧な社内デモの後、経営層は来週に全顧客へのリリースを求めています。評価データはタスク成功率91%で、辺縁ケースには無視できない分散があり、ロールバック手順は一度も演習されていません。アーキテクトはどう対応すべきですか。","After a flawless internal demo, executives want the assistant released to all customers next week. Evaluation data shows 91 percent task success with meaningful variance on edge cases, and the rollback procedure has never been exercised. How should the architect respond?",
  ["A","デモではなく評価の分布を提示し、事前定義した成功ゲートとリハーサル済みロールバックを備えた段階的リリースを提案して、残存リスクを事業影響の言葉へ翻訳する。","Present the evaluation distribution rather than the demo, propose a staged rollout with predefined success gates and a rehearsed rollback, and translate the residual risks into business impact.","正しい。単発のデモは分布の1点にすぎません。分布で現状を伝え、段階展開と検証済みの復旧手段でリスクを意思決定可能な形にします。"],
  ["B","デモでシステムの動作は証明済みなので、要求された日程に従う。","Comply with the requested date, since the demo already proved the system works.","誤り。デモは選ばれた成功例であり、辺縁ケースの分散と未検証のロールバックという明示されたリスクを無視しています。"],
  ["C","リリースを拒否し、より高能力なモデルでプロジェクトをやり直す。","Refuse the release and restart the project with a more capable model.","誤り。代替案のない拒否は意思決定材料を提供せず、モデル変更は指摘されている運用リスクと無関係です。"],
  ["D","本番初期も関係者の確信が保てるよう、デモシナリオをさらに磨き込む。","Polish the demo scenarios further so stakeholders remain confident during early production.","誤り。見せ方の改善は本番の分布を変えず、期待値と実力の乖離をむしろ広げます。"],
  ["A"]],
[73,7,1,"Support debugging and operational issue resolution for shared tooling","新しいMCPサーバーを組織全体のClaude Codeで有効化した後、一部のチームからセッションの低速化と時折のツール誤選択が報告されていますが、他のチームには変化がありません。支援チームが最初に行うべきことはどれですか。","After a new MCP server was enabled organization-wide for Claude Code, several teams report slower sessions and occasional calls to the wrong tools, while other teams see no change. What should the enablement team do first?",
  ["A","調査の担当者が現れるまで、組織全体でそのサーバーを無効化する。","Disable the server for the whole organization until someone volunteers to investigate.","誤り。恩恵を受けているチームまで止める過剰反応で、原因を特定する情報も得られません。"],
  ["B","すべてのクライアントのタイムアウトを引き上げ、低速セッションがエラーとして表面化しないようにする。","Raise all client timeouts so slow sessions stop surfacing as errors.","誤り。症状の抑え込みにすぎず、遅さとツール誤選択の原因である不要なツール露出は残ります。"],
  ["C","どのツールを優先すべきかを開発者へ周知する利用ガイドラインを配布する。","Send a usage guideline reminding developers which tools to prefer.","誤り。人間向けの文書はモデルのツール選択に作用せず、コンテキスト負荷も変わりません。"],
  ["D","構成診断とログで影響ありと影響なしの環境を比較し、読み込まれているサーバーとツール、そのコンテキスト占有量、ツール別レイテンシを調べた上で、サーバーの公開範囲を必要なプロジェクトに絞る。","Use configuration diagnostics and logs to compare affected and unaffected setups, examining which servers and tools are loaded, their context footprint, and per-tool latency, then scope the server to the projects that need it.","正しい。差が出ている構成を証拠で特定し、必要な範囲だけに公開を絞ることで、速度とツール選択精度の両方の根本原因へ対処できます。"],
  ["D"]],
[74,4,1,"Calibrate LLM-based graders against human judgment","ルーブリック方式のLLM判定器が、起案アシスタントのリリース可否を判定しています。半年前は専門家レビュアーと高い一致を示していましたが、最近の抜き取り確認では、専門家なら却下する起案を合格させている疑いがあります。正しい是正の実践はどれですか。","A rubric-based LLM judge gates releases for a drafting assistant. Six months ago it agreed closely with expert reviewers; recent spot checks suggest it now accepts drafts that experts would reject. What is the right corrective practice?",
  ["A","判定器のプロンプトは変わっていないので、当初の検証結果を信頼する。","Trust the original validation, since the judge prompt has not changed.","誤り。判定対象の分布や基盤モデルが変われば一致度は劣化します。較正は一度きりで済む資産ではありません。"],
  ["B","リリース判定を、エンドユーザーの高評価と低評価の割合へ置き換える。","Replace the judge with end-user thumbs ratings as the release gate.","誤り。利用者評価は疎で偏りがあり、専門家基準で却下すべき起案という判定の代替にはなりません。"],
  ["C","定期的に再較正する。新しい人手ラベル標本で判定器と専門家の一致度を測定し、ルーブリックを調整して版管理し、一致度が閾値を下回ったらアラートを出す。","Recalibrate on a schedule: measure judge-to-expert agreement on fresh labeled samples, adjust and version the rubric, and alert when agreement falls below a threshold.","正しい。LLM判定器は較正済みの測定器として扱います。人間ラベルとの一致度を定期監視と版管理の対象にすれば、劣化を自動検知できます。"],
  ["D","2つ目のLLM判定器を追加し、両者が一致した起案を合格にする。","Add a second LLM judge and accept drafts when both agree.","誤り。人間の基準点なしにモデル同士の合意を重ねても、共有された盲点は検出できません。"],
  ["C"]],
[75,5,2,"Respond to production AI incidents with containment and prevention","本番アシスタントが、自信に満ちた文面で実在しない返金ポリシーを複数の顧客へメール送信しました。この経路はまだ稼働中です。最初に行うべき対応を2つ選択してください。","A production assistant emailed several customers a confidently worded but nonexistent refund policy. The pathway is still live. Which TWO actions should happen first? Select TWO.",

// 正しいインデックスでオブジェクトにマッピング（ここを完全に修正しました）
const ALL_Q = RAW_DATA.map(d => ({
  id: d[0],
  code: "Q" + (d[0] < 10 ? "0" + d[0] : d[0]),
  domain: DOMAINS[d[1]],
  selectionCount: d[2],
  taskFocus: d[3],
  question: { ja: d[4], en: d[5] },
  options: [
    { key: d[6][0], ja: d[6][1], en: d[6][2], rationale: d[6][3] },
    { key: d[7][0], ja: d[7][1], en: d[7][2], rationale: d[7][3] },
    { key: d[8][0], ja: d[8][1], en: d[8][2], rationale: d[8][3] },
    { key: d[9][0], ja: d[9][1], en: d[9][2], rationale: d[9][3] }
  ],
  correct: d[10]
}));

// 状態管理
const STORAGE_KEY = "ccarp_master_exam_final_fixed";
let S = {
  list: [], i: 0, ans: {}, done: {}, seenOnly: {},
  filter: "all", lang: "ja", autoCheck: true
};

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.ans) S.ans = d.ans;
    if (d.done) S.done = d.done;
    if (d.seenOnly) S.seenOnly = d.seenOnly;
  } catch(e){}
}
function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ans: S.ans, done: S.done, seenOnly: S.seenOnly }));
  } catch(e){}
}

function $(id) { return document.getElementById(id); }
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function renderHome() {
  $("navFixed").className = "nav-fixed hide";
  closeModal();

  let totalAns = Object.keys(S.done).length;
  let correctCount = 0;
  ALL_Q.forEach(q => {
    if (S.done[q.id] && !S.seenOnly[q.id]) {
      const user = (S.ans[q.id] || []).slice().sort().join(",");
      const corr = (q.correct || []).slice().sort().join(",");
      if (user === corr) correctCount++;
    }
  });

  let h = `
    <div class="card">
      <div class="lbl">学習・出題フィルター</div>
      <div class="grid-2">
        <button class="filter-btn pri" onclick="startFilter('all')">
          <b>📘 全78問 完全演習</b>
          <span>基礎から本番形式まで全78問を通しで演習</span>
        </button>
        <button class="filter-btn" onclick="startFilter('miss')">
          <b>🔁 誤答・要復習のみ</b>
          <span>間違えた問題を集中的に克服</span>
        </button>
        <button class="filter-btn" onclick="startFilter('unsolved')">
          <b>⬜ 未着手のみ</b>
          <span>まだ解いていない問題を進める</span>
        </button>
        <button class="filter-btn" onclick="startFilter('addon')">
          <b>⭐ 追加パックのみ (Q64〜Q78)</b>
          <span>新傾向の15問を集中的に特訓</span>
        </button>
      </div>

      <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)">
        <div class="lbl">ドメイン別演習</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${[1,2,3,4,5,6,7].map(dn => `
            <button class="sec" style="font-size:12px;padding:6px 10px" onclick="startFilter('d${dn}')">
              D${dn}: ${DOMAINS[dn].split('—')[1]}
            </button>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="lbl">操作オプション</div>
      <label style="cursor:pointer;display:flex;align-items:center;gap:8px">
        <input type="checkbox" ${S.autoCheck ? 'checked' : ''} onchange="S.autoCheck=this.checked">
        <span><b>スピード回答モード</b>（単一選択肢をタップした瞬間に即判定＆解説表示）</span>
      </label>
    </div>

    <div class="card">
      <div class="lbl">これまでの学習進捗</div>
      <div class="big-num" style="color:var(--accent)">
        ${totalAns ? Math.round((correctCount / totalAns) * 100) : 0}%
      </div>
      <div style="text-align:center;color:var(--muted);font-size:13px">
        正解 ${correctCount} / 着手 ${totalAns}問 (全${ALL_Q.length}問中)
      </div>
      <div style="text-align:center;margin-top:14px">
        <button class="danger" style="font-size:12px;padding:5px 12px" onclick="resetAll()">進捗を消去</button>
      </div>
    </div>
  `;
  $("app").innerHTML = h;
}

function startFilter(type) {
  S.filter = type;
  if (type === "all") S.list = ALL_Q.slice();
  else if (type === "addon") S.list = ALL_Q.filter(q => q.id >= 64);
  else if (type === "unsolved") S.list = ALL_Q.filter(q => !S.done[q.id]);
  else if (type === "miss") {
    S.list = ALL_Q.filter(q => {
      if (!S.done[q.id] || S.seenOnly[q.id]) return false;
      const user = (S.ans[q.id] || []).slice().sort().join(",");
      const corr = (q.correct || []).slice().sort().join(",");
      return user !== corr;
    });
    if (!S.list.length) { alert("現在、誤答の記録はありません！"); return; }
  } else if (type.startsWith("d")) {
    const dn = parseInt(type.replace("d",""), 10);
    S.list = ALL_Q.filter(q => q.domain && q.domain.startsWith(`Domain ${dn}`));
  }
  S.i = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = S.list[S.i];
  if (!q) { renderHome(); return; }

  const fin = S.done[q.id];
  const isSeen = S.seenOnly[q.id];
  const userSel = S.ans[q.id] || [];
  const isCorrect = fin && !isSeen && (userSel.slice().sort().join(",") === (q.correct || []).slice().sort().join(","));

  const qTextPrimary = S.lang === "en" ? q.question.en : q.question.ja;
  const qTextSecondary = S.lang === "both" ? q.question.en : null;

  let h = `
    <div class="quickNav">
      <span style="font-weight:700;font-size:13px;font-family:var(--mono);color:var(--muted)">
        ${S.i + 1} / ${S.list.length} (${q.code})
      </span>
      <div style="display:flex;gap:6px">
        <button class="sec" style="padding:4px 8px;font-size:12px" onclick="openModal()">📑 一覧</button>
        <button class="${fin ? 'pri' : ''}" style="padding:4px 10px;font-size:12px" onclick="go(1)">
          ${fin ? '次へ →' : 'スキップ →'}
        </button>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" style="width:${((S.i + 1) / S.list.length) * 100}%"></div>
    </div>

    <div class="card">
      <div class="meta-tags">
        <span class="tag domain">${q.domain}</span>
        <span class="tag">${q.taskFocus}</span>
        <span class="tag" style="color:var(--accent)">${q.selectionCount === 2 ? '2つ選択' : '1つ選択'}</span>
      </div>

      <div class="q-main">${esc(qTextPrimary)}</div>
      ${qTextSecondary ? `<div class="q-sub">${esc(qTextSecondary)}</div>` : ''}

      <div class="options">
  `;

  q.options.forEach(opt => {
    const isSelected = userSel.includes(opt.key);
    const isAnswerCorrect = fin && q.correct.includes(opt.key);
    const isSelectedWrong = fin && isSelected && !isAnswerCorrect;

    let cls = "option";
    if (isSelected) cls += " selected";
    if (isAnswerCorrect) cls += " correct-answer";
    if (isSelectedWrong) cls += " wrong-answer";

    const optPrimary = S.lang === "en" ? opt.en : opt.ja;
    const optSecondary = S.lang === "both" ? opt.en : null;

    h += `
      <div class="${cls}" onclick="tapOption('${opt.key}')">
        <span class="opt-key">${opt.key}</span>
        <div class="opt-body">
          <div>${esc(optPrimary)}</div>
          ${optSecondary ? `<span class="opt-sub">${esc(optSecondary)}</span>` : ''}
        </div>
      </div>
    `;
  });

  h += `</div>`;

  if (fin) {
    let feedCls = isSeen ? "skip" : (isCorrect ? "ok" : "ng");
    let feedTitle = isSeen ? "― 解答・解説の確認（スキップ）" : (isCorrect ? "✓ 正解です" : "✗ 不正解です");

    h += `
      <div class="feedback ${feedCls}">
        <div class="feedback-title">${feedTitle}</div>
        <div style="font-size:12px;font-family:var(--mono);color:var(--muted);margin-bottom:12px">
          あなたの回答: ${userSel.length ? userSel.join(", ") : "未選択"} ／ 正答: ${q.correct.join(", ")}
        </div>
        <div class="rationale-list">
    `;

    q.options.forEach(opt => {
      const expected = q.correct.includes(opt.key);
      const selWrong = userSel.includes(opt.key) && !expected;
      let rCls = "rationale-item";
      if (expected) rCls += " is-correct";
      if (selWrong) rCls += " is-selected-wrong";

      h += `
        <div class="${rCls}">
          <b>${opt.key}. ${esc(opt.ja)}</b>
          <div style="margin-top:4px;color:var(--muted)">${esc(opt.rationale)}</div>
        </div>
      `;
    });

    h += `</div></div>`;
  }

  h += `</div>`;
  $("app").innerHTML = h;

  $("navFixed").className = "nav-fixed";
  let nb = `
    <button class="sec" onclick="renderHome()">中断</button>
    <button ${S.i === 0 ? 'disabled' : ''} onclick="go(-1)">← 前へ</button>
    <span class="sp"></span>
  `;

  if (!fin) {
    nb += `<button class="sec" onclick="showDirectAnswer()">答えだけ見る</button>`;
    if (userSel.length > 0) {
      nb += `<button class="pri" onclick="submitAnswer()">解答する</button>`;
    }
    nb += `<button onclick="go(1)">${S.i === S.list.length - 1 ? '完了へ' : 'スキップ →'}</button>`;
  } else {
    nb += `<button class="pri" onclick="go(1)">${S.i === S.list.length - 1 ? '結果を見る' : '次へ →'}</button>`;
  }
  $("navIn").innerHTML = nb;
}

function tapOption(key) {
  const q = S.list[S.i];
  if (S.done[q.id]) return;

  let cur = S.ans[q.id] || [];
  if (q.selectionCount === 1) {
    S.ans[q.id] = [key];
    if (S.autoCheck) {
      submitAnswer();
      return;
    }
  } else {
    if (cur.includes(key)) cur = cur.filter(k => k !== key);
    else if (cur.length < 2) cur.push(key);
    else { cur.shift(); cur.push(key); }
    S.ans[q.id] = cur;
  }
  renderQuestion();
}

function submitAnswer() {
  const q = S.list[S.i];
  const cur = S.ans[q.id] || [];
  if (q.selectionCount === 2 && cur.length !== 2) {
    alert("この問題は2つ選択してください");
    return;
  }
  S.done[q.id] = 1;
  delete S.seenOnly[q.id];
  saveProgress();
  renderQuestion();
}

function showDirectAnswer() {
  const q = S.list[S.i];
  S.done[q.id] = 1;
  S.seenOnly[q.id] = 1;
  saveProgress();
  renderQuestion();
}

function go(step) {
  const nxt = S.i + step;
  if (nxt >= S.list.length) {
    showResultScreen();
    return;
  }
  if (nxt < 0) return;
  S.i = nxt;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  renderHome();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function changeLang(val) {
  S.lang = val;
  if (S.list.length && S.list[S.i]) renderQuestion();
}

function resetAll() {
  if (!confirm("これまでの全回答進捗を消去しますか？")) return;
  S.ans = {}; S.done = {}; S.seenOnly = {};
  saveProgress();
  renderHome();
}

function openModal() {
  let h = "";
  S.list.forEach((q, idx) => {
    let cls = "q-box";
    if (idx === S.i) cls += " cur";
    if (S.done[q.id]) {
      if (S.seenOnly[q.id]) cls += " seen";
      else {
        const u = (S.ans[q.id] || []).slice().sort().join(",");
        const c = (q.correct || []).slice().sort().join(",");
        cls += (u === c) ? " ok" : " ng";
      }
    }
    h += `<div class="${cls}" onclick="jumpTo(${idx})">${idx + 1}</div>`;
  });
  $("qGrid").innerHTML = h;
  $("qModal").className = "modal";
}
function closeModal() { $("qModal").className = "modal hide"; }
function jumpTo(idx) {
  closeModal();
  S.i = idx;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showResultScreen() {
  $("navFixed").className = "nav-fixed hide";
  closeModal();

  let c = 0, total = S.list.length;
  let domainStats = {};

  S.list.forEach(q => {
    const dName = q.domain || "その他";
    if (!domainStats[dName]) domainStats[dName] = { c: 0, t: 0 };
    domainStats[dName].t++;

    const u = (S.ans[q.id] || []).slice().sort().join(",");
    const corr = (q.correct || []).slice().sort().join(",");
    if (S.done[q.id] && !S.seenOnly[q.id] && u === corr) {
      c++;
      domainStats[dName].c++;
    }
  });

  const pct = Math.round((c / total) * 100);
  let h = `
    <div class="card" style="text-align:center;padding:32px 16px">
      <div class="lbl">演習結果</div>
      <div class="big-num" style="color:${pct >= 80 ? 'var(--good)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)'}">
        ${pct}%
      </div>
      <div style="font-size:14px;color:var(--muted)">正解 ${c} / ${total} 問</div>
      <div style="margin-top:16px">
        <button class="pri" onclick="startFilter('miss')">誤答・未確認のみ復習</button>
        <button class="sec" onclick="renderHome()">ホームへ戻る</button>
      </div>
    </div>

    <div class="card">
      <div class="lbl">領域別達成度</div>
      <div style="display:grid;gap:8px;margin-top:10px">
  `;

  Object.keys(domainStats).forEach(d => {
    const st = domainStats[d];
    const dpct = Math.round((st.c / st.t) * 100);
    h += `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">
        <span>${d}</span>
        <b style="font-family:var(--mono);color:${dpct >= 75 ? 'var(--good)' : 'var(--warn)'}">${st.c}/${st.t} (${dpct}%)</b>
      </div>
    `;
  });

  h += `</div></div>`;
  $("app").innerHTML = h;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

window.addEventListener("keydown", function(e) {
  if (!$("qModal").classList.contains("hide")) {
    if (e.key === "Escape") closeModal();
    return;
  }
  if ($("navFixed").classList.contains("hide")) return;

  const key = e.key.toLowerCase();
  const q = S.list[S.i];
  if (!q) return;

  if (["1", "a"].includes(key)) tapOption("A");
  else if (["2", "b"].includes(key)) tapOption("B");
  else if (["3", "c"].includes(key)) tapOption("C");
  else if (["4", "d"].includes(key)) tapOption("D");
  else if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    go(1);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    go(-1);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (!S.done[q.id]) {
      if (S.ans[q.id] && S.ans[q.id].length) submitAnswer();
      else showDirectAnswer();
    } else {
      go(1);
    }
  }
});

// 起動
loadProgress();
renderHome();
</script>
</body>
</html>
