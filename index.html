<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>CCAR-P 完全統合問題集 (全78問)</title>
  <style>
:root {
  --bg: #0f1117; --card: #171b24; --card2: #1f2430; --line: #2b3242;
  --tx: #e6e9f0; --muted: #9aa3b5; --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.15); --good: #3fb950;
  --good-soft: rgba(63, 185, 80, 0.15); --bad: #f85149;
  --bad-soft: rgba(248, 81, 73, 0.15); --warn: #d29922;
  --mono: "SFMono-Regular", Consolas, "Cascadia Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "BIZ UDPGothic", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--sans); line-height: 1.7; font-size: 15px; }
button, select, input { font: inherit; }
button { cursor: pointer; border: 1px solid var(--line); border-radius: 8px; background: var(--card2); color: var(--tx); padding: 8px 14px; transition: .15s; user-select: none; }
button:hover { border-color: var(--accent); }
button.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
button.sec { background: transparent; border-color: var(--line); color: var(--muted); }
button.sec:hover { color: var(--tx); border-color: var(--muted); }
button.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .35; cursor: not-allowed; }

.wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 120px; }
header.top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.brand { font-size: 17px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--card2); border: 1px solid var(--line); color: var(--accent); font-family: var(--mono); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
.lbl { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media(max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

.filter-btn { text-align: left; padding: 12px; line-height: 1.4; }
.filter-btn b { display: block; font-size: 14px; margin-bottom: 3px; color: #fff; }
.filter-btn span { font-size: 11px; color: var(--muted); }

.quickNav { display: flex; justify-content: space-between; align-items: center; background: var(--card2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; }
.progress-bar { height: 5px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.progress-fill { height: 100%; background: var(--accent); transition: width .2s; }

.meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 5px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); }
.tag.domain { color: var(--accent); border-color: rgba(217,119,87,.4); }

.q-main { font-size: 16px; font-weight: 700; line-height: 1.7; margin: 8px 0; color: #fff; white-space: pre-line; }
.q-sub { font-size: 13px; color: var(--muted); font-style: italic; line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }

.options { display: grid; gap: 10px; margin-top: 20px; }
.option { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; width: 100%; padding: 14px; border: 1px solid var(--line); background: var(--card2); border-radius: 9px; text-align: left; transition: .12s; }
.option:hover { border-color: var(--accent); }
.option.selected { border-color: var(--accent); background: var(--accent-soft); }
.option.correct-answer { border-color: var(--good) !important; background: var(--good-soft) !important; }
.option.wrong-answer { border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.opt-key { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-weight: 700; font-family: var(--mono); color: var(--muted); }
.option.selected .opt-key { border-color: var(--accent); color: var(--accent); }
.option.correct-answer .opt-key { border-color: var(--good); color: var(--good); }
.option.wrong-answer .opt-key { border-color: var(--bad); color: var(--bad); }

.feedback { margin-top: 24px; padding: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); }
.feedback.ok { border-color: var(--good); background: var(--good-soft); }
.feedback.ng { border-color: var(--bad); background: var(--bad-soft); }
.feedback.skip { border-color: var(--warn); background: rgba(210,153,34,.15); }
.feedback-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.feedback.ok .feedback-title { color: var(--good); }
.feedback.ng .feedback-title { color: var(--bad); }
.feedback.skip .feedback-title { color: var(--warn); }
.rationale-list { display: grid; gap: 10px; margin-top: 14px; }
.rationale-item { padding: 12px; border-radius: 7px; background: rgba(0,0,0,.25); border-left: 3px solid var(--line); font-size: 13.5px; }
.rationale-item.is-correct { border-left-color: var(--good); }
.rationale-item.is-selected-wrong { border-left-color: var(--bad); }

.nav-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,17,23,.95); border-top: 1px solid var(--line); padding: 10px 16px; backdrop-filter: blur(10px); z-index: 50; }
.nav-in { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.nav-in .sp { flex: 1; }

.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 680px; max-height: 85vh; display: flex; flex-direction: column; padding: 20px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; overflow-y: auto; padding: 6px 2px; }
.q-box { aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--card2); font-size: 12px; font-weight: 700; font-family: var(--mono); color: var(--muted); cursor: pointer; }
.q-box.cur { outline: 2px solid var(--accent); border-color: var(--accent); color: #fff; }
.q-box.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.q-box.ng { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.q-box.seen { background: rgba(210,153,34,.15); border-color: var(--warn); color: var(--warn); }

.hide { display: none !important; }
.big-num { font-size: 42px; font-weight: 800; text-align: center; margin: 8px 0; font-family: var(--mono); }
  </style>
</head>
<body>

<div class="wrap">
  <header class="top-bar">
    <div class="brand" onclick="goHome()" style="cursor:pointer">
      <span>CCAR-P 完全統合問題集</span>
      <span class="badge" id="totalBadge">全78問</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="langSelect" onchange="changeLang(this.value)" style="background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px">
        <option value="ja">日本語メイン</option>
        <option value="both">日英併記</option>
        <option value="en">English Main</option>
      </select>
    </div>
  </header>
  <div id="app"></div>
</div>

<div class="nav-fixed hide" id="navFixed"><div class="nav-in" id="navIn"></div></div>

<!-- モーダル -->
<div class="modal hide" id="qModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <b style="font-size:16px">問題マップ (全78問)</b>
      <button class="sec" style="padding:4px 10px" onclick="closeModal()">✕ 閉じる</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
      🟩 正解 / 🟥 不正解 / 🟧 答え確認済 / ⬜ 未着手 / [枠] 現在地
    </div>
    <div class="q-grid" id="qGrid"></div>
  </div>
</div>

<script>
const DOMAINS = {
  1: "Domain 1 — Solution Design & Architecture",
  2: "Domain 2 — Claude Models, Prompting & Context Engineering",
  3: "Domain 3 — Integration",
  4: "Domain 4 — Evaluation, Testing & Optimization",
  5: "Domain 5 — Governance, Safety & Risk Management",
  6: "Domain 6 — Stakeholder Communication & Lifecycle Management",
  7: "Domain 7 — Developer Productivity & Operational Enablement"
};

// 全78問の生データ配列
const RAW_DATA = [
[1,1,1,"Select appropriate architectural patterns","標準化チームは、1冊の1,100ページの技術仕様に関する質問へ回答する必要があります。付録を除くと、正式な本文全体が選択モデルのコンテキストウィンドウに収まります。質問では、冒頭の定義、中盤の例外、終盤の互換性表を組み合わせることがよくあります。規制レビュー中は、入力コストやp95レイテンシより関連規定の見落とし回避が重要です。初期アーキテクチャとして最も適切なものはどれですか。","A standards team must answer questions about a single 1,100-page engineering specification. After removing appendices, the entire authoritative text fits within the chosen model's context window. Questions often combine a definition near the beginning, an exception in the middle, and a compatibility table near the end. During regulatory review, omitting a relevant provision matters more than input cost or p95 latency. Which initial architecture is MOST appropriate?",
  ["A","段落埋め込みを索引化して上位の一連の文章を返し、信頼度が閾値未満の場合だけ2回目の広域検索を行う。","Index paragraph embeddings and return the highest-scoring passages, with a second broader search only when confidence falls below a threshold.","誤り。段階的な検索は通常のRAGでは合理的ですが、離れた規定を結ぶ問いでは信頼度が高くても必要箇所を落とし得るため、見落とし回避を最優先する条件に合いません。"],
  ["B","自己評価した網羅度が閾値に達するまで、キーワード検索とベクトル検索を交互に行う計画エージェントを作る。","Create a planning agent that alternates keyword and vector searches until a self-evaluated coverage score reaches a threshold.","誤り。反復検索は全文が収まらない資料では有力ですが、自己評価の停止条件と追加の複雑性があり、全文を直接扱える本件では最初の選択として過剰です。"],
  ["C","仕様の過去解釈でファインチューニングし、モデルが低信頼を示した場合だけ原文段落を検索する。","Fine-tune on prior interpretations of the specification and retrieve source paragraphs only when the model expresses low confidence.","誤り。学習済み解釈は正式本文の完全な代替ではなく、自己申告の信頼度も根拠欠落を確実に検知しません。規制レビューの引用可能性も弱まります。"],
  ["D","安定した節識別子を付けた正式本文全体を渡し、回答には根拠となる節または表の引用を必須とする。","Provide the complete authoritative text with stable section identifiers and require citations to supporting sections or tables.","正しい。全文が収まり、離れた箇所の横断参照と検索漏れ回避がコストや速度より優先されます。識別子付き全文コンテキストが最も単純で監査可能です。"],
  ["D"]],
[2,1,1,"Select appropriate architectural patterns","出版社は原稿を、権利状態の分類、制限対象引用の墨消し、墨消しがある場合の法務承認、配布ファイル作成という必須順序で処理します。順序と承認条件は固定されていますが、Claudeは分類と墨消し候補の提示に有用です。最も適したアーキテクチャはどれですか。","A publisher converts manuscripts through a mandated sequence: classify rights status, redact restricted excerpts, obtain legal approval when redactions occur, and create distribution files. The sequence and approval condition are fixed, while Claude is useful for classification and redaction suggestions. Which architecture BEST fits?",
  ["A","出版エージェントに全ツールを与え、役割プロンプトで望ましい順序を説明する。","Give a publishing agent every tool and describe the preferred sequence in its role prompt.","誤り。順序をプロンプトで望ましいものとして示すだけでは、法務承認を含む必須遷移を構造的に強制できません。"],
  ["B","検証ゲート、監査可能な状態遷移、決定論的な法務承認分岐を持つ、アプリケーション制御のプロンプトチェーンを使う。","Use application-controlled prompt chaining with validation gates, auditable state transitions, and a deterministic legal-approval branch.","正しい。固定サブタスクにはワークフローが適し、アプリケーション側のゲートと状態遷移で順序と承認を監査可能に強制しつつ、限定工程だけClaudeへ任せられます。"],
  ["C","分類とファイル作成を並列実行し、墨消しの差異を法務担当者に調整させる。","Run classification and file creation in parallel, then ask legal counsel to reconcile any redaction differences.","誤り。ファイル作成は権利分類・墨消し・条件付き承認の後でなければならず、並列化は明示された依存順序を破ります。"],
  ["D","モデルgraderが法的準備状況と配布品質を承認するまで、各原稿を書き直すevaluator-optimizerループを使う。","Use an evaluator-optimizer loop that rewrites each manuscript until a model grader approves its legal readiness and distribution quality.","誤り。反復改善は文章品質には有効ですが、規定された法務承認をモデルgraderに置き換え、固定業務フローにも余分な反復を加えます。"],
  ["B"]],
[3,1,2,"Design multi-agent systems and orchestration strategies","デューデリジェンス基盤では、財務、サイバーセキュリティ、訴訟の独立した専門エージェントを使います。検索は並行実行できますが、最終リスクメモでは各所見の証拠を保持し、矛盾する結果を黙って一方に決めず明示する必要があります。設計を最も適切に支える選択を2つ選んでください。","A due-diligence platform uses independent finance, cybersecurity, and litigation specialists. Their searches can run concurrently, but the final risk memo must preserve each finding's evidence and expose contradictions rather than silently choosing one result. Which TWO choices BEST support the design? Select TWO.",
  ["A","各専門エージェントに全データコネクターと共有スクラッチパッドを与え、他者が見つけた欠落をどの担当でも補えるようにする。","Give every specialist all data connectors and a shared scratchpad so any one can fill gaps discovered by another.","誤り。柔軟性は増しますが、専門境界と最小能力を弱め、共有途中情報による相互汚染、重複検索、不適切なツール選択を招きます。"],
  ["B","実行中に専門エージェント同士で自由形式の草稿を交換し、最も長い最終記述を採用する。","Let specialists exchange free-form drafts during execution and accept the longest final narrative.","誤り。草稿共有は協調に使えますが、証拠契約も矛盾検出規則もなく、長さは正確性や網羅性の基準になりません。"],
  ["C","各専門エージェントを領域固有のコンテキスト、最小権限コネクター、明示的な所見出力契約に限定する。","Scope each specialist to domain-specific context, least-privilege connectors, and an explicit finding-output contract.","正しい。責務、能力、出力の境界を明確にし、無関係なデータやツールによる混乱を抑えながら独立調査を並列化できます。"],
  ["D","出典IDと信頼度を含む共通所見スキーマを必須とし、統合前にオーケストレーターが競合を明示する。","Require a shared finding schema with source IDs and confidence, then have an orchestrator flag conflicts before synthesis.","正しい。共通契約で証拠を失わず集約でき、専用オーケストレーターが矛盾を隠さず最終メモへ渡せます。"],
  ["C","D"]],
[4,1,1,"Apply decomposition techniques for complex problem solving","助成金レビュー支援では、まず適格性の証拠を抽出し、公開済み採点式を適用し、必須文書の欠落を特定してから、レビュー所見を作成する必要があります。単一プロンプトは証拠不足時に得点を作り出すことがあります。障害へ最も直接対処する再設計はどれですか。","A grant-review assistant must first extract eligibility evidence, apply a published scoring formula, identify missing mandatory documents, and only then draft reviewer notes. A single prompt often invents a score when evidence is incomplete. Which redesign MOST directly addresses the failure?",
  ["A","先に所見と暫定得点を作成し、その後、直接引用がない項目を第2モデルに削除させる。","Draft notes and provisional scores first, then have a second model remove entries that lack a direct quotation.","誤り。事後チェックは防御層になりますが、未検証得点を先に生成する順序であり、公開済み式の決定論的適用も保証しません。"],
  ["B","完全なレビューを複数回実行し、同じ基準で異なる証拠が引用された場合は得点の中央値を使う。","Run several complete reviews and use the median score when reviewers cite different evidence for the same criterion.","誤り。複数回実行は分散を測れますが、証拠不足を解消せず、固定式の正しさを多数の生成結果で代替しています。"],
  ["C","引用付き抽出、完全性検証、コードによる採点、所見作成を連結し、必須証拠がなければ後続段階を停止する。","Chain cited extraction, completeness validation, code-based scoring, and note drafting; block later stages whenever required evidence is absent.","正しい。証拠、完全性、決定論的計算、生成を分離し、欠落時のゲートを置くことで、流暢な所見が検証を追い越す根本原因を除きます。"],
  ["D","コンテキストウィンドウを拡大し、過去の申請、採点例、採択結果、レビュー所見を1回の生成呼び出しに含める。","Expand the context window and include prior applications, scoring examples, award outcomes, and reviewer notes in a single generation call.","誤り。過去例や採択結果は判断の参考になっても、必須証拠の欠落や固定式適用の混在を解消せず、不要なコンテキストも増やします。"],
  ["C"]],
[5,1,1,"Align solutions to business value pillars","物流会社は税関申告準備を短縮したいと考えています。出荷の87%は検証済みERP項目から承認済み様式へ決定論的にマッピングでき、残りは解釈が必要な曖昧な商品説明を含みます。申告APIは引き続き信頼できる記録系で、厳格な応答SLAがあります。価値と複雑性を最も適切に整合させる設計はどれですか。","A logistics company wants to shorten customs-entry preparation. Eighty-seven percent of shipments use deterministic mappings from verified ERP fields to approved forms; the rest contain ambiguous product descriptions requiring interpretation. The filing API remains the system of record and has a strict response SLA. Which design BEST aligns value and complexity?",
  ["A","標準出荷には決定論的マッピングを使い、曖昧な説明だけをAPI検証前にClaudeへ振り分ける。","Use deterministic mapping for standard shipments and route only ambiguous descriptions to Claude before API validation.","正しい。大半を高速で確実な既存処理に残し、解釈が価値を持つ少数ケースだけClaudeへ送るため、SLA、コスト、生産性を両立します。"],
  ["B","全出荷をClaudeへ送り、申告前に提案された全項目を承認済み様式とERP記録に照合する。","Send all shipments to Claude, then compare every proposed field with the approved form and ERP record before filing.","誤り。全項目の照合は安全性を高めますが、決定論的に処理できる87%にもモデルの遅延と変動を追加し、厳格なSLAに不利です。"],
  ["C","曖昧な説明はすべて税関担当者へ送り、Claudeは完成済み様式の書き直しだけに使う。","Send every ambiguous description to customs staff and use Claude only to rewrite completed forms.","誤り。安全な部分解ですが、解釈補助によって人手時間を減らせる主要な価値を活かさず、書き直しは承認済み様式にも不要です。"],
  ["D","検証済みERPマッピングを過去の商品説明で訓練した意味的ルーターへ置き換え、送信前のAPI検証は残す。","Replace verified ERP mappings with a semantic router trained on historical descriptions, retaining API validation before submission.","誤り。API検証を残しても、確実に処理できる大半を確率的ルーティングへ置き換える根拠がなく、複雑性と変動を増やします。"],
  ["A"]],
[6,3,1,"Evaluate tool/agent configuration for capability bloat","読み取り専用のベンダーリスク支援は契約書とセキュリティ報告を検索できますが、ツール一覧には請求書承認、アカウント停止、リポジトリ削除、機能が重複する6つの検索関数も含まれます。ログでは検索関数の誤選択が頻発しています。capability bloatへ最も適切に対処する変更はどれですか。","A read-only vendor-risk assistant can search contracts and security reports, yet its tool list also includes invoice approval, account suspension, repository deletion, and six overlapping search functions. Logs show frequent selection of the wrong search function. What change BEST addresses capability bloat?",
  ["A","全ツールを残し、名前にapprove、suspend、deleteを含む呼び出しだけ確認を必須にする。","Retain all tools but require confirmation before calls whose names contain approve, suspend, or delete.","誤り。確認は高リスク実行の補償統制ですが、不要ツールはモデルに提示されたままで、重複検索の誤選択も解消しません。"],
  ["B","書き込みツールを第2エージェントへ移し、オーケストレーターがベンダー質問をどちらにも委任できるようにする。","Move the write tools to a second agent while allowing the orchestrator to delegate vendor questions to either agent.","誤り。直接の露出は減りますが、読み取り専用の役割に不要な書き込み能力へ到達可能なままで、オーケストレーションも過剰です。"],
  ["C","全関数をリスク階層の接頭辞付きに改名し、残した全ツール呼び出しの代表例をシステムプロンプトへ追加する。","Rename every function with a risk-tier prefix and add representative examples for all retained tool calls to the system prompt.","誤り。リスク表示と例は選択改善に役立つ場合がありますが、読み取り専用業務に不要な能力と重複検索を残し、コンテキストも肥大化させます。"],
  ["D","必要な読み取り専用能力だけを公開し、重複検索を明確に区別できるタスク固有のインターフェースへ統合する。","Expose only necessary read-only capabilities and consolidate overlapping searches behind clearly differentiated, task-specific interfaces.","正しい。最小能力に制限して攻撃面を減らし、重複機能と曖昧な説明を整理するため、観測された誤選択の根本原因にも対処します。"],
  ["D"]],
[7,3,2,"Analyze authentication and authorization requirements","リモートMCPサーバーが複数クライアントへプロジェクト記録を提供します。試作版は全従業員で1つの長期サービストークンを使いますが、記録はサインイン済みユーザーの組織とプロジェクトロールで制限する必要があります。IDと認可のギャップを最も直接解消する変更を2つ選んでください。","A remote MCP server provides project records to several clients. The prototype uses one long-lived service token for all employees, while records must be limited by the signed-in user's organization and project role. Which TWO changes MOST directly close the identity and authorization gaps? Select TWO.",
  ["A","共有トークンを暗号化して頻繁に更新し、単一のサーバー主体を維持したままクライアント申告のユーザーIDをログへ付ける。","Encrypt and rotate the shared token frequently, then attach a client-supplied user ID to logs while retaining one server principal.","誤り。資格情報保護と監査ログは改善しますが、信頼できるユーザー主体と組織が認可判断へ伝わらず、リソース単位の権限強制になりません。"],
  ["B","ユーザーIDと承認済みスコープを保持する短期トークンを用いた適切な委任認可フローを使う。","Use an appropriate delegated authorization flow with short-lived tokens that preserve the user's identity and approved scopes.","正しい。ユーザー代理の呼び出しを識別し、権限範囲をトークンへ結び付け、長期共有資格情報の漏えい影響も縮小できます。"],
  ["C","サービストークンで広範な記録を取得し、クライアント提供の組織値とロール値を使ってClaudeにプロジェクトを絞り込ませる。","Fetch broad records with the service token, then ask Claude to filter projects using organization and role values supplied by the client.","誤り。広いデータを先に取得し、未信頼の入力とモデル判断へ認可を委ねます。データを保有するサービス境界での強制にはなりません。"],
  ["D","各呼び出しでトークンを検証し、MCPサーバー側で組織、ロール、リソース、操作の権限を強制する。","Validate the token and enforce organization, role, resource, and operation permissions at the MCP server for each call.","正しい。認証済み主体に対して、データを保有するサーバーが毎回リソース・操作単位の認可を行う必要があります。"],
  ["B","D"]],
[8,3,1,"Evaluate connection protocols and select the appropriate integration mechanism","企業内に、カタログを独立して変更する多数のツール提供元があります。Claudeクライアントは実行時にツール名、説明、入力スキーマを発見し、1つの相互運用可能な契約で呼び出す必要があります。最も適切な仕組みはどれですか。","An enterprise has many internal tool providers whose catalogs change independently. Claude clients should discover tool names, descriptions, and input schemas at runtime and invoke them through one interoperable contract. Which mechanism is MOST appropriate?",
  ["A","提供元ごとに型付きSDKを生成し、カタログ版を中央公開して、インターフェース変更のたびにクライアントを再デプロイする。","Generate a typed SDK for each provider, publish catalog versions centrally, and redeploy clients whenever an interface changes.","誤り。安定APIとコンパイル時検査には使えますが、変更ごとのクライアント更新が必要で、実行時発見という中心要件を満たしません。"],
  ["B","コマンドラインのヘルプ文を標準化し、各クライアントに提供元固有の出力規約を解析させる。","Standardize command-line help text and let each client parse provider-specific output conventions.","誤り。CLI統合には有用でも、クライアント別アダプターが残り、共通のスキーマ発見・呼び出し契約になりません。"],
  ["C","標準化されたツール一覧、スキーマ、対応時の変更通知、呼び出しを公開するMCPサーバーを使う。","Use MCP servers that expose standardized tool listing, schemas, change notifications where supported, and invocation.","正しい。MCPのtools/listとtools/call、およびツールメタデータ契約が、複数提供元の実行時発見と相互運用性に直接対応します。"],
  ["D","各提供元を自律的な対等エージェントとして包み、ツール選択と入力項目をagent-to-agentメッセージで交渉する。","Wrap each provider as an autonomous peer agent and negotiate tool selection and input fields through agent-to-agent messages.","誤り。自律的協調が必要な要件はなく、単純なツール発見とスキーマ付き呼び出しに対して過剰設計です。"],
  ["C"]],
[9,3,1,"Evaluate progressive discovery vs. monolithic context strategy","設計エージェントは240個の専門ツールへアクセスできますが、通常のタスクで必要なのは3個です。全スキーマを送るとコンテキストを消費し選択が曖昧になりますが、セッションを再開せず希少ツールへ到達できる必要があります。制約を最もよく満たす戦略はどれですか。","A design agent may access 240 specialized tools, but typical tasks need three. Sending every full schema consumes context and creates ambiguous choices; rare tools must remain reachable without restarting the session. Which strategy BEST satisfies the constraints?",
  ["A","人気上位のスキーマを読み込み、未対応要求は静的ディレクトリから選んだ専門アプリケーションへ振り分ける。","Load the most popular schemas and route unsupported requests to a specialist application selected from a static directory.","誤り。初期負荷は減りますが、別アプリケーションへの移送となり、同じセッションから希少ツールへ到達する要件を満たしません。"],
  ["B","検索可能な簡潔カタログを公開し、現在のタスクに関連するツールだけ完全なスキーマを取得する。","Expose a compact searchable catalog, then retrieve complete schemas only for tools relevant to the current task.","正しい。progressive discoveryにより初期コンテキストと曖昧性を抑え、必要になった希少ツールも詳細取得して正確に呼び出せます。"],
  ["C","最初のユーザーメッセージから固定スキーマ束を1つ選び、新しいセッションまで束外の発見を禁止する。","Select one fixed schema bundle from the first user message and prohibit discovery outside it until a new session.","誤り。事前ルーティングは効率的でも、初期判定が外れた場合に同一セッションで希少ツールへ到達できません。"],
  ["D","汎用実行関数を1つ公開し、ツール名と例だけから各ツールの引数型をモデルに推測させる。","Expose one generic execution function and require the model to infer each tool's argument types from names and examples.","誤り。提示量は減りますが、正式な入力スキーマを欠くため検証可能性と呼び出し精度を犠牲にします。"],
  ["B"]],
[10,3,2,"Analyze observability challenges and select monitoring strategies at scale","分散型の契約支援は、クエリ正規化、ハイブリッド検索、再順位付け、Claude生成、任意のツール検証を行います。一部回答に根拠がなく、記録には機密条件が含まれます。本番診断へ最も強い証拠を提供するテレメトリ変更を2つ選んでください。","A distributed contract assistant performs query normalization, hybrid retrieval, reranking, Claude generation, and optional tool validation. Some answers are unsupported, and records contain confidential terms. Which TWO telemetry changes provide the strongest production diagnosis? Select TWO.",
  ["A","全段階へトレースIDを伝播し、段階のバージョン、時間、状態、エラー分類を記録する。","Propagate a trace ID across every stage and record stage versions, timings, status, and error categories.","正しい。複数インスタンスと段階を1要求として結び、どの版・段階で遅延や障害が生じたかを切り分けられます。"],
  ["B","サービス別の日次レイテンシ、エラー、トークン集計を保持し、保存量削減のため要求相関と段階ペイロード参照を省く。","Keep per-service daily latency, error, and token aggregates, omitting request correlation and stage payload references to reduce storage.","誤り。運用傾向には有用ですが、特定の未根拠回答が通過した段階と証拠を要求単位で再構成できません。"],
  ["C","全要求の完全な生プロンプト、検索文書、ツール出力を、広くアクセス可能な分析テーブルへ保存する。","Store complete raw prompts, retrieved documents, and tool outputs for every request in a broadly accessible analytics table.","誤り。診断情報は豊富でも、機密条件を必要以上に複製・公開し、本番のデータ最小化とアクセス制御へ配慮していません。"],
  ["D","アクセス制御下で、マスキング済み検索ID、関連性・再順位付け信号、引用、回答根拠性の結果を取得する。","Capture redacted retrieval IDs, relevance and rerank signals, citations, and answer-groundedness outcomes under access controls.","正しい。検索された証拠と生成の忠実性をリクエスト単位で比較でき、マスキングとアクセス制御で機密性も保てます。"],
  ["A","D"]],
[11,3,1,"Evaluate accuracy-latency trade-offs and justify configuration decisions","音声アシスタントは96%以上のタスク成功率と1.6秒未満のエンドツーエンドp95レイテンシを達成する必要があります。負荷テスト結果は：経路1(小型のみ)93.8%, 0.8s / 経路2(高性能のみ)97.4%, 2.3s / 経路3(小型＋不確かな意図だけ高性能)96.2%, 1.5s / 経路4(両方＋judge)98.0%, 3.1s。提示要件から最も妥当な経路はどれですか。","A voice assistant must achieve at least 96% task success and p95 end-to-end latency below 1.6 seconds. Representative load tests show: Path 1: 93.8%, 0.8 s / Path 2: 97.4%, 2.3 s / Path 3: compact model, uncertain intents routed to capable model — 96.2%, 1.5 s / Path 4: 98.0%, 3.1 s. Which path is BEST justified?",
  ["A","実測カスケードが両閾値を満たす唯一の選択肢なので、経路3。","Path 3, because its measured cascade is the only option satisfying both thresholds.","正しい。成功率96.2%とp95 1.5秒で両必須閾値を満たします。他経路は品質またはレイテンシのいずれかに違反します。"],
  ["B","経路1を選び、そのレイテンシ余裕を本番後に初めて測定する再試行方針へ使う。","Choose Path 1 and spend its latency margin on a retry policy that will be measured only after deployment.","誤り。現時点の成功率が93.8%で要件未達です。未測定の再試行で必須品質とp95の両方を満たすとは正当化できません。"],
  ["C","実測p95レイテンシ超過を大きな品質余裕が補うとして、経路2を選ぶ。","Choose Path 2 because its larger quality margin compensates for the measured p95 latency overrun.","誤り。品質余裕はありますがp95 2.3秒は明示SLA違反で、品質とレイテンシの双方が必須という条件を外せません。"],
  ["D","本番トラフィックが反復的になったらjudge結果をキャッシュする計画で、経路4。","Path 4, planning to cache the judge result once production traffic becomes repetitive.","誤り。現構成のp95は3.1秒で要件未達であり、将来の回答キャッシュは個別音声タスクに対して未検証です。"],
  ["A"]],
[12,2,1,"Model selection based on measured quality, latency, and cost","ある基盤は大量の言語判定と、少量の本番インシデント根本原因分析を行います。1つの高能力モデルは両方の品質目標を満たしますが、分類のコスト・レイテンシ予算を超えます。最適なモデル選定戦略はどれですか。","A platform performs high-volume language detection and low-volume root-cause analysis of production incidents. One capable model meets both quality targets, but misses the classification cost and latency budgets. What is the BEST model-selection strategy?",
  ["A","両タスクのトラフィック加重スコアで妥協的なモデルを選び、全体に単一の集計品質閾値を適用する。","Choose one compromise model using a traffic-weighted score, while enforcing a single aggregate quality threshold across both tasks.","誤り。大量の簡単な分類が集計値を支配し、少量で難しい分析の品質不足を隠す可能性があります。"],
  ["B","代表的な言語事例で小型モデルを評価し、合格する最小モデルを使い、インシデント分析には高能力モデルを残す。","Use the smallest model that passes representative language-task evals, while retaining the capable model for incident analysis.","正しい。タスク別評価で必要品質を満たす最小能力を選び、単純大量処理の予算と複雑分析の品質を同時に守れます。"],
  ["C","入力長とインシデント用キーワードで振り分け、長い入力またはキーワード一致時に高能力モデルを使う。","Route by input length and incident keywords, assuming longer or keyword-matched inputs require the capable model.","誤り。長さや表層キーワードは難易度の代理として未検証で、短い重大分析や長い簡単な分類を誤る可能性があります。"],
  ["D","分類はすべて高能力モデルでバッチ処理し、インシデント分析用の対話容量を確保して両方のモデル選択は変えない。","Batch all classification through the capable model, reserving interactive capacity for incident analysis and leaving both model choices unchanged.","誤り。バッチは単価低減に役立つ場合がありますが、分類のレイテンシ目標を確実に満たさず、より小さい合格モデルも評価していません。"],
  ["B"]],
[13,2,1,"Prompt caching with a stable reusable prefix","各リクエストには同じ大規模な製品カタログと安全方針があり、その後に小さな地域別在庫ブロックとユーザー質問が続きます。安定部分は週次で変更され、在庫と質問は毎回変わります。最も効果的なプロンプトキャッシュ配置はどれですか。","Each request includes the same large product catalog and safety policy, followed by a small region-specific inventory block and a user question. The stable material changes weekly; inventory and questions change each request. Which prompt-caching layout is MOST effective?",
  ["A","地域在庫を先頭に置き、その後に安定カタログと方針を続け、ユーザー質問の後へキャッシュ境界を置く。","Place region inventory first, followed by the stable catalog and policy, and set the cache breakpoint after the user question.","誤り。毎回変わる在庫が接頭部に入り、同一prefixのキャッシュヒットを壊します。境界も変動質問の後では再利用範囲が安定しません。"],
  ["B","ユーザー質問だけをキャッシュし、カタログは未キャッシュの接尾部として再送する。","Cache only the user question and resend the catalog as an uncached suffix.","誤り。変化する短い質問を再利用対象にし、反復コストの大きい安定カタログを外すため目的と逆です。"],
  ["C","地域ごとの完全プロンプトを作り、在庫値が1つ変わるたびに全キャッシュを無効化する。","Create separate full prompts per region and invalidate every cache whenever one inventory value changes.","誤り。地域別prefixは条件次第で使えますが、変動在庫を安定部分と結合し、不要な全体無効化を招きます。"],
  ["D","安定したカタログ・方針を再利用prefixとしてキャッシュし、変動する地域在庫とユーザー質問を後置する。","Cache the stable catalog-policy prefix, then append the changing regional inventory and user question.","正しい。キャッシュは同一prefixを再利用するため、長く安定した内容を先頭へまとめ、変動部分をブレークポイント後へ置くのが適切です。"],
  ["D"]],
[14,2,2,"Context-window and token-budget management","調査チャットのセッションがコンテキスト上限に近づいています。長い再利用可能な指示ブロック、多数の解決済み会話ターン、正確な文言を引用用に保持すべき検索抜粋が含まれます。アーキテクトが最初に行うべき対応を2つ選んでください。","A research-chat session approaches its context limit. It contains a long reusable instruction block, many resolved conversational turns, and retrieved excerpts whose exact wording must remain available for citations. Which TWO actions should the architect take first? Select TWO.",
  ["A","構成要素別にトークンを数え、想定回答と引用ブロックの容量を明示的に確保する。","Count tokens by component and reserve explicit capacity for the expected answer and citation blocks.","正しい。入力だけで上限を使い切らないよう、何が予算を消費しているか測定し、必須出力領域を先に確保する必要があります。"],
  ["B","全出典抜粋を要約して文書・節識別子を残し、要約検証後は元の文言を破棄する。","Summarize every source excerpt, retain its document and section identifiers, and discard the original wording after summary verification.","誤り。要約と識別子は検索には有用でも、正確な文言による引用という明示要件を失うため、保持対象の優先順位が逆です。"],
  ["C","解決済み履歴を検証済み要約へ圧縮し、選択された出典抜粋と安定した出典識別子は原文どおり保持する。","Compact resolved history into a verified summary while preserving the selected source excerpts and stable source identifiers verbatim.","正しい。引用根拠を損なわず、現在の問いに低信号な会話履歴を圧縮するため、コンテキスト予算を要件に沿って回復できます。"],
  ["D","利用可能な最大コンテキストへ切り替え、解決済みターンをすべて保持し、プロンプト構築と出力予算の規則は変えない。","Switch to the largest available context window, retain every resolved turn, and leave all prompt-assembly and output-budget rules unchanged.","誤り。必要原文を削れない場合の候補ですが、まず未管理の履歴と出力予算を改善せず、コストと注意希薄化を残す過剰な初手です。"],
  ["A","C"]],
[15,2,1,"Few-shot prompting and guardrails for structured outputs","インシデントAPIは、LOW、MEDIUM、HIGH、CRITICALのいずれかのseverityと、証拠ID配列を含むJSONを返す必要があります。現在は見た目が有効なJSONでも独自severityラベルや説明文が混入します。下流契約を最も適切に強制する変更はどれですか。","An incident API must return JSON containing severity from LOW, MEDIUM, HIGH, or CRITICAL, plus an array of evidence IDs. The application currently gets valid-looking JSON with invented severity labels and occasional commentary. Which change BEST enforces the downstream contract?",
  ["A","有効・無効JSON例を追加し、severityラベルと証拠ID配列の正規表現検査に失敗した回答を再試行する。","Add valid and invalid JSON examples, then retry responses that fail regex checks for severity labels and the evidence-ID array.","誤り。例と再試行は改善しますが、正規表現では型、必須項目、enum、余分な文章を完全に強制できず、独自ラベルが再発し得ます。"],
  ["B","必須項目、severityのenum、型付き証拠ID、追加プロパティ禁止を定めたJSON structured outputを使う。","Use JSON structured output with required fields, a severity enum, typed evidence IDs, and no extra properties.","正しい。制約付きデコードで有効JSON、必須型、許可値、余分なフィールドを契約として強制し、観測された形式違反へ直接対処します。"],
  ["C","プロンプトからJSONオブジェクトを写す前に、severity判断理由を説明するようClaudeへ求める。","Ask Claude to explain its severity reasoning before printing a JSON object copied from the prompt.","誤り。判断説明は分類品質の補助になり得ますが、JSON外の文章をむしろ促し、許可値を機械的に制約しません。"],
  ["D","severityを任意文字列で受け、未知ラベルはMEDIUMへ割り当て、説明文は後処理で破棄する。","Accept any severity string, map unfamiliar labels to MEDIUM, and discard commentary during post-processing.","誤り。構文上の余分な文は除けても、意味不明な値を中程度へ黙って変換し、実際の重大度を誤る可能性があります。"],
  ["B"]],
[16,4,1,"Evaluation metrics and representative datasets","チームは定型要求が大半を占めるテストセットでトリアージ分類器を評価しています。希少カテゴリにはデータ漏えいとアカウント乗っ取りがあり、偽陰性のコストが高くなります。報告は全体精度だけです。最適な再設計はどれですか。","A team evaluates a triage classifier using a test set dominated by routine requests. Rare categories include data exposure and account takeover, where false negatives are costly. Only overall accuracy is reported. What is the BEST redesign?",
  ["A","現在のセットを維持し、定型要求のサブタイプだけで層別した大規模な本番ランダム標本を追加する。","Keep the current set and add a larger random production sample, segmented only by routine request subtype.","誤り。本番の定型要求比率は詳しく測れますが、重要な希少カテゴリの例不足と偽陰性の不可視性は解消しません。"],
  ["B","全カテゴリを同数にし、macro accuracyと全体精度をリリース基準にする。","Balance all categories equally and use macro accuracy plus overall accuracy as the release criteria.","誤り。少数クラスは見やすくなりますが、高損失カテゴリの再現率や混同先を精度指標だけでは直接判断できません。"],
  ["C","データ漏えいまたは乗っ取りと予測された事例だけを確認し、レビュー修正をモデル成功として数える。","Review only cases predicted as data exposure or takeover and count reviewer corrections as model successes.","誤り。一般カテゴリへ誤分類された希少事例を見逃し、修正後結果でモデル自体の性能も過大評価します。"],
  ["D","重要カテゴリを十分に含むラベル付きセットを作り、クラス別適合率、再現率、混同傾向、集計性能を報告する。","Build a labeled set covering each important category and report per-class precision, recall, confusion patterns, and aggregate performance.","正しい。希少だが高コストな失敗を全体精度から分離し、特に偽陰性を再現率と混同傾向で直接測定できます。"],
  ["D"]],
[17,4,1,"Choosing code-based, LLM-based, and human graders","生成された監査パケットは、有効なJSON、統制IDの完全一致、証拠を実質的に誇張しない記述、という3基準を満たす必要があります。最も適切な採点設計はどれですか。","A generated audit packet must satisfy three criteria: parse as JSON, include an exact set of control IDs, and present a narrative that does not materially overstate the evidence. Which grading design is MOST appropriate?",
  ["A","全基準に1つのルーブリック付きLLM graderを使い、5回反復して各パケットの多数決を採用する。","Use one rubric-based LLM grader for all criteria, repeat it five times, and accept the majority verdict for each packet.","誤り。反復は意味判定の分散を減らせますが、JSON解析とID完全一致まで確率的評価にする必要はありません。"],
  ["B","JSONとIDは決定論的に検査し、承認済み参照文1つとの較正済み埋め込み類似度が閾値未満の記述を不合格にする。","Use deterministic checks for JSON and IDs, then reject narratives below a calibrated embedding-similarity threshold to one approved reference.","誤り。前半は適切ですが、較正しても類似度は正しい言い換えと証拠誇張を確実に区別できず、意味基準の十分なgraderではありません。"],
  ["C","構文とIDにはコード、主張にはルーブリック付きLLM graderを使い、フラグ対象は人間レビューへ回す。","Use code for syntax and IDs, a rubric-based LLM grader for claims, and human review for flagged cases.","正しい。決定的基準を再現可能なコードへ、意味的基準をスケール可能なgraderへ割り当て、難しい判断を人間で補完します。"],
  ["D","訓練済み監査人に全項目と全文章を確認させ、コードは不正形式のパケットを先に並べる用途だけに使う。","Assign trained auditors to inspect every field and sentence, using code only to queue malformed packets for earlier review.","誤り。最高リスク・小規模用途では成立しますが、機械検査可能な基準まで全件人手にするのは過剰で、適切な自動化分担を欠きます。"],
  ["C"]],
[18,4,2,"Controlled A/B testing and production monitoring","チームは新しい検索プロンプトを本番版と比較します。要求難易度は時間帯で変わり、重大な方針違反は低頻度ですが高コストです。有効な比較と安全な展開を最も適切に支える実践を2つ選んでください。","A team will compare a new retrieval prompt against production. Request difficulty changes throughout the day, and severe policy violations are infrequent but costly. Which TWO practices BEST support a valid comparison and safe rollout? Select TWO.",
  ["A","平日は現行プロンプト、週末は新プロンプトを実行し、要求件数とトピック構成で結果を正規化する。","Run the current prompt on weekdays and the new prompt on weekends, then normalize results by request count and topic mix.","誤り。観測したトピック構成を補正しても、時間帯、利用者、難易度などの未観測差が残り、プロンプト効果と期間効果が交絡します。"],
  ["B","同時期の適格要求をランダム化し、主要指標、標本規則、停止基準を事前定義する。","Randomize concurrent eligible requests, and predefine primary metrics, sample rules, and stopping criteria.","正しい。同時ランダム割り当てで時間変動の交絡を減らし、事前定義で都合のよい事後判断を抑えます。"],
  ["C","カナリアを使って平均評価とレイテンシを監視し、希少な方針違反はいずれかの集計値を下げると仮定する。","Use a canary and monitor average rating and latency, assuming rare policy violations will lower one of those aggregate metrics.","誤り。カナリア自体は適切でも、低頻度・高損失の違反は平均評価や遅延に埋もれるため、専用の安全ガードレールが必要です。"],
  ["D","案別に品質、方針違反、レイテンシ、エラー、トークンを計測し、違反アラートとテスト済みロールバック経路を用意する。","Instrument quality, policy violations, latency, errors, and tokens by variant, with breach alerts and a tested rollback path.","正しい。比較指標と重大違反の専用信号を持ち、検知時に影響を限定できる運用保護を提供します。"],
  ["B","D"]],
[19,4,1,"Diagnosing hallucinations with evidence-level traces","ハイブリッド検索インデックスの更新後、技術支援の事実的に根拠のない回答が増えました。ログにはユーザー質問と最終文だけが残っています。検索失敗と生成失敗を最もよく区別する次の対応はどれですか。","After a hybrid-search index upgrade, a technical assistant gives more factually unsupported answers. Logs retain only the user question and final text. Which next step BEST distinguishes retrieval failure from generation failure?",
  ["A","書き換えクエリ、順位付き出典ID、Claudeへ渡した証拠、引用を追跡し、検索網羅性と回答忠実性を別々に評価する。","Trace rewritten queries, ranked source IDs, evidence sent to Claude, and citations; grade retrieval coverage separately from answer faithfulness.","正しい。必要証拠が候補・再順位付け・最終コンテキストのどこで落ちたかと、渡された証拠から生成が逸脱したかを証拠レベルで分離できます。"],
  ["B","インデックスを戻し、最近の苦情を両版で再実行して、テレメトリ変更前に回答評価と引用数を比較する。","Roll back the index, replay recent complaints against both versions, and compare answer ratings and citation counts before changing telemetry.","誤り。影響緩和と差の再現には有用ですが、集計評価と引用数だけでは各版で検索と生成のどちらが失敗したか分かりません。"],
  ["C","各最終回答を出典ID付きの全コーパス文章と根拠性・引用graderで比較するが、Claudeへ実際に渡した証拠は保持しない。","Compare each final answer against complete corpus passages labeled with source IDs using groundedness and citation graders, without preserving the evidence actually retrieved for Claude.","誤り。コーパス内に根拠が存在するかは分かっても、その根拠がモデルへ渡されたか不明で、検索失敗と生成失敗を切り分けられません。"],
  ["D","引用のない回答をすべて拒否し、トピック別拒否率を監視して、拒否率が安定してから検索を調査する。","Reject every answer without a citation, monitor rejection by topic, and investigate retrieval after the rate stabilizes.","誤り。利用者保護にはなるものの、検索不足と引用生成失敗を計測する前にガードレールを適用しており、根本原因診断の順序が逆です。"],
  ["A"]],
[20,4,1,"Cost and latency optimization without sacrificing quality","保険会社の通話後レポート作成では事実性検査に合格していますが、処理単価と応答時間SLOは未達です。計測すると、全顧客に共通する約款を毎回再送し、終了案件の履歴も入力へ蓄積し、定型通話と複雑な紛争で同じモデルを使っていました。低リスクの改善から進める手順はどれですか。","An insurer's post-call report service passes factuality checks, but its unit cost and response-time SLO fail. Profiling shows that shared policy text is resent for every customer, closed-case history accumulates in prompts, and routine calls use the same model as complex disputes. What should the team do first and next?",
  ["A","まず短いプロンプトをすべて小型モデルへ振り分け、p95が予算超過のままの場合だけコンテキスト構築を調べる。","Route all short prompts to a smaller model first, then inspect context assembly only if p95 latency remains above budget.","誤り。短さは難易度の検証済み指標ではなく、トレースで既に観測された不要コンテキスト原因への対処を後回しにしています。"],
  ["B","完全な会話履歴をキャッシュし、現在のモデルは維持して、予算を満たすまで生成要約を短くする。","Cache the complete conversation history, retain the current model, and shorten generated summaries until the latency budget is met.","誤り。出力短縮は遅延を下げ得ますが、変動する不要履歴ではキャッシュ効果が限られ、観測済みの入力コスト原因も残します。"],
  ["C","無関係履歴を削り、安定定型文をキャッシュした後、小型モデルへの振り分けを品質、p95、コストとともに検証する。","Trim irrelevant history and cache stable boilerplate; then test smaller-model routing while monitoring quality, p95, and cost.","正しい。トレースで確認した低リスクの入力問題を先に直して効果を測り、その後モデル変更をタスク別品質評価付きで段階導入します。"],
  ["D","小規模ランダム品質標本に合格したら全件を高速モデルへ移し、完全プロンプトとロールバック手段は維持する。","Move all traffic to a faster model after a small random quality sample passes, while retaining the full prompt and rollback option.","誤り。ロールバックはあっても代表性とタスク別閾値が弱く、観測済みの不要入力を残したまま全面移行するため、変更順序が不適切です。"],
  ["C"]],
[21,5,1,"Human-in-the-loop (HITL) review and risk-based escalation","Claudeが自治体の緊急対応チーム向け公開通知を下書きします。通常の文法修正は低リスクですが、避難区域、期限、避難所住所の変更は被害を生じ得ます。チームは高影響判断を自律化せず負担を減らしたいと考えています。最適な設計はどれですか。","Claude drafts public notices for a municipal emergency team. Routine grammar changes are low risk, but changing evacuation zones, deadlines, or shelter addresses could cause harm. The team wants workload reduction without autonomous high-impact decisions. Which design BEST meets the goal?",
  ["A","検証済みテンプレートの低リスク表現修正は自動適用し、区域、期限、住所、競合する事実の変更は公開前に権限者承認を必須とする。","Auto-apply low-risk wording edits in validated templates, but require authorized approval before releasing changes to zones, deadlines, addresses, or conflicting facts.","正しい。内容の影響度でエスカレーションし、定型編集だけを自動化しながら、高リスク事実と競合判断を送信前の人間承認へ残します。"],
  ["B","避難区域の変更は承認対象とするが、期限と住所は最新の自治体記録との一致確認後に自動公開する。","Require approval for evacuation-zone changes, but auto-publish deadline and address updates after matching them to the latest municipal record.","誤り。記録との一致確認は有用でも、期限と住所も高影響と明記されており、それらの自律公開は要件に違反します。"],
  ["C","過去通知で検証し、承認済みテンプレート内の全下書きを自動公開して、公開後に重大度加重標本をレビューする。","Validate on historical notices, auto-publish all drafts within approved templates, and review a severity-weighted sample after release.","誤り。テンプレートと事後サンプリングは傾向監視に有用ですが、個々の高影響な事実変更を住民への公開前に止められません。"],
  ["D","パイロット中は全下書きを承認対象にし、全体精度と住所検証の目標達成後はすべての承認ゲートを外す。","Require approval for every draft during the pilot, then remove all gates once aggregate accuracy and address-validation targets are met.","誤り。全面承認は初期統制になりますが、平均目標達成後も希少な区域・期限・住所の失敗は残るため、本番のリスクベース境界を失います。"],
  ["A"]],
[22,5,2,"Guardrails, failure modes, and defense in depth","大学の研究支援アシスタントは助成金申請書を読み、審査メモの下書きを作成します。取得した添付ファイルにはアシスタントを誘導する命令が含まれる可能性があり、未公開の申請書を外部の共同作業領域へコピーしてはなりません。最初に実装すべき統制を2つ選択してください。","A university research assistant reads grant proposals and can create draft review notes. Retrieved attachments may contain instructions aimed at the assistant, and unpublished proposals must not be copied into external collaboration spaces. Which TWO controls should be implemented first? Select TWO.",
  ["A","添付テキストを信頼できないデータとして扱い、統制命令から分離し、敵対的な添付ファイルを評価に含める。","Treat attachment text as untrusted data, separate it from governing instructions, and include adversarial attachments in evaluations.","正しい。文書内命令を権威ある指示として扱わない設計と、観測対象に即した敵対的評価がプロンプトインジェクションへ直接対応します。"],
  ["B","システムプロンプトに警告を追加し、認証済みの共同作業領域への書込みを許可した上で、添付による挙動変化を月次標本レビューする。","Add a warning to the system prompt, allow writes to any authenticated workspace, and review a monthly sample for signs that attachments changed behavior.","誤り。警告と標本レビューは補助策として妥当ですが、認証済みであっても外部領域へのコピーを実行時に止めず、明示された持ち出し制約を満たしません。"],
  ["C","コンテンツを書き込む前に、アクション層で宛先の許可リストと認証済み審査担当者の権限を強制する。","Enforce destination allowlists and the authenticated reviewer's permissions in the action layer before any content is written.","正しい。データ持ち出し制約はモデルの判断ではなく書き込み境界で毎回強制することで、誘導された場合も禁止宛先への送信を防げます。"],
  ["D","すべての審査メモ案を第2のモデルに承認させ、両モデルが宛先を内部と分類した場合にエクスポートを許可する。","Require a second model to approve every draft note and permit exports when both models classify the destination as internal.","誤り。モデル間確認は品質補助にはなりますが、同じ悪意ある内容に影響され得ます。宛先認可をモデル分類へ委ねる点でCより弱い統制です。"],
  ["A","C"]],
[23,5,1,"Regulatory scoping for GDPR, HIPAA, and FedRAMP","あるベンダーは、EUの従業員ヘルプデスク、米国病院の予約センター、連邦政府請負業者の社内ナレッジポータル向けに、1つのClaudeサービスを適応させています。経営陣は、準拠したクラウドリージョンを選べば3つすべてを準拠と表示できるか尋ねています。最も適切な回答はどれですか。","A vendor is adapting one Claude service for an EU employee-help desk, a U.S. hospital's appointment center, and a federal contractor's internal knowledge portal. Executives ask whether choosing a compliant cloud region is enough to label all three deployments compliant. What is the BEST response?",
  ["A","3つの展開すべてに最も厳しい保持・暗号化設定を適用し、共通監査資料を使って、共有基盤を3制度すべてに準拠として文書化する。","Apply the strictest retention and encryption settings across all deployments, use one shared audit package, and document the platform as compliant with all three regimes.","誤り。厳しい保持・暗号化と共通監査資料は有用でも、処理目的、主体の役割、契約、認可範囲は制度ごとに異なり、一括の準拠宣言を裏付けません。"],
  ["B","主張を行う前に、法務・セキュリティ責任者と各展開のデータ、関係者、目的、統制、契約、ホスティング境界を個別にスコープする。","Scope each deployment's data, actors, purpose, controls, contracts, and hosting boundary with legal and security owners before making a claim.","正しい。GDPR、HIPAA、FedRAMPは適用対象と要求が異なるため、業務・データフロー・責任分界ごとの評価を先に行う必要があります。"],
  ["C","最初にHIPAAリスク評価を完了し、その技術統制をEUおよび連邦政府向け展開の証拠として再利用する。","Complete a HIPAA risk assessment first, then reuse its technical controls as proof for the EU and federal deployments.","誤り。共通統制は再利用できても、HIPAA評価がGDPR上の法的根拠やFedRAMPの認可範囲を証明するわけではありません。"],
  ["D","3つのワークロードで別々のシステムプロンプトを用意し、各業務責任者にモデル出力が地域要件を満たすと証明してもらう。","Keep separate system prompts for the three workloads and let each business owner attest that model outputs meet local requirements.","誤り。プロンプト分離と業務確認は一部の運用策ですが、データ処理、アクセス制御、監査、契約、基盤認可までをカバーしません。"],
  ["B"]],
[24,5,1,"Bias evaluation and transparency","公共図書館はClaudeを使い、デジタル技能指導の申込み優先度を付けています。全体の適合率は許容範囲ですが、第二言語で記述する利用者は、申告ニーズが同程度でも紹介率が大幅に低くなっています。最終招待は司書が送ります。拡大前に何をすべきですか。","A public library uses Claude to prioritize requests for digital-literacy coaching. Overall precision is acceptable, but patrons who write in a second language are referred substantially less often despite comparable stated needs. The final invitation is sent by a librarian. What should the team do BEFORE expansion?",
  ["A","最終判断を司書が行うためワークフローを維持し、全体の適合率を公表して、個別苦情を四半期のアクセシビリティ監査で確認する。","Keep the workflow because a librarian makes the final decision, publish aggregate precision, and review individual complaints in a quarterly accessibility audit.","誤り。人間の最終操作と苦情監査は有用でも、偏った順位付けが候補を狭める影響を拡大前に測定・緩和できません。全体指標も群間格差を隠します。"],
  ["B","プロンプトから言語指標を除き、全体紹介率が以前の水準へ戻ったら開始する。","Remove language indicators from the prompt and launch once the overall referral rate returns to its previous level.","誤り。明示的な言語指標の削除だけでは文体を通じた代理変数を除けず、全体率では問題群の改善を確認できません。"],
  ["C","群別の誤り率と紹介率を測り、原因とデータ不足を調査・緩和し、審査者にシステムの役割を開示する。","Measure error and referral rates by relevant groups, investigate causal features and data gaps, mitigate them, and disclose the system's role to reviewers.","正しい。観測された格差を分解評価し、原因調査と緩和、透明性を組み合わせることで、公平性と人間レビューの実効性を検証できます。"],
  ["D","言語別に学習例を均衡化し、司書レビューを言語群ごとの固定紹介枠に置き換える。","Balance the training examples by language and replace librarian review with a fixed referral quota for each language group.","誤り。例の均衡化は候補策ですが効果検証がなく、固定枠は個別ニーズや運用目的を損なう過剰な変更になり得ます。"],
  ["C"]],
[25,6,1,"Structured discovery and measurable success criteria","不動産管理会社が、保守作業の滞留を『解消する』Claudeアシスタントを求めています。入居者、配車担当者、請負業者で完了の定義が異なり、会社にはトリアージ時間や再訪率の基準値がありません。アーキテクトが最初に行うべきことはどれですか。","A property-management firm asks for a Claude assistant to 'eliminate maintenance backlog.' Tenants, dispatchers, and contractors use different definitions of completion, and the firm has no baseline for triage time or repeat visits. What should the architect do FIRST?",
  ["A","各役割と現行ワークフローを可視化し、意思決定権と完了定義に合意してから、測定可能な成果と制約の基準値を取る。","Map the current workflow with each role, agree on decision rights and a completion definition, then baseline measurable outcomes and constraints.","正しい。解決対象、責任境界、現状値を先に整えることで、機能ではなく測定可能な業務成果に設計を結び付けられます。"],
  ["B","過去チケットから自律配車を試作し、各役割に局所指標を選ばせ、試行で不一致が表面化した後に完了定義を調整する。","Prototype autonomous dispatch from historical tickets, let each role select locally useful metrics, and reconcile completion definitions after the pilot reveals disagreements.","誤り。試作で論点を発見する方法はあり得ますが、権限と完了定義を決めずに自律配車と局所指標を先行させる順序では、全体の滞留や再訪を悪化させ得ます。"],
  ["C","最速モデルを選び、初回リリースでは平均チケット経過日数だけを成功指標にする。","Select the fastest model and use average ticket age as the single success metric for the first release.","誤り。モデル選定が発見に先行しており、平均値だけでは緊急案件、品質、再訪、役割間の完了差を捉えられません。"],
  ["D","経営陣に自動化率目標を設定してもらい、その目標からワークフローと承認統制を導く。","Ask executives to set an automation percentage target, then derive the workflow and approval controls from that target.","誤り。自動化率は手段であり、業務成果やリスク境界を定義しません。現場の意思決定と現状測定を先に確認する必要があります。"],
  ["A"]],
[26,6,1,"Communicating architecture trade-offs","病院委員会は、すべての紹介状に高能力モデルを使う案と、項目抽出には高速モデル、曖昧な臨床要約には高能力モデルを使うタスク別ルーティング案を比較しています。臨床側は欠落、運用側はp95レイテンシ、財務側は費用を重視します。アーキテクトは判断をどう提示すべきですか。","A hospital committee must choose between one high-capability model for all referral letters and task routing that uses a faster model for field extraction while reserving the stronger model for ambiguous clinical summaries. Clinicians emphasize omissions; operations emphasizes p95 latency; finance emphasizes spend. How should the architect present the decision?",
  ["A","統一構成になる単一の高能力モデルを推奨し、導入後に欠落率、p95レイテンシ、費用を測って単純な設計が妥当だったか確認する。","Recommend the single stronger model for its uniform architecture, then measure omission rates, p95 latency, and spend after rollout to confirm that the simpler design was acceptable.","誤り。単純性は利点で、導入後の測定も必要ですが、患者影響のある欠落やp95条件を本番前に方式間で比較せず先に決定する順序が不適切です。"],
  ["B","抽出は構造的に単純なのでルーティングを推奨し、遅延と欠落の試験は展開後に回す。","Recommend routing because extraction is structurally simpler, and defer latency and omission testing until after deployment.","誤り。妥当な仮説でも、患者影響のある欠落とSLAを本番前に代表データで検証しない順序が不適切です。"],
  ["C","モデルのベンチマーク得点と単価を示し、財務部門に単一の加重得点へ変換してもらう。","Show model benchmark scores and unit prices, then let finance convert them into a single weighted score for the committee.","誤り。一般ベンチマークと価格だけでは実タスクの欠落率やp95遅延を示せず、臨床・運用の判断基準も財務へ偏ります。"],
  ["D","合意した欠落率・p95閾値に対するタスク別評価、総費用、ルーティング障害モード、元に戻せる導入計画を提示する。","Present task-level evaluation results against agreed omission and p95 thresholds, total cost, routing failure modes, and a reversible rollout plan.","正しい。各関係者の懸念を共通の測定可能な比較へ変換し、方式ごとのリスクと可逆性まで示すため、判断可能なトレードオフ説明になります。"],
  ["D"]],
[27,6,2,"SLA design and production feedback loops","多言語の自治体給付アシスタントが本番移行します。コンテンツは毎週再公開され、住民は回答に異議申立てできます。パイロットでは稼働率と平均遅延だけを報告しています。実行可能なSLAとフィードバックループを作る追加事項を2つ選択してください。","A multilingual municipal-benefits assistant is entering production. Content is republished weekly, and residents may appeal answers. The pilot reports only uptime and average latency. Which TWO additions create an actionable SLA and feedback loop? Select TWO.",
  ["A","言語別の月次満足度目標を設定し、未達時に製品担当者がコメントを確認して、プロンプト変更の結果を四半期ごとに公表する。","Set monthly satisfaction targets by language, ask product staff to review comments after a miss, and publish a quarterly summary of resulting prompt changes.","誤り。言語別満足度とコメント確認は有用ですが、回答・引用品質、鮮度、裾の遅延を直接測らず、原因が検索や翻訳でもプロンプト変更に寄せています。"],
  ["B","言語別の回答・引用品質の下限、p95レイテンシ目標、公開から索引反映までの最大鮮度遅延を定義する。","Define language-segmented answer and citation quality floors, a p95 latency objective, and a maximum publication-to-index freshness delay for each supported language.","正しい。利用者品質、裾の応答時間、週次更新という主要なサービス特性を測定可能な閾値へ変換しています。"],
  ["C","異議申立てを検索、生成、翻訳、情報鮮度の原因別に分類し、責任者を割り当て、確認済み事例を回帰試験へ追加する。","Classify appeals by retrieval, generation, translation, and source-freshness cause, assign owners, and feed confirmed cases into regression tests by supported language.","正しい。本番フィードバックを原因・責任・再発防止テストへ結び付けるため、継続改善可能な閉ループになります。"],
  ["D","言語別モデル品質スコアを四半期ごとに公表し、未達時はプロンプトを全面改訂して、個別の障害責任者を置く前に次四半期と比較する。","Publish a quarterly model-quality score by language, schedule a full prompt rewrite below target, and compare the next quarter before assigning separate incident owners.","誤り。言語別集計でも四半期単位では対応が遅く、原因分類や責任者割当てより先に全面改訂するため、検索・鮮度・翻訳の問題へ誤った層と順序で対処します。"],
  ["B","C"]],
[28,6,1,"Production handoff and lifecycle ownership","物流予測コパイロットをベンダーチームから顧客の基盤グループへ移管します。サービスは版管理されたプロンプト、索引再構築ジョブ、フォールバック規則、人間へのエスカレーションキューを使用しています。安全な運用と改善を維持しやすい引継ぎはどれですか。","A logistics forecasting copilot is moving from a vendor team to the customer's platform group. The service uses versioned prompts, an index rebuild job, fallback rules, and a human escalation queue. What handoff is MOST likely to preserve safe operation and improvement?",
  ["A","版管理された構成・評価基準・運用復旧手順・ダッシュボード・責任者を引き継ぎ、共同リハーサルを行う。","Transfer versioned architecture and configuration, evaluation baselines, runbooks and rollback steps, dashboards, access ownership, and a joint rehearsal with named owners.","正しい。成果物だけでなく、判断基準、復旧手順、アクセス、責任者、実地確認まで移すため、運用と改善の継続性を確保できます。"],
  ["B","リポジトリ、展開マニフェスト、録画デモを渡す一方、索引再構築、プロンプト公開、緊急ロールバック権限は6か月間ベンダー側に残す。","Transfer the repository, deployment manifest, and a recorded demonstration, while retaining index rebuilds, prompt releases, and emergency rollback authority with the vendor for six months.","誤り。成果物と暫定支援は役立ちますが、索引・プロンプト・復旧の所有権をベンダーに残すと、顧客が安全な運用と改善判断を完結できません。"],
  ["C","最終アーキテクチャ図と現行SLAを渡し、顧客には本番障害を観察した後で独自の運用手順を作ってもらう。","Provide the final architecture diagram and current SLA, then have the customer create its own runbooks after observing production incidents.","誤り。障害後に手順を整える順序では、安全な復旧、ロールバック、エスカレーションが未準備のまま本番責任を負わせます。"],
  ["D","運用認証情報を共有緊急アカウントに保持し、両チームに非公式チャットで変更を調整してもらう。","Keep operational credentials in a shared emergency account and ask both teams to coordinate changes through an informal chat channel.","誤り。共有資格情報と非公式変更管理は責任追跡、最小権限、監査可能性を弱め、移管後の所有権も曖昧にします。"],
  ["A"]],
[29,7,1,"Claude Code team configuration and shared development context","ある会社が多数のリポジトリへClaude Codeを展開します。セキュリティ上、本番認証情報へアクセスするシェルコマンドを全開発者で禁止する必要があり、各リポジトリには固有のテストコマンドとアーキテクチャ規約が必要です。最適な構成はどれですか。","A company is rolling out Claude Code across many repositories. Security requires that shell commands accessing production credentials be blocked for every developer, while each repository needs its own test commands and architecture conventions. Which configuration is BEST?",
  ["A","コマンド禁止、承認済みシェル例、リポジトリ規約を各プロジェクトのCLAUDE.mdに置き、プルリクエスト承認とコマンドログ監査を必須にする。","Put the command prohibition, approved shell examples, and repository conventions in each project's CLAUDE.md, require pull-request review, and audit violations from command logs.","誤り。レビューとログ監査を加えても、CLAUDE.mdはモデルへの共有指示であり、全開発者に対する決定論的なコマンド拒否を中央で強制できません。"],
  ["B","コマンド拒否を中央管理設定で強制し、版管理されたテスト・アーキテクチャ指針は各リポジトリのCLAUDE.mdまたはrulesに置く。","Enforce the command denial in centrally managed settings, and keep versioned test and architecture guidance in each repository's CLAUDE.md or rules.","正しい。組織共通の強制統制と、チーム共有のプロジェクト文脈を適切なスコープと層へ分離しています。"],
  ["C","すべての指示を各開発者のユーザーレベルCLAUDE.mdに保存し、リポジトリ作成時にテンプレートを配布する。","Store all instructions in each developer's user-level CLAUDE.md and distribute a template when a repository is created.","誤り。個人スコープでは組織統制の強制とリポジトリ別の一貫した版管理が難しく、時間とともに構成が分岐します。"],
  ["D","禁止、テスト、アーキテクチャを1つの組織共通CLAUDE.mdに置き、競合回避のためリポジトリ単位の指示を廃止する。","Use one organization-wide CLAUDE.md for prohibitions, tests, and architecture, and remove repository-level instructions to avoid conflicts.","誤り。共通指示には適しますが、リポジトリ固有のコマンドと設計文脈まで中央へ集約すると保守性と関連性が下がります。"],
  ["B"]],
[30,7,2,"Claude Code debugging and operational enablement","データベース書込みを止める共有Claude Code PreToolUseフックがあります。更新後、Windowsでは読取り専用コマンドも遮断しますがLinuxでは正常で、一部ユーザーは特定worktreeでフック自体が読み込まれないと報告しています。支援チームが最初に行うべき対応を2つ選択してください。","A shared Claude Code PreToolUse hook blocks database writes. After an update, it blocks read-only commands on Windows but behaves correctly on Linux; some users also report that the hook is not loaded from certain worktrees. Which TWO actions should the enablement team take first? Select TWO.",
  ["A","Windows利用者には一時的にフックを回避させ、読取り専用DBアカウントに制限し、全コマンド試行を中央記録して次回定期リリース後に復旧する。","Let Windows users bypass the hook temporarily, restrict them to read-only database accounts, log all attempted commands centrally, and restore the hook after the next routine release.","誤り。読取り専用権限と監査は有効な防御層ですが、共有統制の回避を継続し、未読込みやOS別誤判定の根本原因を先に切り分けない順序です。"],
  ["B","フックを詳細なCLAUDE.md警告へ置き換え、各シェルの承認済みコマンド例を追加し、指示を無視した書込みがないかDB監査ログを毎週確認する。","Replace the hook with detailed CLAUDE.md warnings, add approved command examples for each shell, and review database audit logs weekly for writes that ignored the guidance.","誤り。例示と監査は補助策ですが、決定論的な実行前遮断をモデル指示と事後検知へ弱めるため、書込みを止める統制要件を満たしません。"],
  ["C","Claude Codeの構成診断とフック入力ログを使い、失敗例と正常例で読み込まれた設定ソース、matcher選択、ペイロードを比較する。","Use Claude Code configuration diagnostics and hook input logs to compare loaded setting sources, matcher selection, and payloads in failing and working cases.","正しい。未読込みと誤判定を推測せず、スコープ・設定解決・実入力のどこで差が生じるかを切り分けられます。"],
  ["D","読取り・書込みコマンドのクロスプラットフォームfixtureを追加し、必要に応じOS別の明示的シェル実装を使い、ロールバック手順付きで修正版を段階導入する。","Add cross-platform fixtures for read/write commands, use an explicit shell implementation per OS where needed, and stage the fixed hook with rollback guidance.","正しい。再現試験で誤検知を防ぎ、OS差を明示し、安全な段階展開と復旧を可能にする運用改善です。"],
  ["C","D"]],
[31,1,1,"Translate business problems into Claude-based AI solutions","買収チームは一度に1件、350ページの契約書束を審査します。各束は選択モデルのコンテキストに十分収まり、離れた条項の比較質問が多く、審査者は正確な箇所への組込み引用を必要とします。件数は少なく、1リクエスト費用より検索漏れの最小化を重視します。最適な初期設計はどれですか。","An acquisition team reviews one 350-page contract bundle at a time. Each bundle fits comfortably in the chosen model's context window, questions often compare distant clauses, and reviewers require built-in citations to exact passages. Volume is low, and minimizing retrieval omissions matters more than per-request cost. Which initial design is BEST?",
  ["A","契約書束全体を引用可能な文書として渡し、送信前にトークンを数え、RAG追加前に条項横断の再現率を評価する。","Provide the complete bundle as citable document content, count tokens before submission, and evaluate cross-clause recall before adding retrieval.","正しい。資料が収まり低件数で検索漏れを重視するため、まず長文コンテキストと組込み引用を使う最小構成が適合します。トークン計数で余白も確認できます。"],
  ["B","固定長チャンクのベクトル検索だけでRAGを構築し、定数件を取得して費用を予測可能にし、条項横断の漏れが報告された後で再ランキングを追加する。","Build vector-only RAG with fixed-size chunks, retrieve a constant number of passages for predictable cost, and add a reranker only after reviewers report missed cross-clause comparisons.","誤り。費用予測と段階導入には利点がありますが、明示的に検索漏れを最小化したい状況で、既知の条項横断リスクを本番報告後まで残す順序が不適切です。"],
  ["C","過去契約でモデルを微調整し、現行の束を渡さずプレーンテキストで節番号を出させる。","Fine-tune a model on prior contracts and request section numbers in plain text instead of passing the current bundle.","誤り。案件固有の現行契約を学習済み知識へ置換できず、組込み引用の検証可能性も失います。"],
  ["D","比較に十分な証拠が集まったと判断するまで各ページを反復検索するエージェントを作る。","Create an agent that searches each page iteratively until it decides enough evidence has been collected for the comparison.","誤り。実現可能ですが、固定資料が収まる状況では検索停止判断とツールループを追加する過剰設計で、漏れを減らす保証もありません。"],
  ["A"]],
[32,1,2,"Design end-to-end architectures","あるメディア基盤はClaudeで2つの機能を必要とします。受信クリップのタグ付けはラベル精度97%以上かつp95 700ms以内、編集リスク概要は専門家受入率94%以上かつp95 12秒以内です。明示要件を最も満たすアーキテクチャ判断を2つ選択してください。","A media platform needs two Claude capabilities: tag incoming clips within p95 700 ms at at least 97% label accuracy, and produce editorial risk briefs within p95 12 seconds with at least 94% expert acceptance. Which TWO architecture decisions BEST satisfy the stated requirements? Select TWO.",
  ["A","両タスクに最高能力モデルを使い、合算平均遅延が6秒になるまで同時実行数を調整し、本番トラフィック安定後にタスク別p95を確認する。","Use the highest-capability model for both tasks, tune concurrency until combined average latency reaches six seconds, and review per-task p95 results after production traffic stabilizes.","誤り。統一モデルと同時実行調整は運用を単純化しますが、合算平均は各タスクのp95を保証せず、明示閾値の検証を本番後へ回す順序も不適切です。"],
  ["B","タスク別にモデルを評価し、タグ付けは97%を満たす最速モデルへ、概要は両方の概要閾値を満たす中で最小費用のモデルへ振り分ける。","Evaluate models separately per task and route tagging to the fastest model meeting 97%, while assigning briefs to the least costly model meeting both brief thresholds.","正しい。能力を一律に選ばず、各タスクの品質・裾遅延条件を制約として満たした上で速度または費用を最適化しています。"],
  ["C","全クリップを1つのエージェント優先キューへ送り、項目ごとにタグ付けか概要かを選ばせ、合算キュー遅延が6秒を超えたらworkerを追加する。","Send all clips through one agentic priority queue, let it choose tagging or a risk brief per item, and add more workers whenever combined queue latency exceeds six seconds.","誤り。必要な2機能と個別閾値は既知であり、モデルによる経路選択と合算遅延基準はタスク別の品質・p95要件を曖昧にします。"],
  ["D","入力、モデル、検証、キューの各段階を個別計測し、タスク別時間予算を強制し、閾値未達を定義済みフォールバックまたはレビュー経路へ送る。","Instrument input, model, validation, and queue stages separately, enforce per-task time budgets, and route threshold failures to defined fallback or review paths.","正しい。エンドツーエンド閾値を各処理段階と障害時経路へ落とし込み、品質とレイテンシの両方を運用可能にします。"],
  ["B","D"]],
[33,1,1,"Select appropriate architectural patterns (workflow, agentic, augmented LLM)","エネルギー規制当局は月次届出要約を既知の順序で作成します。所定表の解析、監査済みコードによる比率計算、固定閾値との比較、例外の分析担当承認、説明文の作成です。最も適切なアーキテクチャはどれですか。","An energy regulator produces a monthly filing summary through a known sequence: parse prescribed tables, calculate ratios with audited code, compare values to fixed thresholds, obtain analyst approval for exceptions, and draft narrative text. Which architecture is MOST appropriate?",
  ["A","各届出の見かけ上の複雑さから計算ツール、閾値確認、承認時期を選ぶ自律エージェントを使い、その判断を後日の監査用に記録する。","Use an autonomous agent that chooses calculation tools, threshold checks, and approval timing from each filing's apparent complexity, while logging its decisions for later audit review.","誤り。判断ログは監査に役立ちますが、順序・計算・承認条件が既知なのに経路をモデル判断へ委ね、必要な決定論的統制を事後説明へ置き換えています。"],
  ["B","解析、コード計算、閾値、承認を決定論的ワークフローにし、Claudeは抽出支援と説明文作成に限定する。","Use a deterministic workflow for parsing, code-based calculations, thresholds, and approvals, with Claude limited to extraction assistance and narrative drafting.","正しい。固定された監査可能な処理と承認をコードで強制し、非構造入力・文章生成にClaudeを使う適切な責務分離です。"],
  ["C","過去届出をRAG検索し、最も近い例から想定処理順序をClaudeに推論させる。","Use RAG over prior filings and ask Claude to infer the expected processing order from the closest historical examples.","誤り。過去例は補助情報になっても、現在の規定順序、固定計算、承認ゲートを推論へ置き換えるべきではありません。"],
  ["D","表ごとに専門エージェントを使い、合議投票で比率、例外、最終文面を決める。","Use specialist agents for every table and let a consensus vote determine ratios, exceptions, and final wording.","誤り。並列抽出には使えても、監査済み計算をモデル投票へ置き換え、単純な固定工程に過剰な調整を導入します。"],
  ["B"]],
[34,1,1,"Design multi-agent systems and orchestration strategies","災害復旧計画システムは、施設、ネットワーク依存関係、供給能力の別エージェントを使います。分析は並列実行できますが、3者は共有資産を異なる名称で参照し、最終計画ではすべての阻害依存が解消する前に復旧を予定してはなりません。最適なオーケストレーション設計はどれですか。","A disaster-recovery planner uses separate agents for facilities, network dependencies, and supplier capacity. Their analyses may run in parallel, but all three cite shared assets with different naming conventions, and the final plan must not schedule restoration before every blocking dependency is cleared. What is the BEST orchestration design?",
  ["A","共有の資産スキーマと状態語彙を要求し、中央オーケストレーターが統合前に識別子対応と依存制約を検証する。","Require a shared asset schema and status vocabulary, then have a central orchestrator validate identity mapping and dependency constraints before synthesis.","正しい。並列専門分析を保ちながら、共通契約と決定論的検証で名称差と阻害依存を解消してから最終計画を生成できます。"],
  ["B","各専門エージェントにローカル資産名で完全計画を書かせ、最も説得力ある案を高能力モデルに選ばせ、2者が争った依存関係だけを手動確認する。","Let every specialist write a complete plan using local asset names, ask the strongest model to select the most persuasive plan, and manually review only dependencies disputed by two agents.","誤り。競合時の確認はあっても、同一資産の名称を正規化せず一案を選ぶため、表面上は争われない他領域の阻害依存を見落とします。"],
  ["C","エージェントを固定順に直列化し、各完全トランスクリプトを次のプロンプトへ追加して後続が競合を解消する。","Serialize the agents in a fixed order and append each full transcript to the next agent's prompt so later agents can resolve conflicts.","誤り。情報共有はできますが並列性を失い、長い非構造文脈に依存します。共有スキーマと最終制約検証の方が確実です。"],
  ["D","各専門家にローカル資産識別子を許し、全出力で同一文字列ラベルを持つ活動だけを照合する。","Allow each specialist to use local asset identifiers and reconcile only the activities that have identical text labels in all outputs.","誤り。異なる命名規則が明示されているため、文字列一致では同一資産を結合できず、依存関係が欠落します。"],
  ["A"]],
[35,1,2,"Apply decomposition techniques for complex problem solving","出版社が大規模カタログをアクセシブルなデジタル版へ変換します。OCR、画像説明、メタデータ整備はタイトル単位で独立実行できますが、最終公開では巻をまたぐ参照を維持し、共通のアクセシビリティ検査表を通過する必要があります。最適な分解を2つ選択してください。","A publisher must convert a large catalog into accessible digital editions. OCR, image descriptions, and metadata cleanup can proceed independently by title, but a final release must preserve cross-volume references and pass one accessibility checklist. Which TWO decomposition choices are BEST? Select TWO.",
  ["A","タイトルごとに安定識別子を付け、本文、画像、メタデータ、未解決参照の明示的な出力契約で作業を分割する。","Partition work by title with stable identifiers and explicit output contracts for text, images, metadata, and unresolved references.","正しい。独立処理を可能にしつつ、後段で成果を結合・検証するための境界と追跡情報を保持します。"],
  ["B","処理技術別に分割し、各チームが保存規約に合わせてタイトルを改名し、全技術バッチ完了後に巻間参照だけを照合する。","Partition by processing technology, let each team rename titles to its storage convention, and reconcile cross-volume references only when all technical batches are complete.","誤り。技術別並列化と最終照合は可能でも、安定識別子なしの改名で成果物の結合と参照追跡が難しくなり、共通アクセシビリティ検査も欠けます。"],
  ["C","巻間リンクを解決し、組み立て済み版に共通アクセシビリティ検査を適用する最終統合段階を設ける。","Add a final integration stage that resolves cross-volume links and applies the shared accessibility checks to assembled editions.","正しい。局所処理では保証できないカタログ横断制約と共通品質ゲートを、全体を見られる段階で検証します。"],
  ["D","各タイトル担当が自身のアクセシビリティ検査を承認して完成分を即時公開し、全変換完了後にカタログ全体のリンク走査を行う。","Have each title worker approve its own accessibility checklist, release completed titles immediately, and run a catalog-wide link scan after the full conversion finishes.","誤り。局所チェックと後日の走査は処理量を上げますが、巻間参照と共通品質ゲートを公開前に保証するという明示要件に反します。"],
  ["A","C"]],
[36,1,1,"Align solutions to business value pillars","フィールドサービス組織が、設備報告書を下書きするClaudeアシスタントを提案しています。経営陣は完了時間短縮を期待しますが、技術者は既に音声テンプレートを使っており、修正時間、手戻り、報告受入率、モバイル遅延は未計測です。全車両展開前に何を推奨すべきですか。","A field-service organization proposes a Claude assistant that drafts equipment reports. Leaders expect faster closeout, but technicians already use speech templates and no one has measured correction time, rework, report acceptance, or mobile latency. What should the architect recommend before a fleet-wide rollout?",
  ["A","全技術者へ展開し、前年の月次報告件数との比較を主要価値指標にする。","Roll out to all technicians and compare monthly report volume with the prior year as the primary value measure.","誤り。件数差は需要変動を含み、既存音声テンプレートに対する時間・品質・費用の増分効果を分離できません。"],
  ["B","最安モデルを選び、推論費用が減れば事業価値が正になると仮定する。","Select the least expensive model and assume any reduction in inference cost produces a positive business case.","誤り。費用は価値の一部に過ぎず、品質低下による修正や手戻り、現場遅延を測らなければ純効果を判断できません。"],
  ["C","1地域で音声テンプレートを置き換え、技術者満足度で残りの展開を判定し、定着後に修正時間、手戻り、モバイル遅延を測定する。","Replace speech templates in one region, gate the remaining rollout on technician satisfaction, and measure correction time, rework, and mobile latency only after adoption is established.","誤り。小規模試行と利用者満足度は有用ですが、効率・品質・性能を拡大判断の後に測る順序では、既存手段に対する増分価値を確認できません。"],
  ["D","現行を基準測定して対照付き試行を行い、修正時間、受入率、手戻り、p95遅延、総費用で拡大を判定する。","Baseline the current workflow, run a controlled pilot against it, and gate scale on correction time, acceptance, rework, p95 mobile latency, and total cost.","正しい。既存手段に対する効率・品質・性能・費用の増分価値を測り、明確な拡大判断へ結び付けます。"],
  ["D"]],
[37,2,1,"Design system prompts, templates, and guardrails","税関受付サービスは、`route`を`AUTO_CLEAR`、`OFFICER_REVIEW`、`REJECTED_INPUT`のいずれかに限定し、管理されたカタログの理由コードを付けたJSONを出力する必要があります。下流コードは余分なフィールドを拒否します。契約を最も強く保証する設計はどれですか。","A customs intake service must emit JSON with `route` limited to `AUTO_CLEAR`, `OFFICER_REVIEW`, or `REJECTED_INPUT`, plus a reason code from a maintained catalog. Downstream code rejects extra fields. Which design BEST enforces the contract?",
  ["A","enum、必須項目、余分なプロパティ禁止を含むJSON Schemaで構造化出力を使い、業務認可は別途検証する。","Use structured outputs with a JSON Schema containing enum values, required fields, and `additionalProperties: false`, then validate business authorization separately.","正しい。制約付きデコードで構文・許可値・余分な項目を保証しつつ、出力形式では担保できない業務認可を別層に残します。"],
  ["B","システムプロンプトで3経路と理由カタログを説明し、JSONのみを要求し、不正オブジェクトは強い警告で再試行して、残る余分な項目を下流で拒否する。","Describe the three routes and reason catalog in the system prompt, request JSON-only output, retry invalid objects with a stronger warning, and reject any remaining extra fields downstream.","誤り。再試行と下流拒否は防御になりますが、許可値や余分な項目を生成時に制約せず、回避可能な失敗を下流へ流すためSchemaによる強制より弱い設計です。"],
  ["C","説明に経路一覧を記載したツールを定義し、カタログ更新を簡単にするため入力スキーマは自由文字列にする。","Define a tool whose description lists the routes, but leave the input schema as free-form strings to simplify catalog updates.","誤り。説明はモデル選択を助けても自由文字列では許可値を強制できず、明示された契約要件に届きません。"],
  ["D","第2モデルに経路名の正規化と未知フィールド削除を行わせてから下流へ送る。","Ask a second model to normalize route names and remove unknown fields before sending the object downstream.","誤り。補正段階を追加しても同じ非決定性を重ねます。JSON Schemaで直接制約し、業務検証をコードで行う方が単純で強固です。"],
  ["A"]],
[38,2,1,"Apply prompt engineering techniques (zero-shot, few-shot, chain-of-thought)","博物館アシスタントは来館者の質問を8つのツアー意図へ分類します。ゼロショット指示は6意図で機能しますが、`ACCESSIBILITY_ROUTE`と`LOW_WALKING_ROUTE`を繰り返し混同し、学芸員には違いを示すレビュー済み例があります。次のプロンプト変更として最適なのはどれですか。","A museum assistant maps visitor questions to one of eight tour intents. Zero-shot instructions work for six intents, but repeatedly confuse `ACCESSIBILITY_ROUTE` with `LOW_WALKING_ROUTE`; curators have several reviewed examples that expose the distinction. What is the BEST next prompt change?",
  ["A","8意図すべての一般定義を拡張し、よくある来館者表現の確認表を追加して、各クラスを均等に扱うためレビュー済み例は除く。","Expand the generic definitions for all eight intents, add a checklist of common visitor phrases, and remove reviewed examples so every class remains equally represented in the prompt.","誤り。全クラスの一般説明は均一ですが、失敗が特定境界に集中し、その違いを示す良質な例があるため、境界例を除くと低信号な文脈だけが増えます。"],
  ["B","混同する組について、実運用と同じラベル・出力形式を使った均衡の取れた少数の境界例を追加する。","Add a small set of balanced boundary examples for the confused pair, with the same labels and output format used in production.","正しい。観測された識別境界を直接示すfew-shot例により、他の6意図を不要に変更せず分類規則を具体化できます。"],
  ["C","各ラベルの前に詳細な思考過程を要求し、説明の長さで正しさを評価する。","Request a detailed chain-of-thought explanation before every label and score correctness from the explanation length.","誤り。説明量は分類正確性の代理にならず、レイテンシとトークンを増やします。境界例の方が既知の失敗へ直接的です。"],
  ["D","2つの意図を1つの統合ラベルへ送り、分類後に毎回スタッフが分離する。","Route both intents to one combined label and ask staff to separate them manually after every classification.","誤り。暫定フォールバックとしては可能ですが、利用可能なレビュー済み例を使った改善を試さず、継続的な手作業を導入します。"],
  ["B"]],
[39,2,2,"Implement prompt reuse strategies (caching, modular prompts, Skills)","あるコンサル組織は、多数のClaude Codeプロジェクトで使うレビュー済みデューデリジェンス手法を管理しています。手法は毎月更新され、各プロジェクトは顧客固有コマンドを追加し、セッションでは同じ長い参照資料を繰り返し読み込みます。統制された再利用と効率的な文脈利用を最も支える方法を2つ選択してください。","A consulting organization maintains a reviewed due-diligence method used by many Claude Code projects. The method changes monthly; each project adds client-specific commands, and sessions repeatedly load the same long reference material. Which TWO practices BEST support governed reuse and efficient context use? Select TWO.",
  ["A","完全な手法と参照付録を各プロジェクトのCLAUDE.mdへコピーし、月次改訂番号を固定して、中央更新は各チームの通常リリース時に取り込む。","Copy the complete method and reference appendix into every project's CLAUDE.md, pin a monthly revision number, and let teams merge central updates during their normal release cycle.","誤り。改訂番号で追跡できても、複製により更新時期と内容が分岐し、長い資料を必要性に関係なく各セッションへ読み込ませます。"],
  ["B","手法とキャッシュ済み参照を含む共有会話を1つ維持し、各プロジェクトの顧客コマンドを追記させ、月次改訂ごとに会話をアーカイブする。","Maintain one shared conversation transcript containing the method and cached references, require projects to append client commands there, and archive the transcript after each monthly revision.","誤り。月次アーカイブをしても変更管理とプロジェクト分離が弱く、増え続ける会話に無関係な文脈や顧客固有情報が混在します。"],
  ["C","レビュー済み手法を版管理された共有Skillとして配布し、顧客固有コマンドと制約はプロジェクトスコープ設定に置く。","Package the reviewed method as a versioned shared Skill with explicit change ownership, while keeping client-specific commands and constraints in project-scoped configuration.","正しい。再利用可能な標準手順と局所文脈を分離し、中央更新、版追跡、適切なスコープを両立します。"],
  ["D","安定した共有参照ブロックを可変プロジェクト入力より前に置いてプロンプトキャッシュを使い、更新後のcache-read利用と無効化を監視する。","Place stable shared reference blocks before variable project input and use prompt caching, monitoring cache-read usage and invalidation after updates across representative workloads.","正しい。繰り返す静的prefixを再利用し、更新時のキャッシュ変化も観測するため、内容を削らず費用と処理時間を改善できます。"],
  ["C","D"]],
[40,2,1,"Optimise context windows and manage token usage","医薬品安全性アシスタントは検索した報告から引用付き症例概要を作ります。現在のリクエストはしばしばコンテキスト上限へ近づき、重複定型文35%、検索証拠45%、指示とスキーマ10%を消費し、概要と引用ブロックの出力余地が不足します。最適な再設計はどれですか。","A pharmacovigilance assistant prepares a cited case brief from retrieved reports. The current request often approaches the context limit: duplicated boilerplate consumes 35%, retrieved evidence 45%, instructions and schemas 10%, leaving too little output space for the brief and citation blocks. Which redesign is BEST?",
  ["A","入力を変えず`max_tokens`を下げ、APIがコンテキスト上限を超えないようにする。","Keep all input unchanged and lower `max_tokens` so the API never exceeds the context window.","誤り。要求自体は収まっても、既に不足している本文と引用の出力予算をさらに削り、切れた回答を増やします。"],
  ["B","報告識別子と引用箇所を削除して題名と日付だけを残し、概要生成後に第2モデルへ引用文を再構成させて入力トークンを節約する。","Remove report identifiers and cited passages, retain only report titles and dates, then ask a second model to reconstruct citation text after the brief has been generated.","誤り。入力は縮小できますが、証拠との対応と引用対象本文を失い、第2モデルによる後付け推測へ置き換えるため、検証可能な引用要件を損ないます。"],
  ["C","定型文を重複排除し、症例関連証拠を再ランキングし、引用境界を保ち、トークンを数えて出力余地を確保する。","Deduplicate boilerplate, rerank case-relevant evidence, preserve citable source boundaries, count tokens, and reserve output space for the final brief.","正しい。低価値の重複と検索ノイズを削りつつ出典単位を保持し、入力と出力を事前計測して引用付き概要の余白を確保します。"],
  ["D","リクエスト前に全報告を1つの引用なし段落へ要約し、最終モデルにはその段落だけを渡す。","Summarize every report into one uncited paragraph before the request and provide only that paragraph to the final model.","誤り。大幅に圧縮できますが、症例ごとの根拠境界と引用対象テキストを失うため、引用要件を満たせません。"],
  ["C"]],
[41,3,1,"Design a RAG pipeline with appropriate chunking and indexing strategies","博物館アーカイブの再索引後、RAGアシスタントが新規展示の日付を誤答します。失敗質問では期待箇所がtop-20検索結果に含まれず、技術者がその箇所を手動でプロンプトへ入れるとClaudeは正しい引用付きで回答します。チームが最初に行うべきことはどれですか。","After a museum archive re-index, its RAG assistant gives incorrect dates for newly added exhibits. For failed questions, the expected passage is absent from top-20 retrieval; when engineers manually insert that passage into the prompt, Claude answers correctly with the right citation. What should the team do FIRST?",
  ["A","日付の正確性を強調するよう回答生成プロンプトを書き換え、モデルの出力トークン予算を増やす。","Rewrite the answer-generation prompt to emphasize date accuracy and increase the model's output-token budget.","誤り。正しい箇所を渡すと生成は成功しており、出力予算も原因ではありません。生成層の変更は観測証拠と合いません。"],
  ["B","すべてのリクエストを最高能力モデルへ切り替え、他の箇所から欠落日付を推論できるか比較する。","Switch every request to the highest-capability model and compare whether it can infer the missing dates from other passages.","誤り。必要な根拠が検索されていない問題を推論能力で補うと、費用を増やしつつ根拠のない回答を助長します。"],
  ["C","日付精度を批評する第2生成パスへ同じtop-20箇所を渡し、不一致は審査者へ回す一方、取込みと検索設定は変更しない。","Add a second generation pass that critiques date accuracy, provide it the same top-20 passages, and escalate disagreements to a reviewer while leaving ingestion and retrieval unchanged.","誤り。批評と人間確認は誤答検知に使えますが、両モデルに期待箇所が渡らないため既知の検索失敗を解消せず、不要な遅延と作業を追加します。"],
  ["D","生成を変更する前に、新規展示の取込み網羅性、メタデータフィルター、チャンク境界、埋め込み版整合性、検索再現率を調査する。","Inspect ingestion coverage, metadata filters, chunk boundaries, embedding/version consistency, and retrieval recall for the new exhibits before changing generation.","正しい。手動で根拠を与えると生成が成功し、top-20に根拠がないため、最初に検索・索引工程を切り分けるべきです。"],
  ["D"]],
[42,3,2,"Apply retrieval strategies matched to data shape and query pattern","サービスデスク支援は8万件の短いランブックを検索します。`E7-19-F`のような正確なエラー署名を見つける必要がある一方、症状説明はランブックと異なる語彙を使います。コーパス全体をClaudeへ送らずに両方の検索パターンへ対処する変更を2つ選択してください。","A service-desk assistant searches 80,000 short runbooks. Exact error signatures such as `E7-19-F` must be found, while symptom descriptions use vocabulary different from the runbooks. Which TWO retrieval changes best address both query patterns without sending the whole corpus to Claude? Select TWO.",
  ["A","字句検索と埋め込み検索を併用し、統合候補を再ランキングする。","Combine lexical and embedding retrieval, then rerank the merged candidates.","正しい。字句検索が希少な署名を、埋め込み検索が語彙差のある意味的対応を補い、再ランキングで統合候補を絞れます。"],
  ["B","チャンク内のエラーコードと見出しを保持し、製品・版のメタデータフィルターを付ける。","Preserve error codes and headings in chunks and attach product/version metadata filters.","正しい。識別子を分断せず保持し、明示的な製品・版で候補集合を制約するため、検索精度とコンテキスト効率が上がります。"],
  ["C","全製品系列が現れるまで埋め込み検索のtop-kを増やし、無関係な候補はClaudeに除外させる。","Increase embedding top-k until every product family appears, then let Claude discard irrelevant candidates.","誤り。製品横断の網羅性には使えますが、正確な署名の字句一致を保証せず、候補選別とコンテキスト消費を増やします。"],
  ["D","全ランブックの要約を事前生成してシステムプロンプトへ置き、詳細な付録だけを検索する。","Precompute summaries for every runbook, place them in the system prompt, and retrieve only detailed appendices.","誤り。要約の事前生成は可能でも、8万件を常時コンテキストへ入れるため予算制約に反し、正確な署名も失われ得ます。"],
  ["A","B"]],
[43,3,1,"Apply retrieval strategies matched to data shape and query pattern","法務支援が、指定された3契約の保存条項を比較します。単一の広い検索では最長の契約から多数の文章が返り、別の契約が欠落しがちです。最適な検索計画はどれですか。","A legal assistant must compare retention clauses across three named contracts. A single broad search often returns many passages from the longest contract and none from another. What is the best retrieval plan?",
  ["A","契約ごと・条項種別ごとに絞って検索し、ラベル付き証拠集合をClaudeへ渡して比較させる。","Run a scoped retrieval for each contract and clause type, then give Claude the labeled evidence set for comparison.","正しい。各対象から証拠を確保してから生成へ渡すため、長い契約による候補独占を防ぎ、比較の対応関係も明確です。"],
  ["B","全体top-kを増やし、返却後に文章を契約別に分類して、欠けた契約をClaudeに特定させる。","Raise global top-k, group returned passages by contract afterward, and ask Claude to identify any missing contract.","誤り。事後分類は整理に役立ちますが、最長契約による候補独占を防げず、欠けた契約の証拠を生成できません。"],
  ["C","各契約全文を別々に要約し、条項種別のラベルを付け、以後の比較ではその要約だけを再利用する。","Summarize each complete contract separately, label the summaries by clause type, and reuse only those summaries for comparisons.","誤り。契約別の被覆は確保できますが、質問固有の条項や例外を要約時に失い、根拠箇所を再検索できません。"],
  ["D","各契約を文書単位の1ベクトルにし、各契約から比較項目が1件ずつ出るよう3件の結果を要求する。","Embed each contract as one document-level vector and request three results so each contract can contribute one comparison item.","誤り。文書単位の埋め込みは局所条項を薄め、結果数を3件にしても各契約が1件ずつ返る保証はありません。"],
  ["A"]],
[44,3,1,"Evaluate connection protocols and select the appropriate integration mechanism (MCP, API/CLI, agent-to-agent)","夜間の税率取込処理は、管理されたバッチジョブから版管理済みの政府エンドポイントを1つ呼びます。インターフェースは安定し、モデルが操作を選ぶことはなく、配備方針は常駐統合サーバーを禁止します。最も適合する仕組みはどれですか。","A nightly tax-rate loader calls one versioned government endpoint from a controlled batch job. The interface is stable, no model chooses operations, and deployment policy prohibits a long-lived integration server. Which mechanism best fits?",
  ["A","エンドポイントを発見可能なMCPサーバーで包み、夜間実行のたびに使える常駐統合プロセスとして運用する。","Wrap the endpoint in a discoverable MCP server and keep that integration process available for every nightly run.","誤り。MCPの発見性は複数操作をモデルが選ぶ場合に有用ですが、この固定バッチには不要な常駐層で、配備制約にも反します。"],
  ["B","バッチジョブから文書化されたAPIを直接呼び、上限付き再試行と冪等な保存を行う。","Call the documented API directly from the batch job with bounded retries and idempotent persistence.","正しい。固定された単一操作には直接APIが最小の統合面であり、再試行と冪等性が夜間処理の運用要件を満たします。"],
  ["C","各取込を別エージェントへ委任し、実行時にエンドポイント版、出力形式、再試行動作を交渉させる。","Delegate each load to a separate agent that negotiates the endpoint version, output format, and retry behavior at runtime.","誤り。動的な交渉が必要な連携には適しますが、安定した単一APIの決定的処理へ不確実性と障害点を加えます。"],
  ["D","権限を制限した定期シェルコマンドをClaudeへ公開し、モデルに毎晩ローダーを起動させる。","Expose a scheduled shell command to Claude, restrict its permissions, and have the model launch the loader nightly.","誤り。権限制限は有用でも、モデル判断を不要なスケジュール処理へ導入し、直接APIより再現性を悪化させます。"],
  ["B"]],
[45,3,2,"Analyse authentication and authorisation requirements to identify security gaps","MCPサーバーは分析担当者に承認済みデータセットの読取とエクスポート申請を提供します。任意の社内アクセストークンを受け入れ、同じトークンをオブジェクトストレージへ転送し、署名済み利用者を確認せず`owner`引数で出力先を決めます。最初に修正すべきセキュリティ上の欠陥を2つ選択してください。","An MCP server lets analysts read approved datasets and request exports. It accepts any corporate access token, forwards that same token to object storage, and an `owner` argument determines the export folder without checking the signed-in analyst. Which TWO security gaps should be fixed first? Select TWO.",
  ["A","受信トークンがMCPサーバー向けのaudienceを持つことを検証し、下流には別の資格情報を使う。","Validate that the inbound token is audience-bound to the MCP server and use a separate downstream credential.","正しい。MCPサーバーは自分向けのトークンだけを受け入れ、下流へトークンをそのまま渡さないことで信頼境界を保つ必要があります。"],
  ["B","認可遅延を減らすため、audienceと利用者別の成功したトークン検査結果を長期間キャッシュする。","Cache successful token introspection by audience and user for longer periods to reduce authorization latency on repeated exports.","誤り。適切なaudience検証後の性能策にはなりますが、現状の不検証とトークン転送を修正せず、失効反映も遅らせます。"],
  ["C","`owner`を`requested_owner`へ改名し、社内利用者名だけを許すスキーマで不正形式を拒否する。","Rename `owner` to `requested_owner`, constrain its schema to corporate usernames, and reject values with invalid syntax.","誤り。入力形式の検証は必要でも、正しい形式の別利用者名を指定できるため、呼出主体とのオブジェクト単位認可になりません。"],
  ["D","モデルが渡す所有者を信頼せず、認証主体から出力先を導出するか権限を検証する。","Derive or authorize the destination from the authenticated principal instead of trusting the model-supplied owner.","正しい。オブジェクト単位認可をサーバー側で強制し、引数改ざんによる他者領域への出力を防ぎます。"],
  ["A","D"]],
[46,3,1,"Analyse observability challenges and select monitoring strategies at scale","保険請求エージェントは平均レイテンシ目標を満たしますが、文書ツールが再試行する場合だけp99が急増します。現行ログは要求全体時間と最終状態だけを記録し、ツールは別チームが管理しています。最も有用な可観測性変更はどれですか。","A claims agent meets average latency targets, but p99 spikes only when a document tool retries. Current logs record total request time and final status, while the tool is managed by another team. Which observability change is most useful?",
  ["A","遅い要求のプロンプトと応答全文を記録し、内容量を要求全体の経過時間および最終状態と関連付ける。","Log complete prompts and responses for slow requests, then correlate content size with request-level elapsed time and final status.","誤り。内容量との相関分析はできますが、再試行ごとの待ち時間や別チームとの境界を分解できず、機密情報も増やします。"],
  ["B","日次トークン総量、モデル遅延、最終エラー件数、要求量を、選択モデル別にまとめたダッシュボードを作る。","Build a daily dashboard of token totals, model latency, final error counts, and request volume grouped by selected model.","誤り。モデル別の費用・傾向には有用ですが、文書ツール内部の再試行とテール遅延の構成要素を特定できません。"],
  ["C","相関IDを伝播し、試行ごとにキュー・ネットワーク・実行時間、再試行理由、秘匿化した状態属性を持つspanを出す。","Propagate a correlation ID and emit per-attempt spans with queue, network, execution, retry reason, and redacted status attributes.","正しい。要求をチーム境界越しに追跡し、p99を構成する各段階と再試行を直接切り分けられます。"],
  ["D","最終失敗は完全なトレースを保持し、再試行後に成功した要求は全体時間とツール名だけを保存する。","Retain full traces for final failures, but store only total duration and tool name when a retried request eventually succeeds.","誤り。保存量は抑えられますが、今回問題となる最終成功要求から試行別情報を落とし、p99急増の原因を観測できません。"],
  ["C"]],
