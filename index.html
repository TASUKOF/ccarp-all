<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1117">
  <title>CCAR-P マスター問題集 (全84問・用語辞典統合版)</title>
  <style>
:root {
  --bg: #0f1117;
  --card: #171b24;
  --card2: #1f2430;
  --line: #2b3242;
  --tx: #e6e9f0;
  --muted: #9aa3b5;
  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.15);
  --good: #3fb950;
  --good-soft: rgba(63, 185, 80, 0.15);
  --bad: #f85149;
  --bad-soft: rgba(248, 81, 73, 0.15);
  --warn: #d29922;
  --warn-soft: rgba(210, 153, 34, 0.15);
  --mono: "SFMono-Regular", Consolas, "Cascadia Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--sans); line-height: 1.7; font-size: 15px; }
button, select, input { font: inherit; }
button { cursor: pointer; border: 1px solid var(--line); border-radius: 8px; background: var(--card2); color: var(--tx); padding: 8px 14px; transition: .15s; user-select: none; }
button:hover { border-color: var(--accent); }
button.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
button.pri:hover { opacity: .9; }
button.sec { background: transparent; border-color: var(--line); color: var(--muted); }
button.sec:hover { color: var(--tx); border-color: var(--muted); }
button.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .35; cursor: not-allowed; }

.wrap { max-width: 920px; margin: 0 auto; padding: 16px 16px 120px; }
header.top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.brand { font-size: 17px; font-weight: 800; letter-spacing: -.02em; color: #fff; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--card2); border: 1px solid var(--line); color: var(--accent); font-family: var(--mono); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
.lbl { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media(max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

.filter-btn { text-align: left; padding: 12px; line-height: 1.4; }
.filter-btn b { display: block; font-size: 14px; margin-bottom: 3px; color: #fff; }
.filter-btn span { font-size: 11px; color: var(--muted); }

/* クイック操作バー（画面上部） */
.quickNav { display: flex; justify-content: space-between; align-items: center; background: var(--card2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; }
.progress-bar { height: 5px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.progress-fill { height: 100%; background: var(--accent); transition: width .2s; }

.meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 5px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); }
.tag.domain { color: var(--accent); border-color: rgba(217,119,87,.4); }

.q-main { font-size: 16px; font-weight: 700; line-height: 1.7; margin: 8px 0; color: #fff; white-space: pre-line; }
.q-sub { font-size: 13px; color: var(--muted); font-style: italic; line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }

.options { display: grid; gap: 10px; margin-top: 20px; }
.option { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; width: 100%; padding: 14px; border: 1px solid var(--line); background: var(--card2); border-radius: 9px; text-align: left; transition: .12s; }
.option:hover { border-color: var(--accent); }
.option.selected { border-color: var(--accent); background: var(--accent-soft); }
.option.correct-answer { border-color: var(--good) !important; background: var(--good-soft) !important; }
.option.wrong-answer { border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.opt-key { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-weight: 700; font-family: var(--mono); color: var(--muted); }
.option.selected .opt-key { border-color: var(--accent); color: var(--accent); }
.option.correct-answer .opt-key { border-color: var(--good); color: var(--good); }
.option.wrong-answer .opt-key { border-color: var(--bad); color: var(--bad); }
.opt-body { font-size: 14px; }
.opt-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; }

/* フィードバック・解説 */
.feedback { margin-top: 24px; padding: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); }
.feedback.ok { border-color: var(--good); background: var(--good-soft); }
.feedback.ng { border-color: var(--bad); background: var(--bad-soft); }
.feedback.skip { border-color: var(--warn); background: var(--warn-soft); }
.feedback-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.feedback.ok .feedback-title { color: var(--good); }
.feedback.ng .feedback-title { color: var(--bad); }
.feedback.skip .feedback-title { color: var(--warn); }
.rationale-list { display: grid; gap: 10px; margin-top: 14px; }
.rationale-item { padding: 12px; border-radius: 7px; background: rgba(0,0,0,.25); border-left: 3px solid var(--line); font-size: 13.5px; }
.rationale-item.is-correct { border-left-color: var(--good); }
.rationale-item.is-selected-wrong { border-left-color: var(--bad); }

/* 用語タグ */
.terms-wrap { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.term-chip { display: inline-block; font-size: 11px; padding: 3px 9px; margin: 0 5px 6px 0; border-radius: 6px; background: rgba(217,119,87,.12); border: 1px solid rgba(217,119,87,.35); color: var(--accent); cursor: pointer; }
.term-chip:hover { background: var(--accent); color: #fff; }
.term-popup { display: none; background: #12151c; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 6px 0 10px; font-size: 13px; }
.term-popup.open { display: block; }
.term-popup .en { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-bottom: 4px; }

/* 下部固定ナビ */
.nav-fixed { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,17,23,.95); border-top: 1px solid var(--line); padding: 10px 16px; backdrop-filter: blur(10px); z-index: 50; }
.nav-in { max-width: 920px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.nav-in .sp { flex: 1; }

/* モーダル */
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 680px; max-height: 85vh; display: flex; flex-direction: column; padding: 20px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; overflow-y: auto; padding: 6px 2px; }
.q-box { aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--card2); font-size: 12px; font-weight: 700; font-family: var(--mono); color: var(--muted); cursor: pointer; }
.q-box.cur { outline: 2px solid var(--accent); border-color: var(--accent); color: #fff; }
.q-box.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.q-box.ng { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.q-box.seen { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

.hide { display: none !important; }
.big-num { font-size: 42px; font-weight: 800; text-align: center; margin: 8px 0; font-family: var(--mono); }
  </style>
</head>
<body>

<div class="wrap">
  <header class="top-bar">
    <div class="brand" onclick="goHome()" style="cursor:pointer">
      <span>CCAR-P マスター問題集</span>
      <span class="badge">精選84問</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="sec" style="font-size:12px;padding:5px 9px" onclick="openGlossaryModal()">📚 用語辞典</button>
      <select id="langSelect" onchange="changeLang(this.value)" style="background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px">
        <option value="ja">日本語メイン</option>
        <option value="both">日英併記</option>
        <option value="en">English Main</option>
      </select>
    </div>
  </header>

  <div id="app"></div>
</div>

<div class="nav-fixed hide" id="navFixed">
  <div class="nav-in" id="navIn"></div>
</div>

<!-- 問題ジャンプモーダル -->
<div class="modal hide" id="qModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <b style="font-size:16px">問題マップ (全84問)</b>
      <button class="sec" style="padding:4px 10px" onclick="closeModal()">✕ 閉じる</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
      🟩 正解 / 🟥 不正解 / 🟧 答え確認済 / ⬜ 未着手 / [枠] 現在地
    </div>
    <div class="q-grid" id="qGrid"></div>
  </div>
</div>

<!-- 用語辞典モーダル -->
<div class="modal hide" id="glossaryModal" onclick="if(event.target===this)closeGlossaryModal()">
  <div class="modal-box">
    <div class="modal-head">
      <b style="font-size:16px">CCAR-P 必須用語辞典 (全60語)</b>
      <button class="sec" style="padding:4px 10px" onclick="closeGlossaryModal()">✕ 閉じる</button>
    </div>
    <input type="text" id="glossarySearch" placeholder="用語を検索 (例: caching, 認可, p95...)" oninput="filterGlossary(this.value)" style="width:100%;padding:8px 12px;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:7px;margin-bottom:12px">
    <div id="glossaryList" style="overflow-y:auto;display:grid;gap:10px;padding-right:4px"></div>
  </div>
</div>

<script>
/* ============================================================
   1. 用語辞典データ (G)
   ============================================================ */
const G = {
"service-account":{en:"Shared service account",ja:"共有サービスアカウント",d:"プログラム用の共通ID。便利だが全員が同じ強い権限になるため、①本来見えないデータに届く ②誰の操作か分からない、の2つを同時に生む。試験では<b>ほぼ常に「悪い現状」</b>として登場する。"},
"identity-propagation":{en:"Identity propagation / on-behalf-of",ja:"認可の伝播",d:"エージェントが外部APIを叩くとき、<b>エージェント自身ではなく「依頼した人間ユーザー」の権限で</b>実行させること。代理で窓口に行くとき、本人の身分証を持っていくイメージ。"},
"scoped-credential":{en:"Scoped credential / short-lived token",ja:"スコープ限定の資格情報",d:"「この人の・この操作だけ」に絞った短命の鍵。マスターキーではなく特定の部屋だけ開く鍵。漏れても被害範囲が小さい。"},
"privilege-escalation":{en:"Privilege escalation",ja:"権限昇格",d:"本来持っていないはずの権限を手に入れてしまうこと。共有アカウント運用で最も起きやすい。"},
"attack-surface":{en:"Attack surface",ja:"攻撃面",d:"攻撃されうる入口の総量。<b>ログや確認ダイアログを足しても攻撃面は減らない</b>（能力が残っているから）。"},
"least-privilege":{en:"Least privilege",ja:"最小権限",d:"必要な権限だけを与える原則。CCAR-Pでは<b>「監視する」ではなく「能力そのものを消す」</b>ことを指す。"},
"deterministic":{en:"Deterministic enforcement",ja:"決定論的強制",d:"「絶対に」を満たせるのはコード・スキーマ・権限だけ。<b>promptはお願いであって保証ではない。</b>この原則だけで解ける問題が毎回複数出る。"},
"acl":{en:"ACL (Access Control List)",ja:"アクセス制御リスト",d:"「この文書は誰が見てよいか」の一覧。RAGでは<b>検索する前に</b>これで絞る(pre-filter)のが正解。"},
"pre-filter":{en:"Pre-filter / metadata filtering",ja:"事前フィルタ",d:"検索段階で権限外の文書を候補から外すこと。生成後に隠すのでは、ログ・キャッシュ・traceに残って漏洩経路になる。"},
"fail-closed":{en:"Fail closed",ja:"安全側に倒す",d:"判断がつかないときは「許可しない」側で止める設計。逆はfail open（危険）。"},
"prompt-injection":{en:"Prompt injection",ja:"プロンプトインジェクション",d:"外部データ（PDF・Web・メール）に「全部消せ」等の指示文を仕込みAIを乗っ取る攻撃。<b>最終防衛線は危険なtoolを最初から与えないこと。</b>"},
"audit-trail":{en:"Audit trail / provenance",ja:"監査証跡",d:"「誰が・いつ・どの版で・何を承認して・何が起きたか」を後から再構成できる記録。<b>量ではなく再構成可能性</b>が本質。"},
"tool-use-loop":{en:"Tool use loop",ja:"ツール実行ループ",d:"①tool定義を渡す→②モデルがtool_useを返す→③<b>アプリが実際に実行</b>→④tool_resultを返す→⑤最終応答。<b>モデルはtoolを実行しない</b>ので権限チェックはアプリ側の責任。"},
"capability-bloat":{en:"Capability bloat",ja:"能力の肥大化",d:"toolを付けすぎた状態。①選択ミスが増える ②contextを食う ③攻撃面が広がる、の三重苦。"},
"trace":{en:"Trace / span",ja:"トレース・スパン",d:"<b>1タスク＝1本の記録(trace)</b>。その中の1工程（LLM呼出1回、tool実行1回）がspan。これが無いと「どのステップで壊れたか」が言えない。"},
"observability":{en:"Observability",ja:"可観測性",d:"外から内部状態が分かること。<b>再現できない不具合は直せない</b>ので、観測設計＝デバッグ能力。"},
"p95":{en:"p95 / tail latency",ja:"95パーセンタイル遅延",d:"<b>平均は遅さを隠す。</b>平均1.1秒でもp95が4秒なら20回に1回は遅い。SLAは通常p95で定義するので、監視もp95で行う。"},
"sampling":{en:"Sampling / tiered logging",ja:"サンプリング・階層化ログ",d:"大規模では<b>メトリクスは全件・詳細payloadはサンプリング＋エラー時のみ・PIIはマスキング＋保持期間</b>の3階層が定石。"},
"pii":{en:"PII",ja:"個人情報",d:"氏名・住所・カルテなど個人を特定できる情報。ログに生で残すのは規制違反になりうる。"},
"stop-reason":{en:"stop_reason",ja:"停止理由",d:"応答が終わった理由。end_turn=自然終了 / max_tokens=上限で切れた / tool_use=ツールを呼びたい。<b>max_tokens打ち切りは品質障害の重要シグナル。</b>"},
"aggregate-mask":{en:"Aggregate masks segments",ja:"集約値はセグメントを隠す",d:"全体95%でも特定業種だけ60%という構造は頻出。必ず言語別・文書種別・顧客別に割って見る。公平性検証も同じ論法。"},
"prompt-caching":{en:"Prompt caching",ja:"プロンプトキャッシュ",d:"同じ前置きの<b>計算結果</b>を再利用し、コスト減＋初回応答(TTFT)短縮。<b>送信を省略するのではない</b>——毎回全部送る。"},
"stable-prefix":{en:"Stable prefix",ja:"安定した接頭部",d:"キャッシュは<b>先頭からの完全一致</b>にしか効かない。配置は【固定:system→policy→tools→few-shot】→【可変:履歴・入力】。<b>タイムスタンプ混入で即死。</b>"},
"modular-prompt":{en:"Modular prompt",ja:"モジュラープロンプト",d:"共通ブロックを1箇所に定義して参照する方式。目的は<b>内容の再利用（更新の一元化）</b>。cachingとは目的が違う。"},
"agent-skills":{en:"Agent Skills",ja:"エージェントスキル",d:"手順・資料・スクリプトをまとめた再利用単位。<b>必要な時だけ読み込む</b>ので常時のcontext消費を抑えられる。"},
"single-source":{en:"Single source of truth",ja:"単一の正本",d:"「コピーして配る」は再利用ではない（更新が追随しない）。<b>一元定義＋参照</b>が正解。"},
"progressive-discovery":{en:"Progressive discovery",ja:"段階的発見（必要時取得）",d:"必要になった時に取りに行く方式。<b>量が多く可変性が高い</b>情報に適する。"},
"monolithic-context":{en:"Monolithic context",ja:"一括投入",d:"最初から全部contextに積む方式。<b>小さく安定した</b>情報にのみ適する。「入ること」と「有効であること」は別。"},
"context-window":{en:"Context window",ja:"コンテキストウィンドウ",d:"1リクエストに入る上限。<b>容量であり予算でもある</b>——無関係な文脈は精度を下げ、コストとlatencyを増やす。"},
"router":{en:"Router",ja:"ルーター",d:"入力の難易度で「定型は小型モデル／複雑は上位モデル」に振り分ける仕組み。<b>単一モデル統一は必ずコストか精度を犠牲にする。</b>"},
"extended-thinking":{en:"Extended thinking",ja:"拡張思考",d:"推論量を増やす設定。コストとlatencyを押し上げるので<b>常時ONにしない</b>。思考トークン量は品質指標ではない。"},
"message-batches":{en:"Message Batches",ja:"メッセージバッチ",d:"大量リクエストをまとめて非同期処理する仕組み。<b>判断は「人が待っているか」の一点</b>——待っている=同期、待っていない=batch。"},
"streaming":{en:"Streaming",ja:"ストリーミング",d:"生成され次第トークンを送る方式。<b>体感待ち時間は改善するが、総処理時間もコストも変わらない。</b>"},
"non-inferiority":{en:"Non-inferiority margin",ja:"非劣性マージン",d:"「ここまでの精度低下なら許容する」と<b>事前に</b>決める数値。モデル変更の判断に必須。"},
"representative-eval":{en:"Representative eval set",ja:"代表評価セット",d:"本番の入力分布を反映したテストデータ。<b>公開ベンチマークは自タスクを代表しない。</b>過去の障害事例を必ず入れる。"},
"llm-as-judge":{en:"LLM-as-judge",ja:"LLMによる採点",d:"AIに採点させる方式。<b>判定者も検証対象</b>——人手ラベルとの一致率を確認してから信用する。"},
"regression-test":{en:"Regression test",ja:"回帰テスト",d:"変更で既存機能が壊れていないか確認するテスト。<b>prompt変更もコード変更と同じ</b>——eval setをCIで回してから出す。"},
"canary":{en:"Canary / shadow",ja:"カナリア・シャドー",d:"本番の数%だけ新版に流す(canary)、裏で並走させ結果は返さず比較(shadow)。<b>比較対象を残す</b>のが要点。"},
"mcp":{en:"MCP (Model Context Protocol)",ja:"MCP",d:"モデルと外部データ・機能をつなぐ標準規格。<b>resources=読む(副作用なし)／tools=実行する(副作用あり)</b>。接続方式であって<b>認可の仕組みではない</b>。"},
"a2a":{en:"Agent-to-agent",ja:"エージェント間通信",d:"自律的な相手に作業を委譲する方式。最も自由度が高く、<b>最も観測とデバッグが難しい</b>。"},
"rag":{en:"RAG",ja:"検索拡張生成",d:"関連文書を検索してからモデルに渡す方式。<b>自信満々の誤答はまずretrievalを疑う。</b>診断順: recall→precision/rerank→chunk→引用強制→最後にモデル。"},
"stale-chunk":{en:"Stale chunks",ja:"古い断片",d:"再インデックス失敗で残った旧版の文書断片。<b>文書更新直後</b>の品質劣化の典型原因。"},
"hybrid-search":{en:"Hybrid search",ja:"ハイブリッド検索",d:"キーワード検索＋ベクトル検索の併用。<b>型番・エラーコードのような完全一致はベクトルが最も苦手。</b>"},
"discovery":{en:"Structured discovery",ja:"構造化ディスカバリー",d:"解ではなく<b>問題</b>を特定する工程。必ず聞く5点＝①現状フロー②件数③失敗時の影響④既存の判断基準⑤成功の測り方。"},

{"id":1,"code":"Q01","domain":DOMAINS[1],"taskFocus":"Select appropriate architectural patterns (workflow, agentic, augmented LLM)","selectionCount":1,"question":{"en":"A standards team must answer questions about a single 1,100-page engineering specification. After removing appendices, the entire authoritative text fits within the chosen model's context window. Questions often combine a definition near the beginning, an exception in the middle, and a compatibility table near the end. During regulatory review, omitting a relevant provision matters more than input cost or p95 latency. Which initial architecture is MOST appropriate?","ja":"標準化チームは、1冊の1,100ページの技術仕様に関する質問へ回答する必要があります。付録を除くと、正式な本文全体が選択モデルのコンテキストウィンドウに収まります。質問では、冒頭の定義、中盤の例外、終盤の互換性表を組み合わせることがよくあります。規制レビュー中は、入力コストやp95レイテンシより関連規定の見落とし回避が重要です。初期アーキテクチャとして最も適切なものはどれですか。"},"options":[{"key":"A","en":"Index paragraph embeddings and return the highest-scoring passages, with a second broader search only when confidence falls below a threshold.","ja":"段落埋め込みを索引化して上位の一連の文章を返し、信頼度が閾値未満の場合だけ2回目の広域検索を行う。","rationale":"誤り。段階的な検索は通常のRAGでは合理的ですが、離れた規定を結ぶ問いでは信頼度が高くても必要箇所を落とし得るため、見落とし回避を最優先する条件に合いません。"},{"key":"B","en":"Create a planning agent that alternates keyword and vector searches until a self-evaluated coverage score reaches a threshold.","ja":"自己評価した網羅度が閾値に達するまで、キーワード検索とベクトル検索を交互に行う計画エージェントを作る。","rationale":"誤り。反復検索は全文が収まらない資料では有力ですが、自己評価の停止条件と追加の複雑性があり、全文を直接扱える本件では最初の選択として過剰です。"},{"key":"C","en":"Fine-tune on prior interpretations of the specification and retrieve source paragraphs only when the model expresses low confidence.","ja":"仕様の過去解釈でファインチューニングし、モデルが低信頼を示した場合だけ原文段落を検索する。","rationale":"誤り。学習済み解釈は正式本文の完全な代替ではなく、自己申告の信頼度も根拠欠落を確実に検知しません。規制レビューの引用可能性も弱まります。"},{"key":"D","en":"Provide the complete authoritative text with stable section identifiers and require citations to supporting sections or tables.","ja":"安定した節識別子を付けた正式本文全体を渡し、回答には根拠となる節または表の引用を必須とする。","rationale":"正しい。全文が収まり、離れた箇所の横断参照と検索漏れ回避がコストや速度より優先されます。識別子付き全文コンテキストが最も単純で監査可能です。"}],"correct":["D"],"tm":["monolithic-context","rag","context-window"]},
{"id":2,"code":"Q02","domain":DOMAINS[1],"taskFocus":"Select appropriate architectural patterns (workflow, agentic, augmented LLM)","selectionCount":1,"question":{"en":"A publisher converts manuscripts through a mandated sequence: classify rights status, redact restricted excerpts, obtain legal approval when redactions occur, and create distribution files. The sequence and approval condition are fixed, while Claude is useful for classification and redaction suggestions. Which architecture BEST fits?","ja":"出版社は原稿を、権利状態の分類、制限対象引用の墨消し、墨消しがある場合の法務承認、配布ファイル作成という必須順序で処理します。順序と承認条件は固定されていますが、Claudeは分類と墨消し候補の提示に有用です。最も適したアーキテクチャはどれですか。"},"options":[{"key":"A","en":"Give a publishing agent every tool and describe the preferred sequence in its role prompt.","ja":"出版エージェントに全ツールを与え、役割プロンプトで望ましい順序を説明する。","rationale":"誤り。順序をプロンプトで望ましいものとして示すだけでは、法務承認を含む必須遷移を構造的に強制できません。"},{"key":"B","en":"Use application-controlled prompt chaining with validation gates, auditable state transitions, and a deterministic legal-approval branch.","ja":"検証ゲート、監査可能な状態遷移、決定論的な法務承認分岐を持つ、アプリケーション制御のプロンプトチェーンを使う。","rationale":"正しい。固定サブタスクにはワークフローが適し、アプリケーション側のゲートと状態遷移で順序と承認を監査可能に強制しつつ、限定工程だけClaudeへ任せられます。"},{"key":"C","en":"Run classification and file creation in parallel, then ask legal counsel to reconcile any redaction differences.","ja":"分類とファイル作成を並列実行し、墨消しの差異を法務担当者に調整させる。","rationale":"誤り。ファイル作成は権利分類・墨消し・条件付き承認の後でなければならず、並列化は明示された依存順序を破ります。"},{"key":"D","en":"Use an evaluator-optimizer loop that rewrites each manuscript until a model grader approves its legal readiness and distribution quality.","ja":"モデルgraderが法的準備状況と配布品質を承認するまで、各原稿を書き直すevaluator-optimizerループを使う。","rationale":"誤り。反復改善は文章品質には有効ですが、規定された法務承認をモデルgraderに置き換え、固定業務フローにも余分な反復を加えます。"}],"correct":["B"],"tm":["deterministic","hitl","e2e"]},
{"id":3,"code":"Q03","domain":DOMAINS[1],"taskFocus":"Design multi-agent systems and orchestration strategies","selectionCount":2,"question":{"en":"A due-diligence platform uses independent finance, cybersecurity, and litigation specialists. Their searches can run concurrently, but the final risk memo must preserve each finding's evidence and expose contradictions rather than silently choosing one result. Which TWO choices BEST support the design? Select TWO.","ja":"デューデリジェンス基盤では、財務、サイバーセキュリティ、訴訟の独立した専門エージェントを使います。検索は並行実行できますが、最終リスクメモでは各所見の証拠を保持し、矛盾する結果を黙って一方に決めず明示する必要があります。設計を最も適切に支える選択を2つ選んでください。2つ選択してください。"},"options":[{"key":"A","en":"Give every specialist all data connectors and a shared scratchpad so any one can fill gaps discovered by another.","ja":"各専門エージェントに全データコネクターと共有スクラッチパッドを与え、他者が見つけた欠落をどの担当でも補えるようにする。","rationale":"誤り。柔軟性は増しますが、専門境界と最小能力を弱め、共有途中情報による相互汚染、重複検索、不適切なツール選択を招きます。"},{"key":"B","en":"Let specialists exchange free-form drafts during execution and accept the longest final narrative.","ja":"実行中に専門エージェント同士で自由形式の草稿を交換し、最も長い最終記述を採用する。","rationale":"誤り。草稿共有は協調に使えますが、証拠契約も矛盾検出規則もなく、長さは正確性や網羅性の基準になりません。"},{"key":"C","en":"Scope each specialist to domain-specific context, least-privilege connectors, and an explicit finding-output contract.","ja":"各専門エージェントを領域固有のコンテキスト、最小権限コネクター、明示的な所見出力契約に限定する。","rationale":"正しい。責務、能力、出力の境界を明確にし、無関係なデータやツールによる混乱を抑えながら独立調査を並列化できます。"},{"key":"D","en":"Require a shared finding schema with source IDs and confidence, then have an orchestrator flag conflicts before synthesis.","ja":"出典IDと信頼度を含む共通所見スキーマを必須とし、統合前にオーケストレーターが競合を明示する。","rationale":"正しい。共通契約で証拠を失わず集約でき、専用オーケストレーターが矛盾を隠さず最終メモへ渡せます。"}],"correct":["C","D"],"tm":["capability-bloat","least-privilege","audit-trail"]},
{"id":4,"code":"Q04","domain":DOMAINS[1],"taskFocus":"Apply decomposition techniques for complex problem solving","selectionCount":1,"question":{"en":"A grant-review assistant must first extract eligibility evidence, apply a published scoring formula, identify missing mandatory documents, and only then draft reviewer notes. A single prompt often invents a score when evidence is incomplete. Which redesign MOST directly addresses the failure?","ja":"助成金レビュー支援では、まず適格性の証拠を抽出し、公開済み採点式を適用し、必須文書の欠落を特定してから、レビュー所見を作成する必要があります。単一プロンプトは証拠不足時に得点を作り出すことがあります。障害へ最も直接対処する再設計はどれですか。"},"options":[{"key":"A","en":"Draft notes and provisional scores first, then have a second model remove entries that lack a direct quotation.","ja":"先に所見と暫定得点を作成し、その後、直接引用がない項目を第2モデルに削除させる。","rationale":"誤り。事後チェックは防御層になりますが、未検証得点を先に生成する順序であり、公開済み式の決定論的適用も保証しません。"},{"key":"B","en":"Run several complete reviews and use the median score when reviewers cite different evidence for the same criterion.","ja":"完全なレビューを複数回実行し、同じ基準で異なる証拠が引用された場合は得点の中央値を使う。","rationale":"誤り。複数回実行は分散を測れますが、証拠不足を解消せず、固定式の正しさを多数の生成結果で代替しています。"},{"key":"C","en":"Chain cited extraction, completeness validation, code-based scoring, and note drafting; block later stages whenever required evidence is absent.","ja":"引用付き抽出、完全性検証、コードによる採点、所見作成を連結し、必須証拠がなければ後続段階を停止する。","rationale":"正しい。証拠、完全性、決定論的計算、生成を分離し、欠落時のゲートを置くことで、流暢な所見が検証を追い越す根本原因を除きます。"},{"key":"D","en":"Expand the context window and include prior applications, scoring examples, award outcomes, and reviewer notes in a single generation call.","ja":"コンテキストウィンドウを拡大し、過去の申請、採点例、採択結果、レビュー所見を1回の生成呼び出しに含める。","rationale":"誤り。過去例や採択結果は判断の参考になっても、必須証拠の欠落や固定式適用の混在を解消せず、不要なコンテキストも増やします。"}],"correct":["C"],"tm":["deterministic","e2e","structured-outputs"]},
{"id":5,"code":"Q05","domain":DOMAINS[1],"taskFocus":"Align solutions to business value pillars (efficiency, productivity, cost, performance SLAs)","selectionCount":1,"question":{"en":"A logistics company wants to shorten customs-entry preparation. Eighty-seven percent of shipments use deterministic mappings from verified ERP fields to approved forms; the rest contain ambiguous product descriptions requiring interpretation. The filing API remains the system of record and has a strict response SLA. Which design BEST aligns value and complexity?","ja":"物流会社は税関申告準備を短縮したいと考えています。出荷の87%は検証済みERP項目から承認済み様式へ決定論的にマッピングでき、残りは解釈が必要な曖昧な商品説明を含みます。申告APIは引き続き信頼できる記録系で、厳格な応答SLAがあります。価値と複雑性を最も適切に整合させる設計はどれですか。"},"options":[{"key":"A","en":"Use deterministic mapping for standard shipments and route only ambiguous descriptions to Claude before API validation.","ja":"標準出荷には決定論的マッピングを使い、曖昧な説明だけをAPI検証前にClaudeへ振り分ける。","rationale":"正しい。大半を高速で確実な既存処理に残し、解釈が価値を持つ少数ケースだけClaudeへ送るため、SLA、コスト、生産性を両立します。"},{"key":"B","en":"Send all shipments to Claude, then compare every proposed field with the approved form and ERP record before filing.","ja":"全出荷をClaudeへ送り、申告前に提案された全項目を承認済み様式とERP記録に照合する。","rationale":"誤り。全項目の照合は安全性を高めますが、決定論的に処理できる87%にもモデルの遅延と変動を追加し、厳格なSLAに不利です。"},{"key":"C","en":"Send every ambiguous description to customs staff and use Claude only to rewrite completed forms.","ja":"曖昧な説明はすべて税関担当者へ送り、Claudeは完成済み様式の書き直しだけに使う。","rationale":"誤り。安全な部分解ですが、解釈補助によって人手時間を減らせる主要な価値を活かさず、書き直しは承認済み様式にも不要です。"},{"key":"D","en":"Replace verified ERP mappings with a semantic router trained on historical descriptions, retaining API validation before submission.","ja":"検証済みERPマッピングを過去の商品説明で訓練した意味的ルーターへ置き換え、送信前のAPI検証は残す。","rationale":"誤り。API検証を残しても、確実に処理できる大半を確率的ルーティングへ置き換える根拠がなく、複雑性と変動を増やします。"}],"correct":["A"],"tm":["router","deterministic","sla","tco"]}

<script>
/* ============================================================
   3. アプリケーション コアロジック
   ============================================================ */
let ALL_Q = [];
const STORAGE_KEY = "ccarp_master_exam_v2";

let S = {
  list: [],
  i: 0,
  ans: {},
  done: {},
  seenOnly: {},
  filter: "all",
  lang: "ja",
  autoCheck: true
};

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.ans) S.ans = d.ans;
    if (d.done) S.done = d.done;
    if (d.seenOnly) S.seenOnly = d.seenOnly;
  } catch(e){}
}
function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ ans: S.ans, done: S.done, seenOnly: S.seenOnly }));
  } catch(e){}
}

function $(id) { return document.getElementById(id); }
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

/* ホーム画面 */
function renderHome() {
  $("navFixed").className = "nav-fixed hide";
  closeModal();
  closeGlossaryModal();

  let totalAns = Object.keys(S.done).length;
  let correctCount = 0;
  ALL_Q.forEach(q => {
    if (S.done[q.id] && !S.seenOnly[q.id]) {
      const user = (S.ans[q.id] || []).slice().sort().join(",");
      const corr = (q.correct || []).slice().sort().join(",");
      if (user === corr) correctCount++;
    }
  });

  let h = `
    <div class="card">
      <div class="lbl">学習・出題フィルター</div>
      <div class="grid-2">
        <button class="filter-btn pri" onclick="startFilter('all')">
          <b>📘 全84問 完全演習</b>
          <span>基礎・新傾向・重要独自論点まですべて網羅</span>
        </button>
        <button class="filter-btn" onclick="startFilter('miss')">
          <b>🔁 誤答・要復習のみ</b>
          <span>間違えた問題を集中的に克服</span>
        </button>
        <button class="filter-btn" onclick="startFilter('unsolved')">
          <b>⬜ 未着手のみ</b>
          <span>まだ解いていない問題を進める</span>
        </button>
        <button class="filter-btn" onclick="startFilter('extra')">
          <b>🔑 必須急所論点 (Q79〜Q84)</b>
          <span>キャッシュ破壊・stale chunk・ストリーミングなど</span>
        </button>
      </div>

      <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)">
        <div class="lbl">ドメイン別演習</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${[1,2,3,4,5,6,7].map(dn => `
            <button class="sec" style="font-size:12px;padding:6px 10px" onclick="startFilter('d${dn}')">
              D${dn}: ${DOMAINS[dn].split('—')[1]}
            </button>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="lbl">操作オプション</div>
      <label style="cursor:pointer;display:flex;align-items:center;gap:8px">
        <input type="checkbox" ${S.autoCheck ? 'checked' : ''} onchange="S.autoCheck=this.checked">
        <span><b>スピード回答モード</b>（単一選択肢をタップした瞬間に即判定＆解説表示）</span>
      </label>
    </div>

    <div class="card">
      <div class="lbl">これまでの学習進捗</div>
      <div class="big-num" style="color:var(--accent)">
        ${totalAns ? Math.round((correctCount / totalAns) * 100) : 0}%
      </div>
      <div style="text-align:center;color:var(--muted);font-size:13px">
        正解 ${correctCount} / 着手 ${totalAns}問 (全84問中)
      </div>
      <div style="text-align:center;margin-top:14px">
        <button class="danger" style="font-size:12px;padding:5px 12px" onclick="resetAll()">進捗を消去</button>
      </div>
    </div>
  `;
  $("app").innerHTML = h;
}

function startFilter(type) {
  S.filter = type;
  if (type === "all") S.list = ALL_Q.slice();
  else if (type === "extra") S.list = ALL_Q.filter(q => q.id >= 79);
  else if (type === "unsolved") S.list = ALL_Q.filter(q => !S.done[q.id]);
  else if (type === "miss") {
    S.list = ALL_Q.filter(q => {
      if (!S.done[q.id] || S.seenOnly[q.id]) return false;
      const user = (S.ans[q.id] || []).slice().sort().join(",");
      const corr = (q.correct || []).slice().sort().join(",");
      return user !== corr;
    });
    if (!S.list.length) { alert("現在、誤答記録はありません！全問正解または未着手です。"); return; }
  } else if (type.startsWith("d")) {
    const dn = parseInt(type.replace("d",""), 10);
    S.list = ALL_Q.filter(q => q.domain.startsWith(`Domain ${dn}`));
  }
  S.i = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = S.list[S.i];
  if (!q) { renderHome(); return; }

  const fin = S.done[q.id];
  const isSeen = S.seenOnly[q.id];
  const userSel = S.ans[q.id] || [];
  const isCorrect = fin && !isSeen && (userSel.slice().sort().join(",") === q.correct.slice().sort().join(","));

  const qTextPrimary = S.lang === "en" ? q.question.en : q.question.ja;
  const qTextSecondary = S.lang === "both" ? q.question.en : null;

  let h = `
    <!-- 上部クイック操作バー -->
    <div class="quickNav">
      <span style="font-weight:700;font-size:13px;font-family:var(--mono);color:var(--muted)">
        ${S.i + 1} / ${S.list.length} (${q.code})
      </span>
      <div style="display:flex;gap:6px">
        <button class="sec" style="padding:4px 8px;font-size:12px" onclick="openModal()">📑 一覧</button>
        <button class="${fin ? 'pri' : ''}" style="padding:4px 10px;font-size:12px" onclick="go(1)">
          ${fin ? '次へ →' : 'スキップ →'}
        </button>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" style="width:${((S.i + 1) / S.list.length) * 100}%"></div>
    </div>

    <div class="card">
      <div class="meta-tags">
        <span class="tag domain">${q.domain}</span>
        <span class="tag">${q.taskFocus}</span>
        <span class="tag" style="color:var(--accent)">${q.selectionCount === 2 ? '2つ選択' : '1つ選択'}</span>
      </div>

      <div class="q-main">${esc(qTextPrimary)}</div>
      ${qTextSecondary ? `<div class="q-sub">${esc(qTextSecondary)}</div>` : ''}

      <div class="options">
  `;

  q.options.forEach(opt => {
    const isSelected = userSel.includes(opt.key);
    const isAnswerCorrect = fin && q.correct.includes(opt.key);
    const isSelectedWrong = fin && isSelected && !isAnswerCorrect;

    let cls = "option";
    if (isSelected) cls += " selected";
    if (isAnswerCorrect) cls += " correct-answer";
    if (isSelectedWrong) cls += " wrong-answer";

    const optPrimary = S.lang === "en" ? opt.en : opt.ja;
    const optSecondary = S.lang === "both" ? opt.en : null;

    h += `
      <div class="${cls}" onclick="tapOption('${opt.key}')">
        <span class="opt-key">${opt.key}</span>
        <div class="opt-body">
          <div>${esc(optPrimary)}</div>
          ${optSecondary ? `<span class="opt-sub">${esc(optSecondary)}</span>` : ''}
        </div>
      </div>
    `;
  });

  h += `</div>`;

  if (fin) {
    let feedCls = isSeen ? "skip" : (isCorrect ? "ok" : "ng");
    let feedTitle = isSeen ? "― 解答・解説の確認（スキップ）" : (isCorrect ? "✓ 正解です" : "✗ 不正解です");

    h += `
      <div class="feedback ${feedCls}">
        <div class="feedback-title">${feedTitle}</div>
        <div style="font-size:12px;font-family:var(--mono);color:var(--muted);margin-bottom:12px">
          あなたの回答: ${userSel.length ? userSel.join(", ") : "未選択"} ／ 正答: ${q.correct.join(", ")}
        </div>
        <div class="rationale-list">
    `;

    q.options.forEach(opt => {
      const expected = q.correct.includes(opt.key);
      const selWrong = userSel.includes(opt.key) && !expected;
      let rCls = "rationale-item";
      if (expected) rCls += " is-correct";
      if (selWrong) rCls += " is-selected-wrong";

      h += `
        <div class="${rCls}">
          <b>${opt.key}. ${esc(opt.ja)}</b>
          <div style="margin-top:4px;color:var(--muted)">${esc(opt.rationale)}</div>
        </div>
      `;
    });

    h += `</div>`;

    // 関連用語チップ
    if (q.tm && q.tm.length) {
      h += `
        <div class="terms-wrap">
          <div class="lbl">関連重要用語（タップで解説展開）</div>
          <div>
            ${q.tm.map(tid => G[tid] ? `<span class="term-chip" onclick="toggleTerm('${tid}')">${G[tid].ja}</span>` : '').join('')}
          </div>
          <div>
            ${q.tm.map(tid => G[tid] ? `
              <div class="term-popup" id="tp_${tid}">
                <div style="font-weight:700;color:var(--accent)">${G[tid].ja}</div>
                <div class="en">${G[tid].en}</div>
                <div>${G[tid].d}</div>
              </div>
            ` : '').join('')}
          </div>
        </div>
      `;
    }

    h += `</div>`;
  }

  h += `</div>`;
  $("app").innerHTML = h;

  // 下部固定ナビ
  $("navFixed").className = "nav-fixed";
  let nb = `
    <button class="sec" onclick="renderHome()">中断</button>
    <button ${S.i === 0 ? 'disabled' : ''} onclick="go(-1)">← 前へ</button>
    <span class="sp"></span>
  `;

  if (!fin) {
    nb += `<button class="sec" onclick="showDirectAnswer()">答えだけ見る</button>`;
    if (userSel.length > 0) {
      nb += `<button class="pri" onclick="submitAnswer()">解答する</button>`;
    }
    nb += `<button onclick="go(1)">${S.i === S.list.length - 1 ? '完了へ' : 'スキップ →'}</button>`;
  } else {
    nb += `<button class="pri" onclick="go(1)">${S.i === S.list.length - 1 ? '結果を見る' : '次へ →'}</button>`;
  }
  $("navIn").innerHTML = nb;
}

function toggleTerm(tid) {
  const el = $("tp_" + tid);
  if (!el) return;
  el.className = el.className.includes("open") ? "term-popup" : "term-popup open";
}

function tapOption(key) {
  const q = S.list[S.i];
  if (S.done[q.id]) return;

  let cur = S.ans[q.id] || [];
  if (q.selectionCount === 1) {
    S.ans[q.id] = [key];
    if (S.autoCheck) {
      submitAnswer();
      return;
    }
  } else {
    if (cur.includes(key)) cur = cur.filter(k => k !== key);
    else if (cur.length < 2) cur.push(key);
    else { cur.shift(); cur.push(key); }
    S.ans[q.id] = cur;
  }
  renderQuestion();
}

function submitAnswer() {
  const q = S.list[S.i];
  const cur = S.ans[q.id] || [];
  if (q.selectionCount === 2 && cur.length !== 2) {
    alert("この問題は2つ選択してください");
    return;
  }
  S.done[q.id] = 1;
  delete S.seenOnly[q.id];
  saveProgress();
  renderQuestion();
}

function showDirectAnswer() {
  const q = S.list[S.i];
  S.done[q.id] = 1;
  S.seenOnly[q.id] = 1;
  saveProgress();
  renderQuestion();
}

function go(step) {
  const nxt = S.i + step;
  if (nxt >= S.list.length) {
    showResultScreen();
    return;
  }
  if (nxt < 0) return;
  S.i = nxt;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  renderHome();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function changeLang(val) {
  S.lang = val;
  if (S.list.length && S.list[S.i]) renderQuestion();
}

function resetAll() {
  if (!confirm("これまでの全回答進捗を消去しますか？")) return;
  S.ans = {};
  S.done = {};
  S.seenOnly = {};
  saveProgress();
  renderHome();
}

/* モーダル関連 */
function openModal() {
  let h = "";
  S.list.forEach((q, idx) => {
    let cls = "q-box";
    if (idx === S.i) cls += " cur";
    if (S.done[q.id]) {
      if (S.seenOnly[q.id]) cls += " seen";
      else {
        const u = (S.ans[q.id] || []).slice().sort().join(",");
        const c = (q.correct || []).slice().sort().join(",");
        cls += (u === c) ? " ok" : " ng";
      }
    }
    h += `<div class="${cls}" onclick="jumpTo(${idx})">${idx + 1}</div>`;
  });
  $("qGrid").innerHTML = h;
  $("qModal").className = "modal";
}
function closeModal() { $("qModal").className = "modal hide"; }
function jumpTo(idx) {
  closeModal();
  S.i = idx;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* 用語辞典モーダル */
function openGlossaryModal() {
  filterGlossary("");
  $("glossaryModal").className = "modal";
}
function closeGlossaryModal() { $("glossaryModal").className = "modal hide"; }
function filterGlossary(q) {
  q = (q || "").toLowerCase();
  let h = "";
  Object.keys(G).forEach(k => {
    const item = G[k];
    if (!q || item.ja.toLowerCase().includes(q) || item.en.toLowerCase().includes(q) || item.d.toLowerCase().includes(q)) {
      h += `
        <div style="padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:8px">
          <div style="font-weight:700;color:var(--accent)">${item.ja}</div>
          <div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:4px">${item.en}</div>
          <div style="font-size:13px;color:var(--tx)">${item.d}</div>
        </div>
      `;
    }
  });
  $("glossaryList").innerHTML = h;
}

/* 結果画面 */
function showResultScreen() {
  $("navFixed").className = "nav-fixed hide";
  closeModal();

  let c = 0, total = S.list.length;
  let domainStats = {};

  S.list.forEach(q => {
    const dName = q.domain;
    if (!domainStats[dName]) domainStats[dName] = { c: 0, t: 0 };
    domainStats[dName].t++;

    const u = (S.ans[q.id] || []).slice().sort().join(",");
    const corr = (q.correct || []).slice().sort().join(",");
    if (S.done[q.id] && !S.seenOnly[q.id] && u === corr) {
      c++;
      domainStats[dName].c++;
    }
  });

  const pct = Math.round((c / total) * 100);
  let h = `
    <div class="card" style="text-align:center;padding:32px 16px">
      <div class="lbl">演習結果</div>
      <div class="big-num" style="color:${pct >= 80 ? 'var(--good)' : pct >= 70 ? 'var(--warn)' : 'var(--bad)'}">
        ${pct}%
      </div>
      <div style="font-size:14px;color:var(--muted)">正解 ${c} / ${total} 問</div>
      <div style="margin-top:16px">
        <button class="pri" onclick="startFilter('miss')">誤答・未確認のみ復習</button>
        <button class="sec" onclick="renderHome()">ホームへ戻る</button>
      </div>
    </div>

    <div class="card">
      <div class="lbl">領域別達成度</div>
      <div style="display:grid;gap:8px;margin-top:10px">
  `;

  Object.keys(domainStats).forEach(d => {
    const st = domainStats[d];
    const dpct = Math.round((st.c / st.t) * 100);
    h += `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">
        <span>${d}</span>
        <b style="font-family:var(--mono);color:${dpct >= 75 ? 'var(--good)' : 'var(--warn)'}">${st.c}/${st.t} (${dpct}%)</b>
      </div>
    `;
  });

  h += `</div></div>`;
  $("app").innerHTML = h;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* キーボードショートカット */
window.addEventListener("keydown", function(e) {
  if (!$("qModal").classList.contains("hide")) {
    if (e.key === "Escape") closeModal();
    return;
  }
  if (!$("glossaryModal").classList.contains("hide")) {
    if (e.key === "Escape") closeGlossaryModal();
    return;
  }
  if ($("navFixed").classList.contains("hide")) return;

  const key = e.key.toLowerCase();
  const q = S.list[S.i];
  if (!q) return;

  if (["1", "a"].includes(key)) tapOption("A");
  else if (["2", "b"].includes(key)) tapOption("B");
  else if (["3", "c"].includes(key)) tapOption("C");
  else if (["4", "d"].includes(key)) tapOption("D");
  else if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    go(1);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    go(-1);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (!S.done[q.id]) {
      if (S.ans[q.id] && S.ans[q.id].length) submitAnswer();
      else showDirectAnswer();
    } else {
      go(1);
    }
  }
});
